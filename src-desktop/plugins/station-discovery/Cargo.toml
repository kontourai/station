[package]
name = "tauri-plugin-station-discovery"
version = "0.1.0"
description = "Bounded DNS-SD discovery for Station native clients"
edition = "2021"
publish = false
links = "tauri-plugin-station-discovery"

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[dependencies]
tauri = { version = "=2.12.1" }

[target.'cfg(target_os = "windows")'.dependencies]
mdns-sd = { version = "=0.22.0", default-features = false }
serde = { version = "1", features = ["derive"] }
