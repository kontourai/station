"$schema" = "schemas/schema.json"

[default]
description = "Read capability status, register the device for agent-activity delivery, open Live Update settings, and take the session a card tap asked to open (`take_launch_route`, plus listening for the `launchRoute` nudge). `preview` is not included: it renders an arbitrary payload and exists for device verification only."
permissions = [
  "allow-status",
  "allow-configure",
  "allow-clear",
  "allow-push-token",
  "allow-open-live-update-settings",
  "allow-take-launch-route",
  "allow-register-listener",
  "allow-remove-listener",
]
