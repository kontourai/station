name: station
options:
  bundleIdPrefix: io.kontourai.station
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Station
      PRODUCT_BUNDLE_IDENTIFIER: io.kontourai.station
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  station_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        excludes:
          - "**/*.a"
      - path: station_iOS
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: station_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Station uses the camera to scan pairing codes from another device.
        NSMicrophoneUsageDescription: Station uses the microphone for voice conversations with your agents.
        NSLocalNetworkUsageDescription: Station connects to Station hosts on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Station uses only standard HTTPS/WSS transport; it does not implement
        # proprietary encryption, so Apple's standard export-compliance exemption applies.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: station_iOS/station_iOS.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER).agentactivity
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - target: StationAgentActivity
        embed: true
      - sdk: ActivityKit.framework
        weak: true
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  StationAgentActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../../ios/StationAgentActivity
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: ../../plugins/agent-activity/ios/Sources/StationAgentActivityShared
    settings:
      base:
        STATION_APP_BUNDLE_IDENTIFIER: io.kontourai.station
        PRODUCT_BUNDLE_IDENTIFIER: $(STATION_APP_BUNDLE_IDENTIFIER).AgentActivity
        PRODUCT_NAME: StationAgentActivity
        INFOPLIST_FILE: ../../ios/StationAgentActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../ios/StationAgentActivity/StationAgentActivity.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: false
        ARCHS:
          - arm64
        SKIP_INSTALL: true
    postBuildScripts:
      - name: Use the app version
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(PROJECT_DIR)/station_iOS/Info.plist
        script: |
          set -eu
          app_plist="$PROJECT_DIR/station_iOS/Info.plist"
          built_plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          for key in CFBundleShortVersionString CFBundleVersion; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app_plist")
            case "$value" in
              ''|*'$('*) echo "error: the app's $key is not a literal version: $value" >&2; exit 1 ;;
            esac
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$built_plist"
          done
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
