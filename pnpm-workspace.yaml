packages:
  - packages/contracts
  - packages/sdk
  - packages/basis-pane
  - packages/board-pane
  - packages/shared
  - packages/cli
  - packages/connect
  - packages/telemetry-broker
  - packages/monument
  - packages/agent-runtime
  - packages/supervisor
  - examples/builder-delivery-viewer
  - examples/fieldwork-review
linkWorkspacePackages: true
nodeLinker: hoisted
packageImportMethod: clone-or-copy
verifyDepsBeforeRun: false
ignoreScripts: true
engineStrict: true
allowBuilds:
  esbuild@0.25.12: true
  cpu-features@0.0.10: false
  esbuild@0.28.1: true
  esbuild@0.28.2: true
  fsevents@2.3.3: true
  koffi@3.3.7: false
  libxmljs2@0.37.0: false
  node-pty@1.2.0-beta.18: true
  protobufjs@7.6.5: false
  ssh2@1.17.0: false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Kontour-owned releases are exempt; third-party packages retain the 24-hour floor.
  - '@kontourai/*'
pmOnFail: ignore
# pdfjs-dist renders in the browser; its optional @napi-rs/canvas binding is
# only for Node-side rendering, which Station never does. Keep the native
# binary out of every install.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
  # @github/copilot-sdk's per-platform packages embed the proprietary Copilot
  # CLI runtime and Microsoft OneAuth binaries (whose terms forbid
  # redistribution) despite an MIT label. Station runs the person's own
  # installed Copilot CLI instead, so none of them is ever installed or
  # shipped. See docs/decisions/copilot-sdk-engine.md.
  - '@github/copilot-sdk-darwin-arm64'
  - '@github/copilot-sdk-darwin-x64'
  - '@github/copilot-sdk-linux-arm64'
  - '@github/copilot-sdk-linux-x64'
  - '@github/copilot-sdk-linuxmusl-arm64'
  - '@github/copilot-sdk-linuxmusl-x64'
  - '@github/copilot-sdk-win32-arm64'
  - '@github/copilot-sdk-win32-x64'
overrides:
  '@changesets/cli>launch-editor': 2.14.2
  # @github/copilot-sdk pins koffi 3.3.6 for its experimental in-process
  # transport, which Station never uses (copilot-sdk-port.ts). Share the one
  # reviewed koffi (config/dependency-lifecycle-allowlist.json) instead of
  # adding a second, unreviewed install hook.
  '@github/copilot-sdk>koffi': 3.3.7
  '@kontourai/survey>@modelcontextprotocol/server': 2.4.0
  http-cache-semantics: 4.3.0
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/sdk': 1.32.2
  '@modelcontextprotocol/client>zod': ^4.6.6
  '@modelcontextprotocol/core>zod': ^4.6.6
  '@modelcontextprotocol/server>zod': ^4.6.6
  shell-quote: 1.11.0
  '@grpc/grpc-js': ^1.14.5
  adm-zip: ^0.6.0
  axios: ^1.20.0
  axios>follow-redirects: 1.16.1
  express-rate-limit: ^8.3.1
  fast-uri: ^3.1.9
  '@kontourai/fieldwork>zod': 4.6.7
  '@kontourai/survey>zod': 4.6.7
  body-parser@1: 1.20.9
  body-parser@2: 2.4.0
  undici@6: 6.29.1
  undici@8: 8.12.2
  form-data: ^4.0.6
  fast-copy: 4.1.0
  gaxios: ^7.3.0
  lodash: ^4.18.1
  node-forge: ^1.4.0
  proxy-addr: 2.0.8
  qs: ^6.16.0
  router>path-to-regexp: ^8.4.2
  anymatch>picomatch: ^2.3.2
  micromatch>picomatch: ^2.3.2
  gray-matter>js-yaml: ^3.15.2
  read-yaml-file>js-yaml: ^3.15.2
  "js-yaml@3.15.2>argparse": 2.0.1
  readdirp>picomatch: ^2.3.2
  socket.io-parser: ^4.2.7
  minimatch@^10.0.0>brace-expansion: ^5.0.12
  brace-expansion@^2.0.2: ^2.1.7
  js-yaml@^4.1.0: ^4.3.2
  js-yaml@^4.1.1: ^4.3.2
  nanoid: ^3.3.18
  engine.io-client: ^6.6.6
  "@strands-agents/sdk>@anthropic-ai/sdk": ^0.122.0
  "@strands-agents/sdk>@opentelemetry/exporter-trace-otlp-http": ^0.221.0
  "@strands-agents/sdk>@opentelemetry/exporter-metrics-otlp-http": ^0.221.0
  "@ai-sdk/provider-utils>undici": 6.29.1
  express-rate-limit>ip-address: ^10.5.1
  socks>ip-address: ^10.5.1
  "@kontourai/bearing>csv-parse": ^7.0.2
patchedDependencies:
  "node-pty@1.2.0-beta.18": patches/node-pty-1.2.0-beta.18.patch
  "@vitest/runner@4.1.12": patches/vitest-runner-4.1.12.patch
  "@homebridge/ciao@1.3.12": patches/homebridge-ciao-1.3.12.patch
  "@modelcontextprotocol/client@2.4.0": patches/modelcontextprotocol-client-2.4.0.patch
  "http-cache-semantics@4.3.0": patches/http-cache-semantics-4.3.0.patch
  "node-forge@1.4.0": patches/node-forge-1.4.0.patch
  "js-yaml@3.15.2": patches/js-yaml-3.15.2-argparse2-cli.patch
  "@voltagent/core@2.10.0": patches/voltagent-core-2.10.0.patch
  "@voltagent/core@2.11.0": patches/voltagent-core-2.11.0.patch
  "@voltagent/server-hono@2.0.14": patches/voltagent-server-hono-2.0.14.patch
strictPeerDependencies: true
# Veritas 1.12.2 declares an optional @kontourai/survey >=8.2 <9 peer that only
# its lazily imported `governance review` transport loads, through Survey's
# `review-workbench` and `review-console` exports. Those two trees are
# byte-identical in Survey 8.4.0 and 9.0.0 (9.0 changed bundle claim policy, not
# the review transport). The exact 9.0.0 value makes the next Survey bump fail
# the lockfile sync gate until this is re-read; drop the rule once a Veritas
# release widens its peer range (https://github.com/kontourai/veritas/issues/339).
peerDependencyRules:
  allowedVersions:
    "@kontourai/veritas>@kontourai/survey": 9.0.0
enableGlobalVirtualStore: false
# Managed bootstrap owns install, exact-hook preflight, and artifact proofs.
