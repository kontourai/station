name: Backlog disposition policy

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: backlog-priority-policy
  cancel-in-progress: true

jobs:
  enforce:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enforce durable backlog dispositions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels?per_page=100" \
            > "$RUNNER_TEMP/live-labels.json"
          node scripts/label-manifest.mjs --input="$RUNNER_TEMP/live-labels.json"
          node scripts/backlog-priority-policy.mjs
