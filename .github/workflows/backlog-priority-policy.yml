name: Backlog disposition policy

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: backlog-priority-policy
  cancel-in-progress: true

jobs:
  enforce:
    # `fast-feedback` is reserved for ci.yml's fast-checks job. This audit is
    # deliberately lightweight, but still uses the available self-hosted heavy
    # listener and its one-unit lease so it cannot starve or overbook the host.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, kontour-linux, heavy-host]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: kontourai/.github/actions/runner-preflight@1d267a33147d1ce5925ffd1f9aa0ef2063d0d7ef
      - name: Reserve physical host capacity
        uses: kontourai/.github/actions/physical-host-capacity@563effe7ec559c6f4fcc6c80b3532acb71d86373
        with:
          coordination-root: /mnt/e/kontour-runner-capacity
          host-id: desktop-win
          capacity-units: "10"
          lease-weight: "1"
          timeout-seconds: "300"
          owner-lifetime-seconds: "7800"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enforce durable backlog dispositions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/labels?per_page=100" > "$RUNNER_TEMP/live-labels.json"
          node scripts/label-manifest.mjs --input="$RUNNER_TEMP/live-labels.json"
          node scripts/backlog-priority-policy.mjs
