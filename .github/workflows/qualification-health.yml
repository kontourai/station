name: "Main: Qualification health"

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Main: Qualification", "Nightly"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: qualification-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      ${{ (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The run to classify is chosen first so its manifests can be fetched
      # with the pinned download action; the health check then classifies
      # only that run.
      - name: Select the red run to classify
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualification-health.mjs select-run
      - name: Download the qualification failure manifests
        if: steps.select.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: qualification-manifest-*
          path: ${{ runner.temp }}/qualification-manifests
      - name: Reconcile freshness and delivery health without launching tests
        env:
          GH_TOKEN: ${{ github.token }}
          STATION_QUALIFIED_NIGHTLY: ${{ vars.STATION_QUALIFIED_NIGHTLY }}
          QUALIFICATION_CLASSIFY_RUN: ${{ steps.select.outputs.run_id }}
          QUALIFICATION_MANIFEST_DIR: ${{ runner.temp }}/qualification-manifests
          # Unset or `report`: classification text only; `enforce` decides.
          STATION_QUALIFICATION_SIGNAL: ${{ vars.STATION_QUALIFICATION_SIGNAL }}
        run: node scripts/qualification-health.mjs
