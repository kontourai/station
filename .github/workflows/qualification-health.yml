name: "Main: Qualification health"

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Main: Qualification"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: qualification-health
  cancel-in-progress: false

jobs:
  health:
    if: >-
      ${{ (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Reconcile freshness and delivery health without launching tests
        env:
          GH_TOKEN: ${{ github.token }}
          STATION_QUALIFIED_NIGHTLY: ${{ vars.STATION_QUALIFIED_NIGHTLY }}
        run: node scripts/qualification-health.mjs
