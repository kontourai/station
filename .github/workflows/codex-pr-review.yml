name: "PR: Advisory review"

# PR: Secret scan is the existing no-secret pull-request ingress. Listening to its
# completed run keeps this workflow definition on the protected default branch;
# a candidate cannot rewrite the credentialed review job that evaluates it.
#
# The review engine spends credits on every run, so the `gate` job admits a
# pull request only when scripts/advisory-review-gate.mjs says so: it was
# requested (the `advisory-review` label set, or a person dispatched this
# workflow for it; armed auto-merge alone is not a request), it is still at
# the head the Secret Scan run saw, it changes more than generated output,
# and no review exists for that exact head. The gate reads the GitHub API only and runs the default-branch
# copy of the script; it never checks out or executes pull-request code.
on:
  workflow_run:
    workflows: ["PR: Secret scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review at its current head
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Admit review
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.event == 'pull_request' &&
           github.event.workflow_run.pull_requests[0].number) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      admit: ${{ steps.gate.outputs.admit }}
      same_repository: ${{ steps.gate.outputs.same_repository }}
      head_repository: ${{ steps.gate.outputs.head_repository }}
      number: ${{ steps.gate.outputs.number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Decide whether this head is worth a review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/advisory-review-gate.mjs

  review:
    name: Advisory review
    needs: gate
    if: >-
      ${{ needs.gate.outputs.admit == 'true' &&
          needs.gate.outputs.same_repository == 'true' }}
    concurrency:
      group: codex-pr-review-${{ needs.gate.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the exact same-repository PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.gate.outputs.head_repository }}
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review the exact head with the selected engine
        id: review
        uses: kontourai/flow-agents/.github/actions/codex-pr-review@9c0ea5a7a321f82b6a7c0e633a617c9df6097a6c
        env:
          # Optional OpenAI-compatible provider override (org/repo variable
          # CODEX_REVIEW_BASE_URL + secret CODEX_REVIEW_API_KEY). The Codex
          # CLI reads OPENAI_BASE_URL for its default provider, and composite
          # steps inherit this step's env. With neither configured, both
          # expressions fall through and behavior is byte-identical to the
          # official endpoint + OPENAI_API_KEY. The override endpoint must
          # speak the Responses wire API for the pinned model. Kiro ignores it.
          OPENAI_BASE_URL: ${{ vars.CODEX_REVIEW_BASE_URL || 'https://api.openai.com/v1' }}
        with:
          # Engine selection is one org/repo variable; absent, everything below
          # reduces to the historical codex wiring. The kiro engine reads
          # api-key ONLY (the composite never falls back to openai-api-key
          # cross-vendor), so with REVIEW_ENGINE=kiro and no KIRO_API_KEY the
          # run records reviewer_withheld rather than borrowing a credential.
          engine: ${{ vars.REVIEW_ENGINE || 'codex' }}
          api-key: ${{ vars.REVIEW_ENGINE == 'kiro' && secrets.KIRO_API_KEY || '' }}
          openai-api-key: ${{ secrets.CODEX_REVIEW_API_KEY || secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pull-request: ${{ needs.gate.outputs.number }}
          base-sha: ${{ needs.gate.outputs.base_sha }}
          head-sha: ${{ needs.gate.outputs.head_sha }}
          model: gpt-5.6-sol
          effort: xhigh

      # The validated result is useful without Builder: it binds the review to
      # the exact head and records pass, comment, fail, or NOT_VERIFIED.
      - name: Retain the validated exact-head result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-pr-review-${{ steps.review.outputs['head-sha'] }}
          path: ${{ steps.review.outputs['result-file'] }}
          if-no-files-found: error
          retention-days: 30

  record-fork-gap:
    name: Record fork review gap
    needs: gate
    if: >-
      ${{ needs.gate.outputs.admit == 'true' &&
          needs.gate.outputs.same_repository != 'true' }}
    concurrency:
      group: codex-pr-review-${{ needs.gate.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attach the exact untrusted fork head as read-only review data
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ needs.gate.outputs.head_repository }}
          CANDIDATE_HEAD: ${{ needs.gate.outputs.head_sha }}
        run: |
          if [[ ! "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] ||
             [[ ! "$CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid fork review target identity." >&2
            exit 1
          fi
          git remote add candidate "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git fetch --no-tags candidate "$CANDIDATE_HEAD"
          git checkout --detach "$CANDIDATE_HEAD"

      - name: Record the withheld fork reviewer as NOT_VERIFIED
        id: review
        uses: kontourai/flow-agents/.github/actions/codex-pr-review@9c0ea5a7a321f82b6a7c0e633a617c9df6097a6c
        with:
          # Engine named so the NOT_VERIFIED record carries true provenance for
          # the reviewer that was withheld; both credentials stay empty here.
          engine: ${{ vars.REVIEW_ENGINE || 'codex' }}
          openai-api-key: ""
          github-token: ""
          repository: ${{ github.repository }}
          pull-request: ${{ needs.gate.outputs.number }}
          base-sha: ${{ needs.gate.outputs.base_sha }}
          head-sha: ${{ needs.gate.outputs.head_sha }}
          model: gpt-5.6-sol
          effort: xhigh

      - name: Retain the exact-head NOT_VERIFIED result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-pr-review-${{ steps.review.outputs['head-sha'] }}
          path: ${{ steps.review.outputs['result-file'] }}
          if-no-files-found: error
          retention-days: 30
