name: "Release: Mac App Store TestFlight"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      bundle_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-testflight:
    runs-on: macos-15
    timeout-minutes: 120
    environment: native-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUNDLE_VERSION: ${{ inputs.bundle_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify the Stable candidate source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: station-release-client-build-provenance-${{ github.run_id }}
          path: release-client-build-provenance
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with: { install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with: { targets: aarch64-apple-darwin }
      - name: Build the Stable Mac bundle without a desktop updater
        env:
          STATION_CHANNEL: stable
          STATION_AUTHOR_TELEMETRY_ENDPOINT: ${{ github.repository == 'kontourai/station' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref == format('refs/tags/{0}', inputs.tag) && github.workflow_ref == format('kontourai/station/.github/workflows/release.yml@{0}', github.ref) && vars.STATION_AUTHOR_TELEMETRY_ENDPOINT || '' }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          STATION_CLIENT_BUILD_REUSE: '1'
        run: |
          set -euo pipefail
          npm run dependencies:ci
          npm run build:sdk
          npm run build:connect
          node scripts/release-client-build-provenance.mjs stage --source-sha "$RELEASE_SHA" --artifact release-client-build-provenance/station-client-build.json
          node scripts/lib/native-release-config.mjs --tag "$RELEASE_TAG" --channel-identity --output "$RUNNER_TEMP/macos-store-tag.json"
          jq --arg minimum "$MACOSX_DEPLOYMENT_TARGET" '.bundle.category = "DeveloperTool" | .bundle.macOS.minimumSystemVersion = $minimum' "$RUNNER_TEMP/macos-store-tag.json" > "$RUNNER_TEMP/macos-store.json"
          STATION_BUILD_VERSION="$(jq -er .version "$RUNNER_TEMP/macos-store.json")"
          export STATION_BUILD_VERSION
          npm run build:desktop -- --no-sign --target aarch64-apple-darwin --bundles app --config "$RUNNER_TEMP/macos-store.json"
          node scripts/release-client-build-provenance.mjs verify --source-sha "$RELEASE_SHA" --expected src-desktop/station-client-build.json --actual "src-desktop/target/aarch64-apple-darwin/release/bundle/macos/Station.app/Contents/Resources/dist-server/station-build.json"
      - name: Sign the sandboxed app and installer
        env:
          APP_CERTIFICATE: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APP_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          INSTALLER_CERTIFICATE: ${{ secrets.APPLE_MAC_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_MAC_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          STORE_PROFILE: ${{ secrets.APPLE_MAC_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for secret in APP_CERTIFICATE APP_PASSWORD APP_IDENTITY INSTALLER_CERTIFICATE INSTALLER_PASSWORD STORE_PROFILE; do
            test -n "${!secret}" || { echo "Missing Mac App Store signing input: $secret" >&2; exit 1; }
          done
          umask 077
          signing="$RUNNER_TEMP/macos-store-signing"
          mkdir "$signing"
          keychain="$signing/signing.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$signing/application.p12" "$signing/installer.p12" "$signing/store.provisionprofile"' EXIT
          printf '%s' "$APP_CERTIFICATE" | base64 --decode > "$signing/application.p12"
          printf '%s' "$INSTALLER_CERTIFICATE" | base64 --decode > "$signing/installer.p12"
          printf '%s' "$STORE_PROFILE" | base64 --decode > "$signing/store.provisionprofile"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing/application.p12" -k "$keychain" -P "$APP_PASSWORD" -T /usr/bin/codesign
          security import "$signing/installer.p12" -k "$keychain" -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          app_sha="$(security find-identity -v -p codesigning "$keychain" | awk -v identity="\"$APP_IDENTITY\"" 'index($0, identity) { print $2 }')"
          installer_sha="$(security find-identity -v -p basic "$keychain" | awk '/"3rd Party Mac Developer Installer: / { print $2 }')"
          node ops/release/macos-store-stage.mjs --store \
            "src-desktop/target/aarch64-apple-darwin/release/bundle/macos/Station.app" \
            "$RUNNER_TEMP/macos-store-package" "$RELEASE_TAG" "$signing/store.provisionprofile" \
            "$app_sha" "$installer_sha" "$keychain"
          mkdir macos-store
          cp "$RUNNER_TEMP/macos-store-package/station-$RELEASE_TAG-macos-store.pkg" macos-store/
          shasum -a 256 "macos-store/station-$RELEASE_TAG-macos-store.pkg" > macos-store/package.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: macos-store/*.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: station-macos-store-${{ inputs.bundle_version }}
          path: macos-store
          if-no-files-found: error
          retention-days: 14
      - name: Upload the exact Mac package to Stable internal TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TESTFLIGHT_INTERNAL_GROUP_ID: ${{ vars.TESTFLIGHT_INTERNAL_GROUP_ID }}
        run: |
          set -euo pipefail
          test -n "$TESTFLIGHT_INTERNAL_GROUP_ID"
          umask 077
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key"
          mkdir macos-store-receipts
          node scripts/app-store-connect-receipt.mjs app-preflight --bundle-id io.kontourai.station --expected-name 'Station by Kontour AI' --output macos-store-receipts/app.json
          app_id="$(jq -er .appId macos-store-receipts/app.json)"
          scope=(--app-id "$app_id" --bundle-version "$BUNDLE_VERSION" --platform MAC_OS)
          authority=(--authority-ref "$GITHUB_REF" --authority-sha "$RELEASE_SHA")
          node scripts/app-store-connect-receipt.mjs reconcile-build "${scope[@]}" "${authority[@]}" --output macos-store-receipts/pre-upload.json
          test "$(jq -r .processingState macos-store-receipts/pre-upload.json)" = ABSENT || { echo "A macOS build already occupies this version; review its existing delivery receipt before any retry." >&2; exit 1; }
          package="macos-store/station-$RELEASE_TAG-macos-store.pkg"
          api=(--api-key "$APPLE_API_KEY_ID" --api-issuer "$APPLE_API_ISSUER_ID" --p8-file-path "$key" --output-format json)
          xcrun altool --validate-app "$package" --platform macos "${api[@]}" > macos-store-receipts/validation.json
          xcrun altool --upload-app -f "$package" --platform macos "${api[@]}" > macos-store-receipts/upload.json
          node scripts/app-store-connect-receipt.mjs wait-for-valid-build "${scope[@]}"
          node scripts/app-store-connect-receipt.mjs reconcile-build "${scope[@]}" "${authority[@]}" --output macos-store-receipts/build.json
          build_id="$(jq -er 'select(.processingState=="VALID") | .buildId' macos-store-receipts/build.json)"
          node scripts/app-store-connect-receipt.mjs attach-internal-group --app-id "$app_id" --build-id "$build_id" --group-id "$TESTFLIGHT_INTERNAL_GROUP_ID" --group-name 'Internal Testers' --output macos-store-receipts/group.json
          cp macos-store/package.sha256 macos-store-receipts/package.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: station-macos-store-testflight-${{ inputs.bundle_version }}
          path: macos-store-receipts
          if-no-files-found: warn
          retention-days: 14
