name: Build iOS verification artifact

# Mirrors build-android.yml: a debug/no-sign iOS simulator build exercised
# outside a tag release, so an iOS-breaking Rust/Xcode change is caught
# before `.github/workflows/release.yml`'s tag-only `ios-simulator`/
# `ios-device` jobs would first hit it. Until this file, Android had this
# verification lane (workflow_dispatch-only) and iOS had none at all — the
# first iOS build of any kind ran on a real release tag.
#
# Deliberately workflow_dispatch-only, NOT pull_request-triggered, unlike
# build-android.yml's PR path filter added alongside this file. Two reasons,
# both disclosed rather than silently decided:
#   1. macOS GitHub-hosted runners bill at a 10x multiplier over Linux —
#      meaningfully more expensive per run than the Android lane this
#      mirrors.
#   2. This repo's hosted CI is presently suspended repo-wide on org billing
#      (see AGENTS.md/CLAUDE.md, "Hosted CI is down through July 2026") — the
#      same constraint that caused that suspension. Arming a new recurring
#      macOS PR gate while that's unresolved is the wrong default; a
#      workflow_dispatch lane gives iOS parity with where the Android lane
#      started (manual, on-demand) without compounding the cost problem.
# Revisit adding a path-filtered pull_request trigger once hosted CI billing
# is restored and the actual per-run macOS-minute cost is known.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-verification:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with: { targets: aarch64-apple-ios-sim }
      - run: brew install xcodegen libimobiledevice cocoapods
      - run: npm run dependencies:ci && npm run build:sdk && npm run build:connect && npm run build:desktop:resources
      # See station#2306: the app ROOT comes from cwd, not from --config.
      - working-directory: src-desktop
        run: npx tauri ios init --ci --skip-targets-install --config tauri.conf.json
      - working-directory: src-desktop
        run: rm -rf gen/apple/build && npx tauri ios build --target aarch64-sim --no-sign --ci --config tauri.conf.json
      - name: Verify and package simulator artifact
        run: |
          simulator_app=$(find src-desktop/gen/apple -type d -name '*.app' -print -quit)
          test -n "$simulator_app"
          mkdir release-assets
          tar -C "$(dirname "$simulator_app")" -czf "release-assets/station-ios-simulator-debug.app.tar.gz" "$(basename "$simulator_app")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: station-ios-simulator-debug
          path: release-assets
          if-no-files-found: error
          # A reproducible simulator build, not a deliverable. Kept days, not
          # weeks: station#2218 filled the org artifact quota (688 MB against a
          # 500 MB allowance) and blocked every `fast-checks` run, because an
          # upload failure turns a passing job into an infrastructure error.
          retention-days: 5
