name: "PR: iOS build"

# Mirrors build-android.yml: a debug/no-sign iOS simulator build exercised
# outside a tag release, so an iOS-breaking Rust/Xcode change is caught
# before `.github/workflows/release.yml`'s tag-only `ios-simulator`/
# `ios-device` jobs would first hit it. Until this file, Android had this
# verification lane (workflow_dispatch-only) and iOS had none at all — the
# first iOS build of any kind ran on a real release tag.
#
# Station is public, so standard GitHub-hosted runners are free, but the org
# shares 5 concurrent macOS jobs and this one is the long pole of every merge
# group. Every PR emits the stable build-ios-verification check so the
# repository ruleset can require it; a job skipped by its `if` reports
# `skipped`, which the ruleset accepts, and the merge group still decides.
#
# Before landing (pull_request_target, merge_group) the classifier builds
# only for NATIVE inputs: src-desktop, the iOS project and configs, Rust and
# Cargo, dependency manifests, the runtime smoke and its fixtures, this
# workflow, vite.config.ts and every executed file named for iOS or the
# native client, and the slice of src-ui that is the native shell.
#
# After landing, a `push` to main builds the POST-MERGE inputs: every source
# root the UI bundle can import (src-ui/, src-shared/, and the workspace
# packages it reaches) and the generic tooling this job executes (dependency
# install, bundle budget, vite plugins, shared script libraries). That
# includes two files on the native path: scripts/vite-ui-assets.ts (its
# `precompress: false` native branch) and scripts/lib/desktop-build-manifest.mjs
# (imported by the native manifest writers). The exact
# sets, and the rule that splits them, live in scripts/classify-ci-change.mjs;
# classify-ci-change.test.ts derives what this job executes and what the UI
# imports, and fails on a reached file neither set covers. Not seen by that
# derivation: files read at run time (readFileSync, child processes, dynamic
# import specifiers) unless listed by hand.
#
# The push trigger was removed once because it rebuilt the identical commit:
# the merge queue lands one entry at a time and fast-forwards main to the
# candidate it tested (push run 35781390232 on 0015690b7 repeated merge_group
# run 35778933116; push 35768638682 repeated 35766058181 for e2c2d2a60), about
# 20 macOS minutes per merge for no new verdict. That reasoning still holds,
# so the push run never builds what a merge group built: it builds only when
# its `before..after` range touches a post-merge (broad) input and NO native
# one (`--scope ios-post-merge`). That range is the landed candidate's own
# range, because main is fast-forwarded to it, so "native input present"
# means "the merge group already built this exact tree". The push has no
# `paths` filter on purpose: GitHub's path filters see at most 300 changed
# files and then skip the run, which would silently drop a large landing's
# post-merge build. The minute-long Linux classifier decides instead.
#
# Post-merge builds coalesce: the build job shares one concurrency group on
# push with cancel-in-progress off, so at most one runs and one waits, a
# newer pending build replaces an older pending one (the newer tree contains
# it), and a running build is never cancelled. A red push run on main opens
# a tracker through main-health.yml.
#
# The acknowledged gap: a commit pushed to main WITHOUT the merge queue gets
# no pre-landing build, and if its range has a native input the push run
# also skips it, because it cannot tell that commit from a queue landing the
# merge group already built. Dispatch this workflow on main to build one.
#
# Draft pull requests, and the same-repository release PR the automation app
# regenerates on every main push, do not build on PR events (see the build
# job's `if`). Marking a draft ready for review (`ready_for_review`) builds
# it; both still build in the merge queue.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_extensions:
        description: Compile Stable's push plugin and both extensions (unsigned simulator only)
        type: boolean
        default: false

permissions:
  contents: read

# Push runs get a per-commit group so one push never cancels another's
# classification; the build job's own group below serializes their builds.
concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - id: relevance
        name: Classify iOS verification inputs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: |
          fail_closed() {
            echo "::warning::iOS change classification failed closed: $1"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Candidates are judged by the native scope from their merge base.
          # A main push is judged by the post-merge scope over exactly what it
          # added; its classifier comes from `before`, the previous main.
          # Anything else (dispatch) always builds.
          case "$GITHUB_EVENT_NAME" in
            pull_request_target|merge_group)
              scope=ios
              mode=candidate
              ;;
            push)
              scope=ios-post-merge
              mode=direct
              ;;
            *)
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          classifier="$RUNNER_TEMP/classify-ci-change.mjs"
          git show "$BASE_SHA:scripts/classify-ci-change.mjs" > "$classifier" || \
            fail_closed "base-controlled classifier unavailable"
          output="$RUNNER_TEMP/ios-change-classification"
          node "$classifier" --scope "$scope" --mode "$mode" \
            --before "$BASE_SHA" --after "$HEAD_SHA" > "$output" || \
            fail_closed "classifier execution failed"
          classification=$(cat "$output")
          case "$classification" in
            relevant=true|relevant=false)
              printf '%s\n' "$classification" >> "$GITHUB_OUTPUT"
              ;;
            *)
              fail_closed "classifier returned malformed output"
              ;;
          esac

  build-ios-verification:
    needs: classify
    # On PR events only, a draft and the automation app's same-repository
    # release PR skip the build (scripts/__tests__/ci-workflow-contract.test.ts
    # pins this guard, identical in the Windows and Gallery heavy jobs).
    # `ready_for_review` and later pushes to a non-draft PR build; the merge
    # group always does. The release PR is matched by its branch AND by its
    # head living in this repository (a fork can name a branch anything) AND
    # by its author being the app's bot account (a `[bot]` login no person can
    # register), so a human PR from that branch name still builds.
    # `!cancelled()` lets the build run when the classify JOB failed (a
    # checkout or runner failure, which the step's fail_closed cannot answer):
    # an unknown answer builds, as everywhere else in this workflow. It is not
    # `always()`, which would also start a 25-minute build in a run that was
    # cancelled (a superseded PR head, a dropped merge group).
    if: "!cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.relevant == 'true') && (github.event_name != 'pull_request_target' || (!github.event.pull_request.draft && (github.event.pull_request.head.ref != 'changeset-release/main' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'station-automation[bot]')))"
    # One running plus one pending post-merge build on main; a newer push
    # replaces the pending one and never cancels the running one. A job whose
    # `if` is false never joins the group. Every other event gets a group of
    # its own run, so this changes nothing for PRs and merge groups.
    concurrency:
      group: ${{ github.event_name == 'push' && 'build-ios-main-post-merge' || format('build-ios-verification-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned pnpm
        uses: kontourai/station/.github/actions/setup-verified-pnpm@382b4af65e5f8bc5e3d62bd64ef1eba8653af50f

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - id: rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with: { targets: aarch64-apple-ios-sim }
      # Restore-only. The cold `tauri ios build` recompiled every dependency
      # crate for aarch64-apple-ios-sim on each run (~8-12 min of the job).
      # Only ios-rust-cache-warm.yml, on trusted main events, writes this key;
      # this job can never save (no actions/cache or actions/cache/save, and
      # scripts/actionlint-gate.mjs refuses one), and GitHub issues
      # pull_request_target a read-only cache token regardless. A miss or a
      # stale restore-keys match only costs compile time: cargo's fingerprints
      # still decide what is rebuilt. Keep the key in lockstep with the warmer.
      - name: Restore iOS Rust build cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-desktop/target
          key: ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-aarch64-apple-ios-sim-${{ hashFiles('src-desktop/Cargo.lock') }}
          restore-keys: |
            ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-aarch64-apple-ios-sim-
      - name: Select the reviewed Xcode and iOS simulator image
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes | grep -F 'iOS 26.5'
      - run: brew install xcodegen
      - run: npm run dependencies:ci && npm run build:native-client
      # First boot of a fresh hosted simulator took ~3.5 of the smoke's ~9
      # minutes (run 35781390232: receipt start 20:47:48, first XCUITest
      # attempt 20:51:45). `simctl boot` returns before the device is usable,
      # so starting it here lets that boot overlap the build below; the smoke
      # later waits on `bootstatus -b` for the same exact device. A pre-boot
      # that fails is reported (the step goes red-but-continued) and leaves
      # the device Shutdown, so the smoke's own boot path takes over; the
      # receipt's initialDeviceState records which path ran.
      # Start after dependency verification so simulator startup cannot contend
      # with its real-PTY handshake. Boot still overlaps the Rust build below.
      - name: Start booting the smoke simulator while the app builds
        continue-on-error: true
        run: node scripts/ios-simulator-runtime-smoke.mjs --preboot
      # See station#2306: the app ROOT comes from cwd, not from --config.
      - working-directory: src-desktop
        run: npx tauri ios init --ci --skip-targets-install --config tauri.conf.json
      - run: node scripts/write-ios-build-manifest.mjs
      - name: Prepare unsigned Stable push extensions
        if: github.event_name == 'workflow_dispatch' && inputs.push_extensions
        run: |
          push_info_plist="$RUNNER_TEMP/station-ios-push-Info.plist"
          cp src-desktop/gen/apple/station_iOS/Info.plist "$push_info_plist"
          node scripts/ensure-ios-agent-activity-extension.mjs src-desktop/gen/apple/project.yml --app-bundle-id io.kontourai.station --aps-environment production --info-plist "$push_info_plist" --notification-service
          xcodegen generate --spec src-desktop/gen/apple/project.yml --project src-desktop/gen/apple
          cp "$push_info_plist" src-desktop/gen/apple/station_iOS/Info.plist
      - working-directory: src-desktop
        if: github.event_name != 'workflow_dispatch' || !inputs.push_extensions
        run: rm -rf gen/apple/build && STATION_CLIENT_BUILD_REUSE=1 npx tauri ios build --target aarch64-sim --no-sign --ci --config tauri.conf.json
      - name: Compile unsigned Stable push package
        if: github.event_name == 'workflow_dispatch' && inputs.push_extensions
        working-directory: src-desktop
        env:
          PUSH_EXTENSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.push_extensions }}
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { mobileCargoConfig } from "../scripts/ios-store-signing-config.mjs"; writeFileSync(process.argv[1], mobileCargoConfig({ liveActivity: process.env.PUSH_EXTENSIONS === "true" }), { mode: 0o600 });' "$RUNNER_TEMP/station-ios-mobile-env.toml"
          rm -rf gen/apple/build
          STATION_CLIENT_BUILD_REUSE=1 npx tauri ios build --target aarch64-sim --no-sign --ci --config tauri.conf.json -- --config "$RUNNER_TEMP/station-ios-mobile-env.toml"
      - id: simulator_artifact
        name: Verify and package simulator artifact
        run: |
          simulator_app=$(find src-desktop/gen/apple -type d -name '*.app' -print -quit)
          test -n "$simulator_app"
          simulator_app=$(cd "$simulator_app" && pwd -P)
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.push_extensions }}' = true ]; then
            for extension in StationAgentActivity StationNotificationService; do
              appex="$simulator_app/PlugIns/$extension.appex"
              test -s "$appex/$extension"
              suffix="${extension#Station}"
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex/Info.plist")" = "io.kontourai.station.$suffix"
            done
            test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$simulator_app/Info.plist")" = true
            app_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$simulator_app/Info.plist")
            xcrun otool -oV "$simulator_app/$app_executable" > "$RUNNER_TEMP/ios-push-plugin-classes.txt"
            grep -Fq '19AgentActivityPlugin' "$RUNNER_TEMP/ios-push-plugin-classes.txt"
          fi
          node scripts/ios-channel-icons.mjs verify stable --app "$simulator_app" --receipt "$RUNNER_TEMP/ios-simulator-icon-receipt.json"
          packaged_manifest=$(find "$simulator_app" -type f -name station-build.json -print)
          test "$(printf '%s\n' "$packaged_manifest" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          cmp "src-desktop/station-client-build.json" "$packaged_manifest"
          echo "app=$simulator_app" >> "$GITHUB_OUTPUT"
          mkdir release-assets
          tar -C "$(dirname "$simulator_app")" -czf "release-assets/station-ios-simulator-debug.app.tar.gz" "$(basename "$simulator_app")"
      - name: Prove the packaged WKWebView leaves startup
        run: >-
          npm run test:ios-runtime-smoke --
          --app "${{ steps.simulator_artifact.outputs.app }}"
          --artifacts "$GITHUB_WORKSPACE/.kontourai/ios-simulator-runtime-smoke"
          --source-sha "${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}"
      - name: Upload iOS runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: station-ios-simulator-runtime
          path: .kontourai/ios-simulator-runtime-smoke
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: station-ios-simulator-debug
          path: release-assets
          if-no-files-found: warn
          # A reproducible simulator build, not a deliverable. Kept days, not
          # weeks: station#2218 filled the org artifact quota (688 MB against a
          # 500 MB allowance) and blocked every `fast-checks` run, because an
          # upload failure turns a passing job into an infrastructure error.
          retention-days: 5
