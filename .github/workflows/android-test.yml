name: "Main: Android tests"

on:
  workflow_run:
    workflows: ["Main: Android build"]
    types: [completed]
  # checkov:skip=CKV_GHA_7:Manual test runs require an exact prior Android build run ID
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Main: Android build run ID'
        required: true

permissions:
  contents: read

jobs:
  resolve-build:
    name: Resolve exact build revision
    # workflow_run fires for every completed build. A build superseded by its
    # own cancel-in-progress concurrency, or dispatched on a non-main branch
    # (which the resolver refuses by design), has nothing testable: skip it
    # rather than report main red (#3402). A failed main build still runs
    # the resolver and fails. Manual dispatch keeps its strict validation.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      conclusion: ${{ steps.resolve.outputs.conclusion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Resolve triggering build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/resolve-android-build-run.mjs

  mobile-playwright:
    name: Mobile Playwright (Android viewport)
    if: github.event_name != 'pull_request'
    needs: resolve-build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-build.outputs.head_sha }}
          persist-credentials: false

      - name: Setup pinned pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with: { install: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm run dependencies:ci

      # The public Android suite owns its isolated Station instance, build,
      # ports, reports, and cleanup. Do not replace it with direct Vite or
      # Playwright commands here.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" npx playwright install chromium

      - name: Run Android viewport tests
        env:
          PW_REPORTER: line,html
        run: npm run test:android

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Diagnostics: a storage/quota failure here is an infrastructure
        # condition, not a verdict on the code. It must not redden a job
        # whose work passed (station#2218).
        continue-on-error: true
        with:
          name: android-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  emulator-smoke:
    name: Emulator Smoke Test
    if: github.event_name != 'pull_request'
    needs: resolve-build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-build.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # `packages` defaults to `tools platform-tools`, and `tools` is the
      # obsolete SDK Tools package Google removed from the repository. See the
      # note in nightly-native-stage.yml.
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with: { packages: platform-tools }

      - name: Download APK from triggering build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: station-android-debug
          run-id: ${{ needs.resolve-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk/

      - name: List APK
        run: ls -lh apk/ && find apk/ -name "*.apk"

      - name: Enable KVM for the runner user
        # Hosted runners expose /dev/kvm root-only until this documented step:
        # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify provisioned KVM access
        run: |
          test -r /dev/kvm -a -w /dev/kvm || {
            echo "::error::hosted Ubuntu runner cannot read and write /dev/kvm"
            exit 1
          }

      - name: Write smoke test script
        run: |
          cat > smoke.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          APK=$(find apk/ -name "*.apk" | head -1)
          echo "APK: $APK"
          # Identity is DERIVED from the artifact under test, never hardcoded:
          # channel builds carry distinct application ids, and a hardcoded
          # component silently tests nothing when identity work moves it.
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          ACTIVITY=$("$AAPT" dump badging "$APK" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p")
          test -n "$PKG" && test -n "$ACTIVITY"
          echo "Launching $PKG/$ACTIVITY"
          adb install "$APK"
          adb shell am start -n "$PKG/$ACTIVITY"
          sleep 5
          adb shell pidof "$PKG" | grep -q "[0-9]" && echo "App process running" || (echo "App not running" && exit 1)
          adb logcat -d | grep -E "FATAL EXCEPTION|E AndroidRuntime" > crash.log || true
          if [ -s crash.log ]; then cat crash.log && exit 1; fi
          adb shell screencap -p /sdcard/smoke.png && adb pull /sdcard/smoke.png smoke-test.png
          echo "Smoke test passed"
          SCRIPT
          chmod +x smoke.sh

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash smoke.sh

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Diagnostics: a storage/quota failure here is an infrastructure
        # condition, not a verdict on the code. It must not redden a job
        # whose work passed (station#2218).
        continue-on-error: true
        with:
          name: android-smoke-screenshot
          path: smoke-test.png
          retention-days: 14
