name: "PR: Desktop Rust"

# The bundled-server supervisor state machine (src-desktop) is a pure,
# exhaustively unit-tested Rust module. The shared delivery planner selects
# this lane for affected pull requests; scheduled qualification also runs it. Locally
# the same command rides `npm run verify:local` via `verify:desktop-rust`.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      native_review_faults:
        description: "Exercise native performance regression fault controls"
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: desktop-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-rust:
    name: Native Rust and Kotlin checks
    timeout-minutes: 90
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with: { install: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with: { targets: aarch64-linux-android, components: rustfmt }

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - id: prerequisites
        run: npm run dependencies:ci

      - name: Check formatting
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'success' }}
        run: |
          cargo fmt --check --manifest-path src-desktop/Cargo.toml
          cargo fmt --check --manifest-path src-desktop/plugins/agent-activity/Cargo.toml

      - name: Resolve the image's Android NDK
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'success' }}
        run: |
          set -euo pipefail
          root="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            root="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "::error::no Android NDK on this image; the Android type check cannot compile ring's build script" >&2
            exit 1
          fi
          echo "Using NDK $root"

          # `ring`'s build script drives cc-rs, which looks for an unsuffixed
          # `aarch64-linux-android-clang` on PATH. The NDK ships API-suffixed
          # wrappers instead (`aarch64-linux-android21-clang` upwards), so
          # exporting PATH alone is not enough — the first run of this job
          # failed with `ToolNotFound: aarch64-linux-android-clang`. Name a
          # concrete wrapper. Any API level compiles ring's C identically; the
          # highest present keeps this off the deprecation floor.
          bin="$root/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$(find "$bin" -maxdepth 1 -name 'aarch64-linux-android*-clang' 2>/dev/null | sort -V | tail -1)"
          if [ -z "$cc" ] || [ ! -x "$cc" ]; then
            echo "::error::no aarch64-linux-android clang under $bin" >&2
            exit 1
          fi
          echo "Using CC $cc"

          {
            echo "NDK_HOME=$root"
            echo "ANDROID_NDK_ROOT=$root"
            echo "PATH=$bin:$PATH"
            echo "CC_aarch64_linux_android=$cc"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      # The same directories `verify:desktop-rust` creates. tauri-build resolves
      # frontendDist at build-script time and that requirement does not vary by
      # target, so no frontend build is needed to type-check Rust.
      - name: Type-check the Android-only code paths
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'success' }}
        run: |
          mkdir -p dist-server dist-desktop-runtime/node_modules dist-desktop-runtime/examples
          cd src-desktop
          cargo check --target aarch64-linux-android --lib

      - name: Run the plugin's Kotlin unit tests
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::this image lacks JDK 17 or the Android SDK; the Kotlin unit tests cannot run" >&2
            exit 1
          fi
          JAVA_HOME="$JAVA_HOME_17_X64" node scripts/run-agent-activity-android-unit-tests.mjs --no-daemon

      - name: Run bundled-server supervisor Rust tests
        if: ${{ !cancelled() && steps.prerequisites.outcome == 'success' }}
        run: npm run verify:desktop-rust

      - name: Prove native performance regressions catch reverted behavior
        if: ${{ success() && inputs.native_review_faults }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"]).strip(), "fault controls require committed, clean sources"
          originals = {}
          mutated = {}
          def change(name, before, after):
              path = Path(name)
              source = path.read_text()
              assert source.count(before) == 1, (name, "ambiguous mutation landmark")
              originals.setdefault(path, source)
              mutated[path] = source.replace(before, after)
              path.write_text(mutated[path])
          def cargo(filter):
              result = subprocess.run(["cargo", "test", "--manifest-path", "src-desktop/Cargo.toml", "--lib", filter, "--", "--test-threads=1"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout, flush=True)
              return result
          def kotlin():
              return subprocess.run(["node", "scripts/run-agent-activity-android-unit-tests.mjs", "--no-daemon"])
          transport = "src-desktop/src/native_http_transport.rs"
          lib = "src-desktop/src/lib.rs"
          recovery = "src-desktop/src/mobile_recovery.rs"
          android = "src-desktop/plugins/agent-activity/android/src/main/java/io/kontourai/station/agentactivity/StationRendererRecovery.kt"
          try:
              change(transport, "        // Mark BEFORE calling:", "        if self.epoch != network_epoch() { return Err(ureq::Error::Io(std::io::ErrorKind::NotConnected.into())); }\n        // Mark BEFORE calling:")
              change(transport, "        self.inner.await_input(timeout)", "        let mut timeout = timeout;\n        if PROGRESS.with(Cell::get).reused && *timeout.after > Duration::from_secs(3) {\n            timeout.after = ureq::unversioned::transport::time::Duration::Exact(Duration::from_secs(3));\n            timeout.reason = ureq::Timeout::RecvResponse;\n        }\n        self.inner.await_input(timeout)")
              change(transport, "let safe = !progress.send_attempted;", "let safe = true;")
              change(lib, "&& self.metadata_verified", "&& false && self.metadata_verified")
              change(lib, "    let mut local = cache\n        .lock()\n        .unwrap_or_else(|error| error.into_inner())\n        .clone();", "    let mut local = cache.lock().unwrap().clone();")
              change(recovery, "if self.error_shown {", "if false && self.error_shown {")
              change(android, "if (foreground) foreground(now, restart, exhausted)", "foreground(now, restart, exhausted)")
              result = cargo("native_http_performance_tests::")
              assert result.returncode == 101, "mutated Rust tests must fail with test assertions"
              for name in ["native_http_network_change_during_upload_does_not_interrupt_or_replay_post", "native_http_slow_reused_get_waits_for_response_without_replay", "native_http_snapshot_hot_reads_do_not_read_profile_bytes_or_repeat_genesis", "native_http_profile_replacement_recovers_a_poisoned_snapshot_cache", "native_http_failed_sent_requests_are_never_replayed"]:
                  assert f"\n    native_http_performance_tests::{name}\n" in result.stdout, (name, "did not catch its fault")
              result = cargo("mobile_recovery::tests::")
              assert result.returncode == 101 and "\n    mobile_recovery::tests::renderer_death_defers_in_background_and_stops_after_three_foreground_reloads\n" in result.stdout
              assert kotlin().returncode != 0, "background recovery mutation survived"
              report = Path("src-desktop/plugins/agent-activity/android/build/test-results/testDebugUnitTest/TEST-io.kontourai.station.agentactivity.RendererRecoveryWindowTest.xml")
              case = ET.parse(report).find(".//testcase[@name='backgroundKillsCoalesceUntilForegroundWithoutSpendingReloads']")
              assert case is not None and case.find("failure") is not None, "background recovery test did not catch its fault"
          finally:
              for path, source in originals.items():
                  assert path.read_text() == mutated[path], (str(path), "intervening edits; refusing restoration")
                  path.write_text(source)
          # A distinct control preserves performance while breaking timestamp safety.
          originals.clear()
          mutated.clear()
          try:
              change(lib, "&& self.metadata_verified\n                    && version.unambiguous()", "&& true")
              result = cargo("native_http_recent_metadata_collision_compares_bytes")
              assert result.returncode == 101 and "\n    native_http_performance_tests::native_http_recent_metadata_collision_compares_bytes\n" in result.stdout
          finally:
              for path, source in originals.items():
                  assert path.read_text() == mutated[path], "intervening edits; refusing restoration"
                  path.write_text(source)
          assert cargo("native_http_performance_tests::").returncode == 0
          assert cargo("mobile_recovery::tests::").returncode == 0
          assert kotlin().returncode == 0
          print("Native performance fault controls: baseline green; eight named regressions caught; restored green.")
          PYTHON
