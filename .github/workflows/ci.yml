name: "PR: CI"

on:
  push:
    branches: [main]
  # PR routing is read from the base branch, so a candidate cannot replace it
  # with a self-hosted job before these conditions are evaluated.
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  # Merge queue evaluates the synthesized latest-main candidate rather than
  # asking each contributor to chase a moving main branch locally.
  merge_group:
    branches: [main]
    types: [checks_requested]
  # Manual trigger for bounded fast feedback and the completion gate on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Exact full-diff classification
    # Non-PR jobs use this full-diff result. Hosted so a GitHub-hosted
    # outage cannot skip the rest of this workflow the way station#1931
    # did when this classifier ran on a billing-blocked hosted image.
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      container: ${{ steps.classify.outputs.container }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - id: classify
        name: Classify the complete before..sha diff
        env:
          BEFORE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || '0000000000000000000000000000000000000000' }}
          AFTER: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.sha }}
        run: node scripts/classify-ci-change.mjs --before "$BEFORE" --after "$AFTER" >> "$GITHUB_OUTPUT"

  # #2709: `fast-checks` is the required check. The affected-test selection
  # outgrew one runner's fifteen-minute budget, so it is computed once here,
  # run as one to four planned slices in fast-checks-shard, and the fixed
  # static invariants, browser smoke and bundle budget run in
  # fast-checks-statics. The `fast-checks` job below passes only when all of
  # them succeeded and every shard's receipt proves it ran its slice of this
  # plan (scripts/fast-checks-shard.mjs, scripts/lib/fast-checks-shards.mjs).
  fast-checks-plan:
    name: fast-checks plan
    needs: classify
    # Same admission as the part jobs beside it: same-repository PRs, the
    # merge queue, dispatch, and heavy pushes. Forks stay on fork-smoke.
    if: ${{ always() && !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || needs.classify.outputs.heavy == 'true') }}
    permissions:
      contents: read
    concurrency:
      # Head sha in the identity for the same reason as fast-checks (#1445).
      group: ci-fast-plan-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    # The legacy path below runs the whole ci:fast lane here, so the fence
    # covers its fifteen-minute budget + actionlint (5) + install (15) +
    # Chromium (20) + planning (5) + ~3 minutes of unbounded setup = 63;
    # ci-workflow-contract.test.ts pins the sum.
    timeout-minutes: 65
    outputs:
      # Exactly 'true' or 'false', from the base-controlled detection step.
      # The aggregator fails on anything else.
      legacy: ${{ steps.mode.outputs.legacy }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The selection is the diff against the base, which a depth-1
          # checkout cannot resolve.
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # TRANSITIONAL (#2709). A candidate branched before the sharded lane
      # has no scripts/fast-checks-shard.mjs; under pull_request_target this
      # base workflow would otherwise red its required check until it merged
      # main. Such a candidate takes the legacy path: this job runs its whole
      # unsharded `npm run ci:fast` (today's behaviour and trust: a candidate
      # that deletes the script gets its own ci:fast, never less), the shards
      # are skipped, and the aggregator requires this job and
      # fast-checks-statics instead of receipts. On legacy candidates the
      # statics run twice (here and in fast-checks-statics, which an old
      # candidate's ci:fast also runs in full, selection included); that is
      # the accepted cost of the transition.
      # REMOVE once open pull requests have merged main: delete this step,
      # the three `legacy` steps below, the `outputs` block, the shards'
      # legacy `if`, and the aggregator's legacy branch (and their pins in
      # ci-workflow-governance.mjs, actionlint-gate.mjs and their tests).
      - name: Detect a candidate without the sharded lane
        id: mode
        run: |
          if [ -f scripts/fast-checks-shard.mjs ]; then
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::candidate predates the sharded fast-checks lane; running its unsharded ci:fast (merge main to shard)"
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          fi

      # Legacy only: the lane's gate:workflows needs actionlint.
      - name: Install pinned actionlint
        if: ${{ steps.mode.outputs.legacy == 'true' }}
        timeout-minutes: 5
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - run: npm run dependencies:ci
        timeout-minutes: 15

      - name: Install Chromium for changed-set touch-target checks
        if: ${{ steps.mode.outputs.legacy == 'true' }}
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" timeout 360 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt timed out or failed; retrying"
            sleep 15
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      # No STATION_CI_FAST_SCOPE: the whole lane, selection included.
      - name: Run legacy unsharded ci:fast
        if: ${{ steps.mode.outputs.legacy == 'true' }}
        env:
          STATION_CI_FAST_BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
          STATION_TYPECHECK_SLOTS: '4'
        run: npm run ci:fast

      - name: Plan the affected-test selection
        id: plan
        if: ${{ steps.mode.outputs.legacy == 'false' }}
        timeout-minutes: 5
        env:
          # Rollout handshake: a new planner under the old base workflow must
          # retain its fixed four-way split; older planners ignore this opt-in.
          STATION_FAST_CHECKS_ADAPTIVE_SHARDS: 'true'
          STATION_CI_FAST_BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
          # Parity with the lane step's env (review F1).
          STATION_TYPECHECK_SLOTS: '4'
        run: npm run fast-checks:shard -- plan --out="$RUNNER_TEMP/fast-checks-plan/fast-checks-plan.json"

      # Verdict-bearing: the shards and the aggregator read this plan, so a
      # failed upload must fail this job rather than be swallowed. `overwrite`
      # lets a re-run of this job replace the plan its dependents re-read.
      - name: Upload fast-checks plan
        if: ${{ steps.mode.outputs.legacy == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-checks-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/fast-checks-plan/fast-checks-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  fast-checks-shard:
    name: fast-checks shard ${{ matrix.shard }}
    needs: fast-checks-plan
    # The status function is load-bearing (#2709 re-land). Without one,
    # GitHub prefixes success(), which is false when ANY ancestor did not
    # succeed -- and `classify` is skipped on every pull_request_target, so
    # #2797's shards were skipped on every same-repository pull request while
    # the plan succeeded (run 36308041839). The condition therefore names the
    # plan's own result: a shard runs only when the plan succeeded (which it
    # can only do under that job's admission guard) AND planned. A legacy
    # candidate (transitional) skips the shards; anywhere else a skipped shard
    # fails the aggregator. ci-fast-checks-job-graph.test.ts evaluates this
    # under GitHub's job-status semantics for every event.
    if: ${{ always() && !cancelled() && needs.fast-checks-plan.result == 'success' && needs.fast-checks-plan.outputs.legacy == 'false' }}
    permissions:
      contents: read
    concurrency:
      # The shard is part of the identity, or the legs would cancel each other.
      group: ci-fast-shard-${{ matrix.shard }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    # The fifteen-minute shard budget (CI_FAST_TIMEOUT_MS, enforced by the
    # shard runner itself) + actionlint (5) + install (15) + zsh (5) +
    # Chromium (20) + ~3 minutes of unbounded setup = 63;
    # ci-workflow-contract.test.ts pins the sum.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # Older candidates do not emit adaptive outputs and retain their plan's
        # four-way split. Unplanned legs are absent, never runner-backed skips.
        shard: ${{ fromJSON(needs.fast-checks-plan.outputs.shards || '[1,2,3,4]') }}
    steps:
      # The shard runs the lane's tests, so it gets the lane's environment
      # (review F1): full history like fast-checks-statics (tests read
      # origin/main and the base), the same PATH and env-shaping steps before
      # the tests, and an npm-script entry so npm_execpath and the npm
      # lifecycle variables match `npm run ci:fast`. ci-workflow-contract.test.ts
      # pins this parity against fast-checks-statics.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download fast-checks plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-checks-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/fast-checks-plan

      # Node alone: an empty slice skips the install and the browser below,
      # and the shard step still runs and writes an explicit `empty` receipt.
      - name: Resolve fast-checks shard slice
        id: slice
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.fast-checks-plan.outputs.shard-count || '4' }}
        run: node scripts/fast-checks-shard.mjs slice --plan="$RUNNER_TEMP/fast-checks-plan/fast-checks-plan.json" --shard="$SHARD/$SHARD_COUNT"

      # The lane's static invariants put actionlint on PATH before its tests
      # ran; a selected test that shells out to it sees the same binary here.
      - name: Install pinned actionlint
        if: ${{ steps.slice.outputs.empty == 'false' }}
        timeout-minutes: 5
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - run: npm run dependencies:ci
        if: ${{ steps.slice.outputs.empty == 'false' }}
        timeout-minutes: 15

      # Same provisioning as full-regression: the selection can include
      # tests that exec zsh (ops/nightly/macos-build-only-cleanup.test.mjs),
      # and ubuntu-22.04 ships without it.
      - name: Provision and preflight zsh for process-heavy installer fixtures
        if: ${{ steps.slice.outputs.empty == 'false' }}
        timeout-minutes: 5
        run: |
          if [[ ! -x /bin/zsh ]]; then
            sudo apt-get update
            sudo apt-get install --yes zsh
          fi
          command -v zsh
          test -x /bin/zsh
          /bin/zsh --version

      # Same provisioning as fast-checks-statics: the selection can include
      # real-Chromium touch-target checks (station#3513).
      - name: Install Chromium for changed-set touch-target checks
        if: ${{ steps.slice.outputs.empty == 'false' }}
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" timeout 360 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt timed out or failed; retrying"
            sleep 15
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      # The same env as fast-checks-statics' lane step, minus the scope.
      - name: Run fast-checks shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.fast-checks-plan.outputs.shard-count || '4' }}
          STATION_CI_FAST_BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
          STATION_TYPECHECK_SLOTS: '4'
        run: npm run fast-checks:shard -- run --plan="$RUNNER_TEMP/fast-checks-plan/fast-checks-plan.json" --shard="$SHARD/$SHARD_COUNT" --receipt=".kontourai/fast-checks/fast-checks-shard-receipt.json"

      # Verdict-bearing: the aggregator fails on a missing receipt, so this
      # upload is never continue-on-error. The attempt is in the name because
      # a re-run of a failed shard uploads beside the earlier attempt.
      - name: Upload fast-checks shard receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-checks-receipt-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .kontourai/fast-checks/fast-checks-shard-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      # Diagnostics (#3101 C): a failing shard's whole redacted Vitest JSON
      # report. Not verdict-bearing, and outside the receipt download pattern.
      - name: Upload failing fast-checks Vitest reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-checks-vitest-reports-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .kontourai/fast-checks/vitest-reports/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  fast-checks-statics:
    name: fast-checks statics
    needs: classify
    # `always()` permits same-repository PR feedback after its intentionally
    # skipped classifier. Fork PRs stay on the isolated fork-smoke job below.
    if: ${{ always() && !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || needs.classify.outputs.heavy == 'true') }}
    permissions:
      contents: read
    concurrency:
      # PR numbers isolate candidate feedback from main's push lane. Event
      # type keeps dispatches isolated from pushes on refs/heads/main.
      #
      # The head sha is part of the identity because the WORK is a commit, not
      # a pull request. Without it, two runs for the same PR at different heads
      # share a group, and `cancel-in-progress` resolves that collision by
      # arrival order — which is not commit recency. Observed four times in one
      # day (#1445): on #1345 the stale pre-rebase run survived and the current
      # head's run was cancelled; on #1348, #1352 and #1353 the current head's
      # own run was cancelled with nothing to replace it, leaving a required
      # check in a state that is neither pass nor fail. #1348 had auto-merge
      # armed and merged within minutes of a manual re-run.
      #
      # `cancel-in-progress` is kept and still does real work: it collapses
      # duplicate runs for the SAME sha, which is what `edited` firing beside
      # `synchronize` produces. What it can no longer do is cancel a run for a
      # commit it is not about.
      group: ci-fast-statics-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    # The declared bounds sum to 53 minutes: actionlint install (5), a
    # bounded 20-minute Chromium installation, the fifteen-minute raw
    # ci:fast budget (#2577, statics only here since #2709), the 10-minute
    # browser smoke, and ~3 minutes for unbounded setup/post steps (~2
    # observed). Fifty-five minutes is a job-level containment fence for those
    # declared stages, not a broader raw-test budget or completion claim;
    # ci-workflow-contract.test.ts pins that it covers their sum.
    timeout-minutes: 55
    steps:
      - name: Check out base policy for pull-request title gate
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Validate base-controlled pull-request title
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/commit-message-gate.mjs --pull-request-title "$PULL_REQUEST_TITLE" "$PULL_REQUEST_NUMBER"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Veritas binds evidence to the PR base/head diff; a depth-1 merge
          # checkout cannot resolve those exact revisions.
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pinned actionlint
        timeout-minutes: 5
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - run: npm run dependencies:ci

      - name: Dependency advisory floor
        run: npm run audit:policy

      # fast-checks' changed-test selection can include real-Chromium
      # touch-target checks (NotificationContainer, station#3513) whenever
      # the merge snapshot touches notification code — and they fail loud
      # (not silently skip) without a browser, redding every affected PR.
      # `playwright install` is called directly so the exported path wins
      # over install:playwright's node_modules pin. Bounded + retried per
      # #3517. Hosted runners are ephemeral, so this installs every job.
      - name: Install Chromium for changed-set touch-target checks
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" timeout 360 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt timed out or failed; retrying"
            sleep 15
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      - name: Run fast CI lane
        id: fast_ci
        env:
          STATION_CI_FAST_BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
          # station#2621: the typecheck slot default sizes from RAM alone
          # (1 per 8 GiB) to protect SHARED dev hosts, so this 4 vCPU /
          # ~15.6 GiB runner gets 2 slots and leaves half its CPUs idle
          # through the 12-lane typecheck aggregate. One job per ephemeral VM
          # has no sibling to protect. The heaviest lane peaks around 2.2 GB
          # RSS, so 4 lanes fit. This is headroom: it does not explain the
          # timed-out runs, which stalled inside the aggregate at low load.
          STATION_TYPECHECK_SLOTS: '4'
          # #2709: the affected-test selection runs in fast-checks-shard, so
          # this job runs only the fixed static invariants of the lane.
          STATION_CI_FAST_SCOPE: statics
        run: npm run ci:fast

      - name: Report contract-test changes for review
        if: always()
        env:
          STATION_REVIEW_BASE: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
        run: node scripts/test-contract-review.mjs

      # Synthetic fixture only: the reference-hardware lane owns actual
      # latency evidence, so arbitrary PR runners cannot pass it by accident.
      - name: Run interactive workspace performance smoke
        run: npm run performance:workspace:smoke

      # station#2290: enforce the initial-payload ratchet on the candidate
      # that changes it. Keeping this in PR feedback prevents bundle growth
      # from landing silently and billing the next contributor at pre-push.
      - name: Enforce candidate UI bundle budget
        run: npm run build:ui

      # Keep critical browser journeys inside the existing required check.
      # The separate manual diagnostic below depends on full-regression and
      # cannot supply pre-merge evidence when that manual job is skipped.
      - name: Verify critical browser journeys before merge
        env:
          STATION_REQUIRED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        timeout-minutes: 10
        run: npm run test:e2e:pr-smoke

      - name: Upload bounded fast-feedback diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Diagnostics: a storage/quota failure here is an infrastructure
        # condition, not a verdict on the code. It must not redden a job
        # whose work passed (station#2218).
        continue-on-error: true
        with:
          name: ci-fast-verification-${{ github.run_id }}
          path: |
            .kontourai/verification-receipts/
            .kontourai/verification-output/
            .kontourai/veritas/external/test-contract-review.json
            .kontourai/code-health/
            .kontourai/browser-evidence/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          # station#4132: upload-artifact v4 EXCLUDES hidden files by default,
          # and .kontourai is a hidden directory — without this line the step
          # matched nothing on every failing run ("No artifacts will be
          # uploaded") while the artifacts sat on disk. Four phantom gate
          # failures in one evening were undiagnosable because of it.
          include-hidden-files: true
          retention-days: 14

  fast-checks:
    needs: [classify, fast-checks-plan, fast-checks-shard, fast-checks-statics]
    # The required check. `always()` without `!cancelled()`, deliberately: a
    # skipped required check reports success, so an aggregator that skipped
    # itself when a run was cancelled would let a cancelled run read green.
    # Running on cancellation instead fails it on the cancelled parts. The
    # event clause matches the part jobs', so pushes that are not heavy and
    # fork pull requests (fork-smoke) skip it exactly as before (#2709).
    if: ${{ always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || needs.classify.outputs.heavy == 'true') }}
    permissions:
      contents: read
    concurrency:
      # The PR number isolates candidate feedback from main's push lane and
      # the event type keeps dispatches apart from pushes on main. The head
      # sha is part of the identity because the WORK is a commit, not a pull
      # request (#1445): without it, runs for one PR at different heads share
      # a group and `cancel-in-progress` resolves the collision by arrival
      # order, which is not commit recency.
      group: ci-fast-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # Base-controlled under pull_request_target: this shell comes from the
      # base branch's workflow, so the job-result half of the verdict cannot
      # be rewritten by the candidate. `classify` is excluded because it is
      # skipped for every pull request by design.
      #
      # TRANSITIONAL legacy branch (#2709): a candidate without the sharded
      # lane ran its whole ci:fast in fast-checks-plan, so that job and
      # fast-checks-statics must succeed and the shards must have skipped.
      # Only the exact outputs 'true'/'false' choose a branch; a missing or
      # garbled one fails. Remove the `true)` arm with the plan job's
      # detection step.
      - name: Require every fast-checks part job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          LEGACY="$(echo "$NEEDS" | jq -r '.["fast-checks-plan"].outputs.legacy // ""')"
          case "$LEGACY" in
            false)
              echo "$NEEDS" | jq -e '[to_entries[] | select(.key != "classify")] | length == 3 and all(.value.result == "success")' > /dev/null
              ;;
            true)
              echo "::warning::legacy candidate: fast-checks ran unsharded in fast-checks-plan"
              echo "$NEEDS" | jq -e '.["fast-checks-plan"].result == "success" and .["fast-checks-statics"].result == "success" and .["fast-checks-shard"].result == "skipped"' > /dev/null
              ;;
            *)
              echo "::error::fast-checks-plan reported no valid legacy mode"
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download fast-checks plan
        if: ${{ needs.fast-checks-plan.outputs.legacy != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fast-checks-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/fast-checks-plan

      - name: Download fast-checks shard receipts
        if: ${{ needs.fast-checks-plan.outputs.legacy != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fast-checks-receipt-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/fast-checks-receipts

      # A missing or failing receipt, a receipt for another plan or head, or
      # a shard that ran anything but its own slice fails the check.
      - name: Verify fast-checks shard receipts
        if: ${{ needs.fast-checks-plan.outputs.legacy != 'true' }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/fast-checks-shard.mjs aggregate --plan-dir="$RUNNER_TEMP/fast-checks-plan" --receipts-dir="$RUNNER_TEMP/fast-checks-receipts"

  ui-bundle-delta:
    name: UI entry bundle delta (report only)
    # #1703: attribute entry-bundle bytes to the pull request that added them.
    # Ceilings carry headroom, so fast-checks' budget step cannot say who grew
    # the bundle. This job builds the PR head and its merge base, each with
    # its own node_modules, and reports the difference as a notice. It is
    # deliberately NOT part of fast-checks: that job is required and on the
    # critical path, and a second install plus build there is the wrong trade
    # for a report. Same-repository PRs only; merge_group is skipped because
    # a queue candidate's share is not useful to a PR author and costs queue
    # minutes. Not a required check. The script scopes itself first (a PR
    # that touches no UI build input ends in seconds) and exits zero once
    # started, naming the reason in a notice when it cannot measure.
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    concurrency:
      # Head sha in the identity for the same reason as fast-checks (#1445):
      # cancel-in-progress must never cancel a run for a commit it is not about.
      group: ui-bundle-delta-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base must be reachable from the PR head.
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Report UI entry bundle delta
        env:
          STATION_UI_BUNDLE_DELTA_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ui-bundle-delta-report.mjs

  fork-smoke:
    name: Fork pull-request smoke
    # This is intentionally exact: untrusted fork code is admitted only to an
    # ephemeral hosted runner, never to the persistent self-hosted fleet.
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    # Contains the fifteen-minute raw ci:fast budget (#2577) plus setup
    # (checkout, actionlint, dependencies:ci; ~2 minutes observed on
    # fast-checks). ci-workflow-contract.test.ts requires at least lane +
    # bounded steps + 3 minutes = 18; twenty leaves room for a slow install.
    timeout-minutes: 20
    steps:
      - name: Check out base policy for pull-request title gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Validate base-controlled pull-request title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/commit-message-gate.mjs --pull-request-title "$PULL_REQUEST_TITLE" "$PULL_REQUEST_NUMBER"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pinned actionlint
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - run: npm run dependencies:ci

      - name: Run isolated fork smoke
        env:
          STATION_CI_FAST_BASE: ${{ github.event.pull_request.base.sha }}
          # See the "Run fast CI lane" step's comment above: this job runs on
          # the same 4 vCPU / ~15.6 GiB `ubuntu-22.04` fleet, single job per
          # ephemeral VM, so the same fix applies.
          STATION_TYPECHECK_SLOTS: '4'
        run: npm run ci:fast

  full-regression:
    permissions:
      contents: read
      actions: read
    # Manual escape hatch only. Nightly and tagged releases call the same
    # reusable workflow with their own already-bound immutable source SHA.
    needs: [classify, fast-checks]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request_target' && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/full-regression.yml
    with:
      source_sha: ${{ github.sha }}

  # No separate browser-smoke job. It needed full-regression without
  # `always()`, and full-regression runs only on workflow_dispatch, so on push
  # and merge_group it never executed (skipped in 200 of the last 200 push
  # runs back to 2026-09-13, and in 39 of the last 40 merge_group runs, the
  # 40th not having reached it); on dispatch it repeated
  # `npm run test:e2e:pr-smoke`, which fast-checks already runs on every
  # event, including dispatch.
  manual-completion-diagnostics:
    # Existing manual-only adjuncts remain available without becoming a second
    # promotion contract. The canonical command already includes the complete
    # Vitest corpus and Veritas repo-governance; this job preserves the focused
    # connected-agent projection and diff-oriented readiness report for an
    # operator who explicitly dispatched PR: CI.
    needs: [classify, full-regression]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && (needs['full-regression'].result == 'success' || needs['full-regression'].result == 'failure') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm run dependencies:ci
      - run: npm run build:sdk && npm run build:connect
      - name: Run connected-agents suite
        run: npm run test:connected-agents

      - name: Veritas readiness evidence
        if: always()
        env:
          HEAD_REF: ${{ github.sha }}
        run: |
          if BASE_REF=$(git rev-parse "${HEAD_REF}^" 2>/dev/null); then
            :
          else
            BASE_REF=
          fi
          if [ -n "$BASE_REF" ] && [ -n "$HEAD_REF" ]; then
            if node scripts/veritas-readiness-evidence.mjs --check evidence \
              --run-id veritas-${{ github.run_id }} \
              --source-ref "workflow_dispatch:${{ github.ref }}" \
              --baseline-ci-fast-status success \
              --changed-from "$BASE_REF" \
              --changed-to "$HEAD_REF"; then
              echo "Veritas readiness evidence recorded."
            else
              READINESS_EXIT=$?
              case "$READINESS_EXIT" in
                1)
                  echo "Veritas readiness evidence reported unmet requirements." >&2
                  exit 1
                  ;;
                2)
                  echo "NOT_VERIFIED: Veritas readiness evidence could not be fully evaluated." >&2
                  exit 2
                  ;;
                *)
                  echo "Veritas readiness evidence could not be evaluated (exit $READINESS_EXIT)." >&2
                  exit 1
                  ;;
              esac
            fi
          else
            echo "NOT_VERIFIED: Veritas readiness evidence has no diff range available." >&2
            exit 2
          fi

  repo-scans:
    name: Repository source scans
    # #2176: suites that walk a whole source tree by path (REPO_SCAN_SUITES in
    # scripts/test-impact-manifest.mjs). No import edge reaches them, so the
    # changed-test selection in fast-checks never picks them, and a violation
    # used to surface first in the merge queue's full corpus (#2553). They run
    # here on every same-repository pull request, beside fast-checks rather
    # than inside it, so they neither spend its twelve-minute budget nor wait
    # on it. Not a required check (yet): a red here is feedback, and the
    # merge-queue regression still runs the same suites.
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    concurrency:
      # Same identity rule as fast-checks: the head sha is part of it, so a
      # run for an older commit can never cancel the current head's run.
      group: ci-repo-scans-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    # 53 suites measured at 73s wall on a dev host at load ~30 (82-125s at
    # load ~110-200; transform and import are most of it); unmeasured on a
    # hosted runner.
    # The rest of the budget is install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm run dependencies:ci

      - name: Run repository source scans
        run: npm run test:repo-scans
