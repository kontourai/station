name: Scheduled dependency advisory floor

# PRs scan changed dependency inputs; this independent scan detects newly
# disclosed advisories even when all committed dependency inputs are unchanged.
#
# Four slots a day rather than one (#1753). A registry-side change reds the
# floor for every PR from the moment it publishes, with no commit to attribute
# it to: a newly disclosed advisory, or an existing advisory's affected range
# narrowing until a ledger residual is unused (the policy fails on an unused
# record by design). On 2026-09-08 three such changes landed after that day's
# scan had already run green at 12:55Z, and each was found by whichever pull
# request gated next. The ledger's approaching-expiry warning cannot see
# either shape — it reads `expires` dates, not what the registry reports.
#
# A failing run files and updates one tracker through main-health.yml, which
# watches this workflow by name and closes the tracker on the next green run.
on:
  schedule:
    # Offset from the hour, which GitHub delays hardest, and kept on the
    # former daily slot's minute. Every six hours bounds the exposure above
    # to one interval; delivery of a scheduled run is itself late by hours
    # under load, so this is a nominal cadence, not a detection deadline.
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-dependency-advisory
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run dependencies:ci
      # This scheduled run is the reliable place an approaching approval expiry
      # surfaces: the policy emits a ::warning:: annotation for every
      # exception or residual within 14 days of its `expires` date, so a
      # maintainer sees the reminder in the run summary before the floor
      # starts failing (#1753). The same annotation appears on any other
      # Actions run that scans (a PR or merge group touching a dependency
      # input); only this schedule fires whether or not anything changed. The
      # annotation does not change the step's exit status.
      - name: Audit every committed dependency scope
        timeout-minutes: 9
        run: npm run audit:policy
      - name: Upload bounded dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .kontourai/verification-output/dependency-audit/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
