name: "Repo: Dependency advisory"

# One central detector for newly disclosed advisories, independent of feature delivery.
# Findings and scan errors remain failures here; main-health owns the one actionable
# tracker, assigned to the dependency-policy CODEOWNER. PR, queue and Nightly
# builds do not repeat this registry scan. Preview/Stable publication scans afresh.
on:
  schedule:
    # Offset from the hour, which GitHub delays hardest, and kept on the
    # former daily slot's minute. Every six hours bounds the exposure above
    # to one interval; delivery of a scheduled run is itself late by hours
    # under load, so this is a nominal cadence, not a detection deadline.
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-dependency-advisory
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with: { install: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run dependencies:ci
      # This scheduled run is the reliable place an approaching approval expiry
      # surfaces: the policy emits a ::warning:: annotation for every
      # exception or residual within 14 days of its `expires` date, so a
      # maintainer sees the reminder in the run summary before the floor
      # starts failing (#1753). The same annotation appears on any other
      # Actions run that scans (a PR or merge group touching a dependency
      # input); only this schedule fires whether or not anything changed. The
      # annotation does not change the step's exit status.
      - name: Audit every committed dependency scope
        timeout-minutes: 9
        run: npm run audit:policy
      - name: Upload bounded dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .kontourai/verification-output/dependency-audit/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
