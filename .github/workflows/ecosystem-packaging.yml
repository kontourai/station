name: "PR: Ecosystem packaging"

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      publish:
        description: Owner-only external publish enablement
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exercise-clean-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with: { install: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run dependencies:ci
      - name: Verify signed manifest, cask, and no-GitHub installer path
        run: npx vitest run --root . scripts/__tests__/ecosystem-manifest.test.ts
      - name: Exercise the real artifact path through the publish boundary
        run: scripts/exercise-ecosystem-packaging-dry-run.sh
      - name: Owner-gated external publish boundary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          STATION_ECOSYSTEM_PUBLISH: ${{ inputs.publish && '1' || '0' }}
          STATION_ECOSYSTEM_MANIFEST_PUBLISH_COMMAND: ${{ secrets.STATION_ECOSYSTEM_MANIFEST_PUBLISH_COMMAND }}
          STATION_ECOSYSTEM_HOMEBREW_TAP_PUBLISH_COMMAND: ${{ secrets.STATION_ECOSYSTEM_HOMEBREW_TAP_PUBLISH_COMMAND }}
        run: scripts/ecosystem-publish-boundary.sh
