name: "Nightly: Portable publication"

# #2675 slice E. Builds the five station-server-<os>-<arch> archives for one
# Nightly version, assembles the schema v2 manifest from their descriptors,
# and signs and verifies it. By default that is the whole run: a dry run
# signed with a throwaway key, which uploads nothing but short-lived run
# artifacts.
#
# Publication is a separate, owner-gated job. It runs only when ALL hold:
#   - the repository variable STATION_PORTABLE_NIGHTLY_PUBLISH is exactly
#     `enabled` (unset today; only the owner sets it);
#   - the run was started on refs/heads/main by nightly.yml, or by
#     main-qualification.yml, which reaches this workflow only through
#     nightly.yml's portable-nightly job (in a called workflow
#     github.workflow_ref names the top-level caller). A direct dispatch of
#     this workflow, on any branch, is always a dry run;
#   - the version comes from the native Nightly's version-code reservation,
#     re-checked here against the source SHA;
#   - the dry-run assembly and verification succeeded.
# It then signs in the portable-nightly-signing environment (main-only
# deployment policy, the only holder of the nightly signing key), uploads the
# versioned assets to the immutable release v<version>, re-downloads and
# compares them, and replaces the rolling portable-nightly manifest LAST,
# after refusing a non-newer version, and finally re-fetches and re-verifies
# it with the pinned key.
#
# Policy (these scripts) runs from the caller's event SHA on main, which the
# plan job binds to the source SHA the archives are built from.
#
# Until the owner enables publication, the dry run must not turn Nightly red:
# plan, the archive matrix and assemble carry continue-on-error while the gate
# variable is not `enabled`, so a failed dry-run job stays red in the run but
# the run (and main-health, which keys on the run conclusion) stays green.
# The publish gate does not rely on job results for that reason: it requires
# assemble's `verified` output, which only its last step sets.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA; must be the calling Nightly's event SHA.
        required: true
        type: string
      marketing_version:
        description: MAJOR.MINOR.PATCH from the native Nightly plan.
        required: true
        type: string
      version_code:
        description: Version code the native Nightly reserved (refs/tags/nightly-version-code/<code>).
        required: true
        type: string
  # Always a dry run: the publish job requires the Nightly caller.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan the Nightly version
    continue-on-error: ${{ vars.STATION_PORTABLE_NIGHTLY_PUBLISH != 'enabled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      version: ${{ steps.identity.outputs.version }}
      reserved: ${{ steps.reserved.outputs.reserved }}
      release_tag: ${{ steps.locations.outputs.release_tag }}
      base_url: ${{ steps.locations.outputs.base_url }}
      rolling_tag: ${{ steps.locations.outputs.rolling_tag }}
      manifest_asset: ${{ steps.locations.outputs.manifest_asset }}
      rolling_manifest_url: ${{ steps.locations.outputs.rolling_manifest_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: identity
        name: Bind the source SHA and derive the Nightly version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          test "$head_sha" = "$GITHUB_SHA"
          if [ -n "$VERSION_CODE" ]; then
            # Called by Nightly: the version is the native reservation, and the
            # reservation tag must bind this exact source.
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a 40-hex SHA" >&2; exit 1; }
            test "$SOURCE_SHA" = "$head_sha" || { echo "source_sha $SOURCE_SHA is not the caller's event SHA $head_sha" >&2; exit 1; }
            version=$(node scripts/portable-nightly-publication.mjs version --marketing-version "$MARKETING_VERSION" --version-code "$VERSION_CODE")
            reserved=$(git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY" "refs/tags/nightly-version-code/$VERSION_CODE" | awk '{ print $1 }')
            test "$reserved" = "$SOURCE_SHA" || { echo "refs/tags/nightly-version-code/$VERSION_CODE names '$reserved', not $SOURCE_SHA" >&2; exit 1; }
          else
            # Direct dispatch: a dry run under a synthetic version that no
            # reservation backs, so it can never satisfy the publish gate.
            marketing=$(node -p 'require("./package.json").version')
            version=$(node scripts/portable-nightly-publication.mjs version --marketing-version "$marketing" --version-code "$GITHUB_RUN_ID")
          fi
          { echo "source_sha=$head_sha"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - id: locations
        name: Name the versioned release and the rolling manifest
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: node scripts/portable-nightly-publication.mjs locations --repository "$GITHUB_REPOSITORY" --version "$VERSION" >> "$GITHUB_OUTPUT"
      # Last output write: under continue-on-error a plan that failed earlier
      # must not hand publish `reserved=true` with missing locations. The
      # identity step above already refused an unbound reservation.
      - id: reserved
        name: Record whether the version is a bound reservation
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ -n "$VERSION_CODE" ]; then echo 'reserved=true'; else echo 'reserved=false'; fi >> "$GITHUB_OUTPUT"

  archives:
    name: Build
    needs: [plan]
    if: ${{ needs.plan.outputs.version != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/portable-server-archives.yml
    with:
      ref: ${{ needs.plan.outputs.source_sha }}
      version: ${{ needs.plan.outputs.version }}
      ring: nightly
      non_blocking: ${{ vars.STATION_PORTABLE_NIGHTLY_PUBLISH != 'enabled' }}

  assemble:
    name: Assemble, dry-run sign and verify
    needs: [plan, archives]
    continue-on-error: ${{ vars.STATION_PORTABLE_NIGHTLY_PUBLISH != 'enabled' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: station-server-*
          path: ${{ runner.temp }}/archives
      - name: Assemble the schema v2 payload from the archive descriptors
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          BASE_URL: ${{ needs.plan.outputs.base_url }}
        run: |
          set -euo pipefail
          node_version=$(node -p 'require("./config/portable-server-node-runtime.json").version')
          protocol_min=$(node --input-type=module -e 'import { PORTABLE_LAUNCHER_PROTOCOL as p } from "./scripts/portable-nightly-publication.mjs"; process.stdout.write(String(p.min))')
          protocol_max=$(node --input-type=module -e 'import { PORTABLE_LAUNCHER_PROTOCOL as p } from "./scripts/portable-nightly-publication.mjs"; process.stdout.write(String(p.max))')
          mkdir -p publication
          # Every target is required: a partial Nightly is not assembled.
          node scripts/ecosystem-manifest.mjs assemble --descriptors "$RUNNER_TEMP/archives" --version "$VERSION" --channel nightly --source-sha "$SOURCE_SHA" --base-url "$BASE_URL" --node-version "$node_version" --launcher-protocol-min "$protocol_min" --launcher-protocol-max "$protocol_max" --output publication/payload.json
      - name: Sign with a throwaway key and verify
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/dry-run-keys"
          node scripts/portable-nightly-publication.mjs dry-run-keys --out-dir "$keys"
          node scripts/ecosystem-manifest.mjs create --payload publication/payload.json --key-id station-portable-nightly-dry-run --private-key "$keys/dry-run-private-key.pem" --allow-unpinned-key --output publication/dry-run-manifest.json
          rm -f "$keys/dry-run-private-key.pem"
          node scripts/ecosystem-manifest.mjs verify --manifest publication/dry-run-manifest.json --keys "$keys/dry-run-keys.json" > /dev/null
          node scripts/portable-nightly-publication.mjs verify --manifest publication/dry-run-manifest.json --keys "$keys/dry-run-keys.json" --expected-payload publication/payload.json
          # The throwaway envelope must never pass the pinned keys.
          if node scripts/ecosystem-manifest.mjs verify --manifest publication/dry-run-manifest.json > /dev/null 2>&1; then
            echo '::error::the dry-run manifest verified against the pinned key table' >&2
            exit 1
          fi
          cp "$keys/dry-run-keys.json" publication/dry-run-keys.json
      - name: Record what this run will do
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISH_GATE: ${{ vars.STATION_PORTABLE_NIGHTLY_PUBLISH }}
        run: |
          {
            echo "Portable Nightly $VERSION assembled and verified with a throwaway key."
            case "$GITHUB_WORKFLOW_REF" in
              "$GITHUB_REPOSITORY/.github/workflows/nightly.yml@refs/heads/main" | "$GITHUB_REPOSITORY/.github/workflows/main-qualification.yml@refs/heads/main") entry=nightly ;;
              *) entry=other ;;
            esac
            if [ "$PUBLISH_GATE" = enabled ] && [ "$entry" = nightly ]; then
              echo 'Publication gate is enabled for this Nightly run: the publish job signs and uploads.'
            else
              echo 'Dry run: nothing is signed with the Nightly key and nothing is uploaded.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-nightly-publication
          path: publication/
          if-no-files-found: error
          retention-days: 7
      # Last step: publish requires this output, so a job whose failure
      # continue-on-error hid can never satisfy the gate.
      - id: verified
        name: Mark the dry run verified
        run: echo 'verified=true' >> "$GITHUB_OUTPUT"

  # The ONLY job that can publish. Keep the gate a literal conjunction on the
  # job itself; scripts/__tests__/portable-nightly-publish-workflow.test.ts
  # pins it, and pins that no other job holds a write token or a secret.
  publish:
    name: Sign and publish (owner-gated)
    needs: [plan, assemble]
    if: ${{ vars.STATION_PORTABLE_NIGHTLY_PUBLISH == 'enabled' && github.ref == 'refs/heads/main' && contains(fromJSON(format('["{0}/.github/workflows/nightly.yml@refs/heads/main","{0}/.github/workflows/main-qualification.yml@refs/heads/main"]', github.repository)), github.workflow_ref) && needs.plan.outputs.reserved == 'true' && needs.plan.outputs.release_tag != '' && needs.assemble.result == 'success' && needs.assemble.outputs.verified == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: portable-nightly-signing
    concurrency:
      group: portable-nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      ROLLING_TAG: ${{ needs.plan.outputs.rolling_tag }}
      MANIFEST_ASSET: ${{ needs.plan.outputs.manifest_asset }}
      ROLLING_MANIFEST_URL: ${{ needs.plan.outputs.rolling_manifest_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: station-server-*
          path: ${{ runner.temp }}/archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-nightly-publication
          path: ${{ runner.temp }}/publication
      - name: Confirm the payload is this run's Nightly
        run: node scripts/portable-nightly-publication.mjs check-payload --payload "$RUNNER_TEMP/publication/payload.json" --version "$VERSION" --source-sha "$SOURCE_SHA"
      - name: Confirm the archives are the bytes the payload signs
        run: node scripts/portable-nightly-publication.mjs check-archives --payload "$RUNNER_TEMP/publication/payload.json" --archives "$RUNNER_TEMP/archives" > "$RUNNER_TEMP/archive-paths.txt"
      - name: Sign with the pinned Nightly key
        env:
          SIGNING_KEY: ${{ secrets.STATION_PORTABLE_NIGHTLY_MANIFEST_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo '::error::STATION_PORTABLE_NIGHTLY_MANIFEST_SIGNING_KEY is not available in portable-nightly-signing' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/nightly-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          node scripts/ecosystem-manifest.mjs create --payload "$RUNNER_TEMP/publication/payload.json" --key-id station-portable-nightly-2026-09 --private-key "$key" --output "$RUNNER_TEMP/$MANIFEST_ASSET"
      - name: Verify the signed manifest with the pinned key table
        run: node scripts/portable-nightly-publication.mjs verify --manifest "$RUNNER_TEMP/$MANIFEST_ASSET" --expected-payload "$RUNNER_TEMP/publication/payload.json"
      - name: Refuse to publish over a newer or equal rolling Nightly
        run: node scripts/portable-nightly-publication.mjs not-regressing --candidate-version "$VERSION" --current "$ROLLING_MANIFEST_URL"
      - name: Require the owner's rolling pointer release and a fresh version
        run: |
          set -euo pipefail
          gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null || { echo "::error::the rolling pointer release $ROLLING_TAG does not exist; the owner creates it before the first publish" >&2; exit 1; }
          # Listed rather than viewed by tag: a draft left by a failed run
          # has no tag yet, and the listing (with this write token) shows it.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) \(.draft)"')
          if [ -n "$existing" ]; then
            read -r release_id release_draft <<< "$existing"
            if [ "$release_draft" = true ]; then
              echo "::error::a draft release $RELEASE_TAG (id $release_id) is left from an earlier failed publish; after checking it, delete it with: gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/$release_id, then re-run" >&2
            else
              echo "::error::release $RELEASE_TAG already exists (id $release_id); versioned Nightly assets are immutable" >&2
            fi
            exit 1
          fi
      - name: Upload the versioned release assets
        run: |
          set -euo pipefail
          mapfile -t archives < "$RUNNER_TEMP/archive-paths.txt"
          # Draft first so no half-uploaded release is ever visible; the tag is
          # created on the source SHA when the draft is published.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --latest=false --title "Station server $RELEASE_TAG" --notes "Portable server Nightly $VERSION from $SOURCE_SHA. Install through the signed rolling manifest ($ROLLING_TAG); these assets are immutable." "${archives[@]}" "$RUNNER_TEMP/$MANIFEST_ASSET"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Re-download the versioned assets and compare them with the manifest
        run: |
          set -euo pipefail
          node scripts/portable-nightly-publication.mjs verify-assets --payload "$RUNNER_TEMP/publication/payload.json"
          node scripts/portable-nightly-publication.mjs verify --manifest "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$MANIFEST_ASSET" --expected-payload "$RUNNER_TEMP/publication/payload.json"
      - name: Replace the rolling Nightly manifest (last)
        run: gh release upload "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/$MANIFEST_ASSET"
      - name: Re-fetch and re-verify the rolling manifest with the pinned key
        run: node scripts/portable-nightly-publication.mjs verify --manifest "$ROLLING_MANIFEST_URL" --expected-payload "$RUNNER_TEMP/publication/payload.json"
