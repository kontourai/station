name: Dated TODO sweep

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report without writing the tracking issue.
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: dated-todo-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Scan dated TODOs
        run: node scripts/dated-todo-sweep.mjs --report .artifacts/dated-todo-report.md
      - name: Print report (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false'
        run: cat .artifacts/dated-todo-report.md
      - name: Upsert tracking issue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/dated-todo-sweep.mjs --upsert --report .artifacts/dated-todo-report.md --date "$(date -u +%F)"
