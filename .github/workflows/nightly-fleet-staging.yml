name: Nightly fleet staging

# Portable-only, evidence-only: this lane does not publish releases, feeds,
# registries, stores, or ledger entries and is independent of native promotion.
on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }

permissions: { contents: read, attestations: write, id-token: write }

jobs:
  fleet-plan:
    if: ${{ github.ref == 'refs/heads/main' && inputs.source_sha == github.sha }}
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      cohort_id: ${{ steps.plan.outputs.cohort_id }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - run: npm run dependencies:ci
      - id: source
        name: Bind staging to the current main event SHA
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "${{ inputs.source_sha }}"
          test "$sha" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Read the reviewed static portable plan
        run: |
          set -euo pipefail
          digest=$(sha256sum config/nightly-fleet-staging-plan.json | awk '{print $1}')
          node scripts/staged-fleet-inventory.mjs assert-plan config/nightly-fleet-staging-plan.json "$digest"
          echo "cohort_id=nightly-${{ steps.source.outputs.sha }}-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "plan_digest=$digest" >> "$GITHUB_OUTPUT"

  portable:
    needs: fleet-plan
    if: ${{ needs.fleet-plan.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions: { contents: read, attestations: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.fleet-plan.outputs.source_sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - run: npm run dependencies:ci && npm run build:connect
      - name: Package and verify the exact-SHA portable staging archive
        run: |
          set -euo pipefail
          commit_epoch=$(git show -s --format=%ct "${{ needs.fleet-plan.outputs.source_sha }}")
          created_at=$(node --input-type=module -e 'const epoch=Number(process.argv[1]); if(!Number.isSafeInteger(epoch)||epoch<0)process.exit(1); process.stdout.write(new Date(epoch*1000).toISOString())' "$commit_epoch")
          scripts/package-portable-release.sh --output-dir fleet-assets --ref "nightly-$(date -u +%F)-$GITHUB_RUN_ATTEMPT" --sha "${{ needs.fleet-plan.outputs.source_sha }}" --created-at "$created_at"
          (cd fleet-assets && sha256sum -c station-nightly-portable.tar.gz.sha256)
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const manifest=JSON.parse(readFileSync("fleet-assets/station-nightly-portable-manifest.json")); if(manifest.sha!==process.argv[1]||manifest.channel!=="nightly-staging"||manifest.prerelease!==true||Object.hasOwn(manifest,"releaseChannel")) process.exit(1); writeFileSync("fleet-assets/portable-build-check.json", JSON.stringify({kind:"station.portable-build-check/v1",result:"PASSED",sourceSha:manifest.sha,archive:manifest.archive})+"\\n")' "${{ needs.fleet-plan.outputs.source_sha }}"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with: { path: fleet-assets, format: cyclonedx-json, output-file: fleet-assets/portable-sbom.cdx.json, syft-version: v1.51.0, upload-artifact: false, upload-release-assets: false }
      - name: Construct one content-bound portable stage receipt
        env: { SOURCE_SHA: "${{ needs.fleet-plan.outputs.source_sha }}", COHORT_ID: "${{ needs.fleet-plan.outputs.cohort_id }}", PLAN_DIGEST: "${{ needs.fleet-plan.outputs.plan_digest }}" }
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("fleet-assets/portable-receipt-input.json", JSON.stringify({id:"portable-server",sourceSha:process.env.SOURCE_SHA,workflowRunId:process.env.GITHUB_RUN_ID,cohortId:process.env.COHORT_ID,cohortPlanDigest:process.env.PLAN_DIGEST,platform:"web-portable",variant:"portable-server",stageState:"STAGED",publicationState:"NOT_PUBLISHED",installState:"NOT_INSTALLED",updateState:"NOT_UPDATED",platformSigningState:"UNSUPPORTED",updaterSigningState:"UNSUPPORTED",artifacts:["station-nightly-portable.tar.gz","station-nightly-portable.tar.gz.sha256","station-nightly-portable-manifest.json","portable-build-check.json","portable-sbom.cdx.json"],checks:[{id:"portable-manifest-and-checksum",result:"PASSED",evidence:"portable-build-check.json"}],sbom:{state:"GENERATED",artifact:"portable-sbom.cdx.json"},attestation:{subjects:["station-nightly-portable.tar.gz","station-nightly-portable.tar.gz.sha256","station-nightly-portable-manifest.json","portable-build-check.json","portable-sbom.cdx.json"]}}))'
          node scripts/staged-fleet-inventory.mjs stage-receipt fleet-assets/portable-receipt-input.json fleet-assets > fleet-assets/stage-receipt-portable.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "fleet-assets/station-nightly-portable.tar.gz\nfleet-assets/station-nightly-portable.tar.gz.sha256\nfleet-assets/station-nightly-portable-manifest.json\nfleet-assets/portable-build-check.json\nfleet-assets/portable-sbom.cdx.json" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "nightly-fleet-portable-${{ github.run_id }}", path: fleet-assets/*, if-no-files-found: error, retention-days: 14 }

  admit-fleet:
    needs: [fleet-plan, portable]
    if: ${{ always() && !cancelled() && needs.fleet-plan.result == 'success' && needs.portable.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions: { contents: read, attestations: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.fleet-plan.outputs.source_sha }}", persist-credentials: false }
      # `staged-fleet-inventory.mjs` validates the stage receipt with ajv, so
      # this job needs the pinned Node and the locked dependencies like its
      # siblings; on the runner's default Node with no node_modules the first
      # Nightly to reach this leg died with ERR_MODULE_NOT_FOUND (ajv).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - run: npm run dependencies:ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "nightly-fleet-portable-${{ github.run_id }}", path: staged }
      - name: Verify every attested subject with exact workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: "${{ needs.fleet-plan.outputs.source_sha }}"
        run: |
          set -euo pipefail
          node scripts/staged-fleet-inventory.mjs assert-stage-receipt staged/stage-receipt-portable.json staged
          index=0
          while IFS= read -r subject; do
            name=$(printf '%s' "$subject" | jq -r .name)
            gh attestation verify "staged/$name" --repo "$GITHUB_REPOSITORY" --source-ref refs/heads/main --source-digest "$SOURCE_SHA" --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/nightly-fleet-staging.yml@refs/heads/main" --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners --format json > "staged/attestation-verify-$index.json"
            index=$((index + 1))
          done < <(jq -c '.attestation.subjects[]' staged/stage-receipt-portable.json)
      - name: Compose the fixed plan and admit only byte and proof matches
        run: node scripts/staged-fleet-inventory.mjs admit-fixed config/nightly-fleet-staging-plan.json staged/stage-receipt-portable.json staged > staged/staged-fleet-inventory.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: staged/staged-fleet-inventory.json }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "nightly-fleet-staged-inventory-${{ github.run_id }}", path: staged/staged-fleet-inventory.json, if-no-files-found: error, retention-days: 30 }
