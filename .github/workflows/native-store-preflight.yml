name: Native store credential preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-store-preflight
  cancel-in-progress: false

jobs:
  ios-testflight-readiness:
    runs-on: macos-15
    environment: native-release
    timeout-minutes: 20
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc }
      - run: npm run dependencies:ci
      - name: Validate the protected iOS signing inputs and identity
        env:
          APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD APPLE_DEVELOPMENT_TEAM APPLE_SIGNING_IDENTITY APPLE_PROVISIONING_PROFILE_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing required protected value: $name" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/station-preflight.p12"
          profile="$RUNNER_TEMP/station-preflight.mobileprovision"
          keychain="$RUNNER_TEMP/station-preflight.keychain-db"
          printf '%s' "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          node scripts/check-ios-store-profile.mjs --profile "$profile" --label APPLE_PROVISIONING_PROFILE_BASE64
          node scripts/ios-store-signing-config.mjs --profile "$profile" --identity "$APPLE_SIGNING_IDENTITY" --team "$APPLE_DEVELOPMENT_TEAM" --bundle-id io.kontourai.station --template src-desktop/gen/apple/project.yml --template-output "$RUNNER_TEMP/station-ios-preflight-project.yml" --overlay-output "$RUNNER_TEMP/station-ios-preflight-overlay.json"
          security create-keychain -p "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" "$keychain"
          identities=$(security find-identity -v -p codesigning "$keychain")
          printf '%s\n' "$identities" | grep -F "$APPLE_SIGNING_IDENTITY"
      - name: Verify the App Store Connect Station record
        run: |
          node scripts/app-store-connect-receipt.mjs app-preflight \
            --bundle-id io.kontourai.station \
            --output "$RUNNER_TEMP/app-store-connect-app-preflight.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Remove the ephemeral signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/station-preflight.keychain-db" 2>/dev/null || true
