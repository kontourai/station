name: CI Extended

on:
  # Dispatch only. #518 (2026-08-30) made this weekly; every scheduled run
  # through 2026-09-19 failed (3 of 3, infrastructure errors in the coverage
  # lane), so the schedule produced a red nobody acted on. Restore the cron
  # once a dispatched run is green.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coverage needs nothing from the physical fleet host: unlike the
  # uninstrumented corpus below (playwright-full), every slice here is a
  # plain Vitest process with `--coverage.enabled`. #2416 measured the
  # previous single self-hosted job (every slice serial, one capacity-leased
  # host) missing its 100-minute lane deadline after only the 8 ordinary
  # shards, so the merge refused (13 missing slices) without ever reaching a
  # threshold — and it still had to wait its turn behind playwright-full for
  # the one physical host's lease.
  #
  # `coverage-shard` runs the resource-profiled corpus plan
  # (`coverageShardIds()`, scripts/run-coverage-corpus.mjs) as one hosted job
  # PER SLICE — the same shape merge-queue-regression.yml already uses for
  # the uninstrumented corpus — and uploads each slice's `coverage-final.json`
  # as its own artifact. `coverage-merge` downloads every shard and runs the
  # exact fail-closed merge and thresholds the serial lane always ran. The
  # matrix must name every slice the plan expects, or the merge correctly
  # refuses on whichever slice(s) never got a job: pinned by
  # scripts/__tests__/ci-workflow-contract.test.ts, which derives the
  # expected slice set from `coverageShardIds()` rather than restating it.
  #
  # Not gated on playwright-full any more: a hosted job holds no physical
  # host capacity, so nothing forces these two surfaces to serialize the way
  # sharing one lease used to. They now run concurrently, which is the other
  # half of the time this recovers — coverage stops eating fleet-host wall
  # time playwright-full could otherwise use.
  coverage-shard:
    name: Coverage corpus ${{ matrix.id }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # `timeoutMinutes` is `ceil(phase.timeoutMs / 60000 * 1.5) + 15`: the
      # canonical full-regression phase fence for this slice
      # (scripts/verification-lanes.mjs), scaled by the same
      # COVERAGE_SLICE_TIMEOUT_SCALE the serial lane already applied for V8
      # instrumentation overhead (scripts/run-coverage-corpus.mjs), plus a
      # flat 15-minute setup allowance (checkout, deps, Chromium, SDK
      # builds) — pinned by ci-workflow-contract.test.ts against those same
      # constants, not restated as a bare number there.
      matrix:
        include:
          - id: ordinary-1-of-8
            args: --group=ordinary --shard=1/8
            timeoutMinutes: 45
          - id: ordinary-2-of-8
            args: --group=ordinary --shard=2/8
            timeoutMinutes: 45
          - id: ordinary-3-of-8
            args: --group=ordinary --shard=3/8
            timeoutMinutes: 45
          - id: ordinary-4-of-8
            args: --group=ordinary --shard=4/8
            timeoutMinutes: 45
          - id: ordinary-5-of-8
            args: --group=ordinary --shard=5/8
            timeoutMinutes: 45
          - id: ordinary-6-of-8
            args: --group=ordinary --shard=6/8
            timeoutMinutes: 45
          - id: ordinary-7-of-8
            args: --group=ordinary --shard=7/8
            timeoutMinutes: 45
          - id: ordinary-8-of-8
            args: --group=ordinary --shard=8/8
            timeoutMinutes: 45
          - id: process-heavy
            args: --group=process-heavy
            timeoutMinutes: 60
          - id: process-exclusive
            args: --group=process-exclusive
            timeoutMinutes: 21
          - id: coordinator-exclusive
            args: --group=coordinator-exclusive
            timeoutMinutes: 21
          - id: credential-ledger-exclusive
            args: --group=credential-ledger-exclusive
            timeoutMinutes: 21
          - id: shared-output
            args: --group=shared-output
            timeoutMinutes: 21
          - id: dogfood-reconcile
            args: --group=dogfood-reconcile
            timeoutMinutes: 23
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - run: npm run dependencies:ci

      # Same fixture prerequisite as merge-queue-regression.yml's hosted
      # corpus jobs: some process-heavy/exclusive-group installer fixtures
      # exercise zsh directly.
      - name: Provision and preflight zsh for process-heavy installer fixtures
        timeout-minutes: 5
        run: |
          if [[ ! -x /bin/zsh ]]; then
            sudo apt-get update
            sudo apt-get install --yes zsh
          fi
          command -v zsh
          test -x /bin/zsh
          /bin/zsh --version

      # The corpus includes real-Chromium geometry tests. Same retry-and-cap
      # install merge-queue-regression.yml's hosted jobs already use.
      - name: Install Chromium for full-corpus browser assertions
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          installed=false
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" timeout 360 npx playwright install chromium; then
              installed=true
              break
            fi
            echo "::warning::Playwright install attempt $attempt timed out or failed; retrying"
            sleep 15
          done
          if [[ "$installed" != true ]]; then
            echo "::error::Playwright install failed after 3 attempts"
            exit 1
          fi

      # The canonical lane builds the SDKs and the connect/CLI bundles before
      # its corpus phases; the merge-queue regression prepares the same way.
      - name: Prepare the corpus prerequisites
        run: |
          node scripts/run-full-regression-phases.mjs --phase=browser-prerequisite --phase=sdk-builds
          npm run prepare:verify-static

      # `--coverage-root` writes only this slice's istanbul JSON, under
      # `coverage/shards/<id>/` — never the raw, uninstrumented corpus
      # command a package.json `:raw` script would name (this repo forbids
      # spelling those directly in a workflow; see scripts/AGENTS.md).
      - name: Run coverage slice
        run: node scripts/run-vitest-corpus.mjs ${{ matrix.args }} --coverage-root=coverage/shards

      # A slice whose tests failed writes no report (Vitest's
      # `reportOnFailure: false`), so a failed step here uploads nothing and
      # coverage-merge correctly reports that slice missing rather than
      # reading a stale or partial report.
      - name: Upload coverage shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.id }}
          path: coverage/shards/${{ matrix.id }}/
          if-no-files-found: ignore
          retention-days: 1

  coverage-merge:
    name: Coverage merge and thresholds
    needs: coverage-shard
    # always(): a run that reports every missing slice by name is more useful
    # than one that stops at the first shard failure — the same fail-closed
    # philosophy scripts/run-coverage-corpus.mjs already applies to a live
    # serial run (it collects every problem before refusing).
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - run: npm run dependencies:ci

      # Every `coverage-shard` leg uploads its own artifact (a job whose
      # tests failed uploads nothing); an id the plan expects but no leg
      # produced simply has no matching artifact here; if-no-artifact-found:
      # warn keeps that a report line rather than a hard failure of THIS
      # step, so the merge below can still name every missing slice by id.
      - name: Download coverage shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards-download
          if-no-artifact-found: warn

      # Reconstitutes exactly the `coverage/shards/<id>/coverage-final.json`
      # tree the serial lane produced in one job, from the id each artifact's
      # name carries (download-artifact nests each matched artifact under its
      # own name by default).
      - name: Arrange downloaded shard reports for the merge
        run: |
          set -euo pipefail
          mkdir -p coverage/shards
          shopt -s nullglob
          for dir in coverage-shards-download/coverage-shard-*/; do
            id="$(basename "$dir")"
            id="${id#coverage-shard-}"
            mkdir -p "coverage/shards/$id"
            cp -R "$dir." "coverage/shards/$id/"
          done

      # Runs no tests of its own: applies the same fail-closed merge and
      # thresholds scripts/run-coverage-corpus.mjs always applied to a live
      # serial run, to the shard reports downloaded above.
      - name: Merge coverage shards and evaluate thresholds
        run: npm run test:coverage:merge

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Diagnostics: a storage/quota failure here is an infrastructure
        # condition, not a verdict on the code. It must not redden a job
        # whose work passed (station#2218).
        continue-on-error: true
        with:
          name: coverage-verification-${{ github.run_id }}
          path: |
            coverage/*.json
          if-no-files-found: ignore
          retention-days: 7

  playwright-full:
    name: Full Playwright Coverage
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, kontour-linux, heavy-host, playwright]
    # #2416: this job hit its own 90-minute timeout at 88 minutes because one
    # bucket (smoke-live) alone spent 49 of those minutes, mostly timing out
    # on engine-dependent tests since removed by #2422 — no bucket had a
    # budget of its own, so one slow bucket could eat every minute the others
    # needed. The buckets stay serial-with-overlap in this ONE job (still the
    # one physical-host capacity lease below; a per-bucket matrix would each
    # need its own lease and just queue behind itself, repeating checkout,
    # install, Chromium and the SDK builds like the coverage job used to).
    # Each bucket now carries its own deadline instead
    # (scripts/run-e2e-coverage.mjs BUCKETS[].timeoutMs): a bucket that
    # exceeds it is cancelled and reported TIMEOUT, distinct from FAIL, and
    # every other bucket still runs to its own completion or deadline. 110
    # minutes covers every bucket's deadline running back-to-back (worst
    # case; the weighted scheduler already overlaps some of them) plus setup.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: kontourai/.github/actions/runner-preflight@1d267a33147d1ce5925ffd1f9aa0ef2063d0d7ef

      - name: Reserve physical host capacity
        uses: kontourai/.github/actions/physical-host-capacity@563effe7ec559c6f4fcc6c80b3532acb71d86373
        with:
          coordination-root: /mnt/e/kontour-runner-capacity
          host-id: desktop-win
          capacity-units: "10"
          lease-weight: "9"
          timeout-seconds: "600"
          owner-lifetime-seconds: "7800"

      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - run: npm run dependencies:ci

      # Bound + classify the browser install: it occasionally wedges on the
      # CDN, and with no timeout it ran toward the 6h job default. Each
      # attempt is capped so a hang dies fast and self-heals on retry — but
      # only a transient or unrecognised failure is retried now, because the
      # previous inline loop retried everything. It apt-installed system
      # libraries as root, the fleet's runner account has no passwordless
      # sudo, and so all three attempts failed identically in about half a
      # second each while the warning called that permanent condition
      # retryable. `verify:e2e:full` below had therefore never run once
      # (station#1648, measured on run 33970282053).
      #
      # The system libraries are already on this host, so no root is needed:
      # the container-smoke lane installs this same repo-pinned Chromium
      # without the removed flag, on this same runner, and launches it for
      # real browser tests that pass. `scripts/install-playwright-browsers.mjs`
      # refuses the flag outright so it cannot come back, and a missing system
      # library would now be reported as a runner-image change rather than
      # retried three times.
      #
      # Installed to the persistent runner's `$HOME/.cache/ms-playwright`,
      # exported job-wide via `$GITHUB_ENV` — same convention as `fast-checks`'
      # and `full-regression`'s Chromium installs (station#3517).
      # The install is idempotent and ensures the repo-pinned revision exists.
      # `npm run install:playwright` hardcodes an in-`node_modules`
      # browsers path as a package.json prefix, which would override the
      # exported path, so this calls the install script directly instead.
      # `verify:e2e:full` below (via `scripts/run-e2e-suite.mjs`) honors any
      # already-set `PLAYWRIGHT_BROWSERS_PATH` rather than forcing `0`, so it
      # resolves the same path this step installs to.
      - name: Install Playwright browsers
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" node scripts/install-playwright-browsers.mjs chromium

      # Specs whose manifest entry declares `requiresAccount` (a signed-in
      # engine CLI) are skipped before they start and listed under "Disabled
      # in CI (requires account)" in this step's summary and the latest-E2E
      # manifest: this runner holds no account until #2318.
      - name: Run coordinated full Playwright coverage
        env:
          STATION_CI_ACCOUNTS: absent
        run: npm run verify:e2e:full

      - name: Upload Playwright verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Diagnostics: a storage/quota failure here is an infrastructure
        # condition, not a verdict on the code. It must not redden a job
        # whose work passed (station#2218).
        continue-on-error: true
        with:
          name: playwright-full-verification-${{ github.run_id }}
          path: |
            .kontourai/verification-receipts/
            .kontourai/verification-output/
            playwright-report/
            test-results/
            gallery/
            .kontourai/e2e-latest/
          if-no-files-found: ignore
          retention-days: 14
