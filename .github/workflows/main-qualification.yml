name: "Main: Qualification"

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run fresh qualification even when this exact SHA already passed
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/full-regression.yml
    with:
      capacity_class: background
      source_sha: ${{ github.sha }}
      allow_reuse: ${{ !inputs.force }}

  delivery-validation:
    needs: [qualification]
    if: needs.qualification.result == 'success'
    uses: ./.github/workflows/delivery-validation.yml
