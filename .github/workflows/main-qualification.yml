name: "Main: Qualification"

on:
  push:
    branches: [main]
    # The release bot's ledger commits change only these files. A push that
    # changes nothing else starts no run, so it cannot displace a pending
    # source run.
    # Scheduled runs on such a commit still qualify it: a test failure on an
    # ancestor that differs only in these files counts (see
    # qualification-evidence.mjs), and a pass never does.
    paths-ignore:
      - docs/reference/deploy-ledger.json
      - docs/reference/deploy-ledger.md
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run fresh qualification even when this exact SHA already passed
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Coalesce only pushes; scheduled/manual requests retain their own admission.
# This group covers source qualification, not downstream delivery validation.
jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: ${{ github.event_name == 'push' && 'station-main-qualification-push' || format('station-main-qualification-deliberate-{0}', github.run_id) }}
      cancel-in-progress: false
    uses: ./.github/workflows/full-regression.yml
    with:
      capacity_class: background
      source_sha: ${{ github.sha }}
      allow_reuse: ${{ !inputs.force }}
      # A scheduled run on a source whose corpus already failed tests in the
      # last 24 hours fails without repeating it; pushes and manual dispatches
      # always execute.
      skip_failed_source: ${{ github.event_name == 'schedule' }}

  delivery-validation:
    needs: [qualification]
    if: github.event_name != 'push' && needs.qualification.result == 'success'
    uses: ./.github/workflows/delivery-validation.yml
