name: "Main: Qualification"

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run fresh qualification even when this exact SHA already passed
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Keep the admitted run; replace only the waiting revision as main advances.
# This group covers source qualification, not downstream delivery validation.
jobs:
  qualification:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: station-main-qualification-latest
      cancel-in-progress: false
    uses: ./.github/workflows/full-regression.yml
    with:
      capacity_class: background
      source_sha: ${{ github.sha }}
      allow_reuse: ${{ !inputs.force }}

  delivery-validation:
    needs: [qualification]
    if: github.event_name != 'push' && needs.qualification.result == 'success'
    uses: ./.github/workflows/delivery-validation.yml
