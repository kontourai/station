name: "Release: Dependency advisory gate"

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      audit_id:
        description: Unique publication boundary within this run
        required: true
        type: string
      policy_sha:
        description: Trusted policy snapshot; omitted callers select the default branch once
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with: { install: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run dependencies:ci
      - name: Check out trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.policy_sha || github.event.repository.default_branch }}
          path: release-policy
          persist-credentials: false
      - name: Install trusted policy tooling independently of the candidate
        working-directory: release-policy
        run: npm run dependencies:ci
      - name: Audit the exact release graph with trusted policy
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          policy_sha=$(git -C release-policy rev-parse HEAD)
          node release-policy/scripts/release-advisory-gate.mjs --source-root "$GITHUB_WORKSPACE" --source-sha "$RELEASE_SHA" --policy-sha "$policy_sha" --output "$RUNNER_TEMP/release-advisory.json"
      - name: Retain exact-source advisory decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-advisory-${{ inputs.audit_id }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-advisory.json
          if-no-files-found: warn
          retention-days: 14
