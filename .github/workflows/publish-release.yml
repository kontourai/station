name: "Release: Publish"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag, or published rollback target with break glass
        required: true
        type: string
      allow_updater_pointer_regression:
        description: Break glass only - permit an older rolling desktop pointer after owner review
        required: false
        default: false
        type: boolean
      allow_published_pointer_repair:
        description: Break glass only - admit a published tag as a desktop pointer repair source
        required: false
        default: false
        type: boolean
      allow_empty_updater_channel_bootstrap:
        description: Owner bootstrap only - initialize a new empty rolling desktop release
        required: false
        default: false
        type: boolean
      allow_empty_host_manifest_bootstrap:
        description: Owner bootstrap only - publish the first manifest to an empty rolling host-stream pointer
        required: false
        default: false
        type: boolean

concurrency:
  group: station-release-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      created_at: ${{ steps.source.outputs.created_at }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
      desktop_updater_tag: ${{ steps.source.outputs.desktop_updater_tag }}
      has_current_updater_manifest: ${{ steps.source.outputs.has_current_updater_manifest }}
      pointer_repair_only: ${{ steps.source.outputs.pointer_repair_only }}
      policy_sha: ${{ steps.source.outputs.policy_sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The only checkout of the moving default branch. Later jobs check out
      # the commit recorded here, so every job runs one policy revision.
      - name: Check out default-branch release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-policy
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: npm run dependencies:ci
      - name: Resolve tag to one immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PUBLISHED_POINTER_REPAIR: ${{ inputs.allow_published_pointer_repair }}
          ALLOW_EMPTY_UPDATER_CHANNEL_BOOTSTRAP: ${{ inputs.allow_empty_updater_channel_bootstrap }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.([1-9][0-9]*))?$ ]]
          # No checkout persists a credential, so this one fetch carries the
          # read-only job token in process-scoped config only.
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          policy_sha=$(git -C release-policy rev-parse HEAD)
          [[ "$policy_sha" =~ ^[0-9a-f]{40}$ ]]
          sha=$(git rev-list -n 1 "$RELEASE_TAG")
          tag_release=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)
          tag_release_state=$(TAG_RELEASE="$tag_release" node -p 'JSON.parse(process.env.TAG_RELEASE).isDraft')
          if [[ "$tag_release_state" == true ]]; then
            pointer_repair_only=false
          elif [[ "$tag_release_state" == false && "$ALLOW_PUBLISHED_POINTER_REPAIR" == true ]]; then
            pointer_repair_only=true
          else
            echo "::error::$RELEASE_TAG must still be a draft unless allow_published_pointer_repair explicitly admits a published repair source." >&2
            exit 1
          fi
          desktop_updater_tag=$(node release-policy/scripts/lib/native-release-config.mjs --tag "$RELEASE_TAG" --print-desktop-updater-tag)
          if ! updater_release=$(gh release view "$desktop_updater_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets); then
            echo "::error::Could not query rolling release $desktop_updater_tag; see the GitHub CLI diagnostic above. Bootstrap it if it does not exist, otherwise retry after API recovery." >&2
            exit 1
          fi
          updater_release_state=$(UPDATER_RELEASE="$updater_release" node -p 'JSON.parse(process.env.UPDATER_RELEASE).isDraft')
          if [[ "$updater_release_state" == true ]]; then
            echo "::error::$desktop_updater_tag is a draft release; its download URLs are unavailable to installed apps." >&2
            exit 1
          fi
          if [[ "$updater_release_state" != false ]]; then
            echo "::error::Could not verify $desktop_updater_tag is public; refusing to publish this channel." >&2
            exit 1
          fi
          has_current_updater_manifest=$(UPDATER_RELEASE="$updater_release" node -p 'JSON.parse(process.env.UPDATER_RELEASE).assets.some(({name}) => name === "latest.json")')
          updater_asset_count=$(UPDATER_RELEASE="$updater_release" node -p 'JSON.parse(process.env.UPDATER_RELEASE).assets.length')
          if [[ "$has_current_updater_manifest" != true ]]; then
            if [[ "$updater_asset_count" != 0 ]]; then
              echo "::error::$desktop_updater_tag has assets but no latest.json; refusing to treat a damaged channel as a bootstrap." >&2
              exit 1
            fi
            if [[ "$ALLOW_EMPTY_UPDATER_CHANNEL_BOOTSTRAP" != true ]]; then
              echo "::error::$desktop_updater_tag is empty; an owner must explicitly allow its first publish with allow_empty_updater_channel_bootstrap." >&2
              exit 1
            fi
          fi
          created_at=$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' "$(git show -s --format=%ct "$sha")")
          {
            echo "sha=$sha"
            echo "created_at=$created_at"
            echo "version=${RELEASE_TAG#v}"
            echo "channel=$([[ "$RELEASE_TAG" == *-preview.* ]] && echo preview || echo stable)"
            echo "desktop_updater_tag=$desktop_updater_tag"
            echo "has_current_updater_manifest=$has_current_updater_manifest"
            echo "pointer_repair_only=$pointer_repair_only"
            echo "policy_sha=$policy_sha"
          } >> "$GITHUB_OUTPUT"

  qualification:
    needs: resolve
    if: needs.resolve.outputs.pointer_repair_only != 'true'
    uses: ./.github/workflows/full-regression.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, qualification]
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && (needs.qualification.result == 'success' || needs.resolve.outputs.pointer_repair_only == 'true') }}
    runs-on: ubuntu-latest
    environment: native-release-publish
    # Set once the release is public and its desktop pointer verified, so the
    # host-pointer job can run even if a later step (the ledger) fails.
    outputs:
      released: ${{ steps.released.outputs.released }}
    permissions:
      contents: write
      packages: write
      attestations: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_CREATED_AT: ${{ needs.resolve.outputs.created_at }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_RING: ${{ needs.resolve.outputs.channel }}
      DESKTOP_UPDATER_TAG: ${{ needs.resolve.outputs.desktop_updater_tag }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      VITE_NATIVE_APP_UPDATE_FEED_URL: ${{ vars.NATIVE_APP_UPDATE_FEED_URL }}
      VITE_NATIVE_APP_UPDATE_PROVIDER_ORIGIN: ${{ vars.NATIVE_APP_UPDATE_PROVIDER_ORIGIN }}
      VITE_NATIVE_APP_UPDATE_CHANNEL: ${{ needs.resolve.outputs.channel == 'preview' && 'beta' || 'stable' }}
      VITE_NATIVE_APP_VERSION: ${{ needs.resolve.outputs.version }}
      NATIVE_APP_UPDATE_ACTION_URL: ${{ vars.NATIVE_APP_UPDATE_ACTION_URL }}
      NATIVE_APP_UPDATE_ACTION_KIND: ${{ vars.NATIVE_APP_UPDATE_ACTION_KIND }}
      NATIVE_APP_UPDATE_ACTION_ORIGINS: ${{ vars.NATIVE_APP_UPDATE_ACTION_ORIGINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Tags supply release CONTENT only. Every policy script this job runs
      # comes from this default-branch checkout (the commit resolve pinned),
      # so a tooling fix on main reaches old tags. Full history and no
      # persisted credential match the nightly ledger commit-back, which runs
      # in this checkout.
      - name: Check out default-branch release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          path: release-policy
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: npm run dependencies:ci
      - name: Download and revalidate every staged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*'
          node release-policy/scripts/release-artifacts.mjs validate --assets-dir release-assets --inventory release-assets/station-release-inventory.json --container-descriptor release-assets/station-container-release.json --updater-public-key release-assets/station-updater-public-key.txt
          node release-policy/scripts/release-sbom-predicates.mjs --assets-dir release-assets
          test "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("release-assets/station-release-inventory.json")).sourceSha)' )" = "$RELEASE_SHA"
          test "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("release-assets/station-container-release.json")).createdAt)' )" = "$RELEASE_CREATED_AT"
          release-policy/scripts/verify-release-checksums.sh release-assets
      - name: Derive the common frozen desktop provenance only after all package gates
        run: |
          set -euo pipefail
          for architecture in aarch64 x86_64; do
            archive="release-assets/station-${RELEASE_TAG}-macos-${architecture}.app.tar.gz"
            manifest_path=$(tar -tzf "$archive" | grep '/Contents/Resources/dist-server/station-build.json$')
            test "$(printf '%s\n' "$manifest_path" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
            tar -xOf "$archive" "$manifest_path" > "$RUNNER_TEMP/station-client-build-${architecture}.json"
            test "$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1])).sha' "$RUNNER_TEMP/station-client-build-${architecture}.json")" = "$RELEASE_SHA"
          done
          cmp "$RUNNER_TEMP/station-client-build-aarch64.json" "$RUNNER_TEMP/station-client-build-x86_64.json"
          cp "$RUNNER_TEMP/station-client-build-aarch64.json" "$RUNNER_TEMP/station-desktop-common-client-build.json"
      - name: Verify GitHub provenance for every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release\\.yml@refs/tags/${RELEASE_TAG}$"
          host_manifest=$(node release-policy/scripts/portable-release-publication.mjs manifest-asset --ring "$RELEASE_RING")
          for asset in release-assets/*; do
            # The signed host-stream manifest is attached by this workflow, not
            # release.yml; the revalidation above verified it against the
            # pinned release key and the attested payload it signs.
            if [ "$(basename "$asset")" = "$host_manifest" ]; then continue; fi
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_SHA" \
              --cert-identity-regex "$identity" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --deny-self-hosted-runners
          done
      # #2959: the host-stream manifest. Everything before the owner's gate is
      # a dry run that signs nothing and uploads nothing. Each gated step's
      # `if:` is the same literal: vars.STATION_PORTABLE_RELEASE_PUBLISH ==
      # 'enabled'. With the gate on, a missing signing secret fails the job
      # before the release is published. This job signs and attaches the
      # versioned manifest; the host-pointer job below takes it from the
      # public versioned release and moves the rolling pointer. scripts/__tests__/portable-release-publish-workflow.test.ts
      # pins the gate, the secret scope and the order.
      - id: host_plan
        name: Plan the host-stream manifest publication
        env:
          PUBLISH_GATE: ${{ vars.STATION_PORTABLE_RELEASE_PUBLISH }}
        run: |
          set -euo pipefail
          payload=release-assets/station-server-manifest-payload.json
          node release-policy/scripts/portable-release-publication.mjs locations --ring "$RELEASE_RING" --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          node release-policy/scripts/portable-release-publication.mjs check-payload --ring "$RELEASE_RING" --payload "$payload" --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY"
          node release-policy/scripts/portable-release-publication.mjs check-archives --payload "$payload" --archives release-assets > /dev/null
          if [ "$PUBLISH_GATE" = enabled ]; then
            echo "Host-stream publication gate is enabled: the $RELEASE_RING manifest is signed with the release key and its rolling pointer is replaced." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Host-stream dry run: nothing is signed with the release key and nothing is uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Dry-run sign the host-stream manifest with a throwaway key
        run: |
          set -euo pipefail
          payload=release-assets/station-server-manifest-payload.json
          dry_run="$RUNNER_TEMP/host-dry-run"
          node release-policy/scripts/portable-release-publication.mjs dry-run-keys --ring "$RELEASE_RING" --out-dir "$dry_run"
          node release-policy/scripts/ecosystem-manifest.mjs create --payload "$payload" --key-id station-portable-release-dry-run --private-key "$dry_run/dry-run-private-key.pem" --allow-unpinned-key --output "$dry_run/manifest.json"
          rm -f "$dry_run/dry-run-private-key.pem"
          node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$dry_run/manifest.json" --keys "$dry_run/dry-run-keys.json" --expected-payload "$payload"
          # The throwaway envelope must never pass the pinned keys, and the
          # refusal must be the unpinned-key one, not a wrong path or argument.
          if node release-policy/scripts/ecosystem-manifest.mjs verify --manifest "$dry_run/manifest.json" > /dev/null 2> "$dry_run/pinned-verify.err"; then
            echo '::error::the dry-run host manifest verified against the pinned key table' >&2
            exit 1
          fi
          grep -qxF 'manifest signing key station-portable-release-dry-run is not pinned' "$dry_run/pinned-verify.err" || { echo '::error::the pinned-key check refused the dry-run host manifest for an unexpected reason:' >&2; cat "$dry_run/pinned-verify.err" >&2; exit 1; }
      - name: Sign the host-stream manifest with the pinned release key
        if: ${{ vars.STATION_PORTABLE_RELEASE_PUBLISH == 'enabled' }}
        env:
          SIGNING_KEY: ${{ secrets.STATION_PORTABLE_RELEASE_MANIFEST_SIGNING_KEY }}
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo '::error::STATION_PORTABLE_RELEASE_PUBLISH is enabled, but STATION_PORTABLE_RELEASE_MANIFEST_SIGNING_KEY is not available in the native-release-publish environment. Add the secret, or unset the variable to publish without the host-stream manifest.' >&2; exit 1; }
          umask 077
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          mkdir -p "$RUNNER_TEMP/host-manifest"
          node release-policy/scripts/ecosystem-manifest.mjs create --payload release-assets/station-server-manifest-payload.json --key-id station-portable-release-2026-09 --private-key "$key" --output "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET"
      - name: Verify the signed host-stream manifest with the pinned key table
        if: ${{ vars.STATION_PORTABLE_RELEASE_PUBLISH == 'enabled' }}
        env:
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
        run: node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET" --expected-payload release-assets/station-server-manifest-payload.json
      - name: Require the owner's rolling host-stream pointer release
        if: ${{ vars.STATION_PORTABLE_RELEASE_PUBLISH == 'enabled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: ${{ steps.host_plan.outputs.rolling_tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft') || { echo "::error::the rolling pointer release $ROLLING_TAG does not exist; the owner creates it (published, not a draft) before the first host-stream publish" >&2; exit 1; }
          test "$state" = false || { echo "::error::the rolling pointer release $ROLLING_TAG is a draft; installers cannot download from it" >&2; exit 1; }
      # Refuses before anything is public: an empty pointer without the
      # bootstrap input, a rolling manifest that does not verify, or the same
      # version with other bytes. An older tag (a desktop rollback) is not an
      # error: the host pointer is left alone.
      - id: host_pointer
        name: Plan the rolling host-stream pointer
        if: ${{ vars.STATION_PORTABLE_RELEASE_PUBLISH == 'enabled' }}
        env:
          ROLLING_MANIFEST_URL: ${{ steps.host_plan.outputs.rolling_manifest_url }}
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
          ALLOW_EMPTY_HOST_MANIFEST_BOOTSTRAP: ${{ inputs.allow_empty_host_manifest_bootstrap }}
        run: |
          set -euo pipefail
          plan=$(node release-policy/scripts/portable-release-publication.mjs pointer-plan --ring "$RELEASE_RING" --candidate-version "$RELEASE_VERSION" --current "$ROLLING_MANIFEST_URL" --signed "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET" --allow-empty-bootstrap "$ALLOW_EMPTY_HOST_MANIFEST_BOOTSTRAP")
          echo "$plan" >> "$GITHUB_OUTPUT"
          if [ "$plan" = action=skip-older ]; then
            message="$RELEASE_TAG is older than the rolling $RELEASE_RING host-stream manifest; the host pointer never moves backwards, so it stays where it is"
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Attach the signed host-stream manifest to the versioned release
        if: ${{ vars.STATION_PORTABLE_RELEASE_PUBLISH == 'enabled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
        run: |
          set -euo pipefail
          # A rerun finds the manifest an earlier attempt attached (the
          # revalidation above verified it). Ed25519 signing is deterministic,
          # so the same payload and key give the same bytes; anything else is
          # refused rather than replaced.
          if [ -e "release-assets/$MANIFEST_ASSET" ]; then
            cmp "release-assets/$MANIFEST_ASSET" "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET" || { echo "::error::$RELEASE_TAG already carries a different $MANIFEST_ASSET; inspect it before re-running" >&2; exit 1; }
          else
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET"
          fi
      - name: Assemble and validate the rolling desktop updater channel
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CURRENT_UPDATER_MANIFEST: ${{ needs.resolve.outputs.has_current_updater_manifest }}
          ALLOW_UPDATER_POINTER_REGRESSION: ${{ inputs.allow_updater_pointer_regression }}
        run: |
          set -euo pipefail
          policy_script=release-policy/scripts/lib/tauri-updater-manifest.mjs
          updater_assets=(
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip.sig"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz.sig"
          )
          for asset in "${updater_assets[@]}"; do
            test -s "release-assets/$asset"
          done

          mkdir -p updater-channel-assets
          node "$policy_script" \
            --version "$RELEASE_VERSION" \
            --pub-date "$RELEASE_CREATED_AT" \
            --platform darwin-aarch64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-macos-aarch64.app.tar.gz" \
            --signature-file "release-assets/station-${RELEASE_TAG}-macos-aarch64.app.tar.gz.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-macos-aarch64.app.tar.gz" \
            --platform darwin-x86_64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-macos-x86_64.app.tar.gz" \
            --signature-file "release-assets/station-${RELEASE_TAG}-macos-x86_64.app.tar.gz.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-macos-x86_64.app.tar.gz" \
            --platform windows-x86_64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-windows-x86_64.msi.zip" \
            --signature-file "release-assets/station-${RELEASE_TAG}-windows-x86_64.msi.zip.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-windows-x86_64.msi.zip" \
            --platform linux-x86_64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz" \
            --signature-file "release-assets/station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz" \
            --release-tag "$DESKTOP_UPDATER_TAG" \
            --notes "Station ${DESKTOP_UPDATER_TAG} build ${RELEASE_VERSION} (${RELEASE_SHA})" \
            --output updater-channel-assets/latest.json
          test -s updater-channel-assets/latest.json

          # This verifies URL identity, platform/asset/signature binding, and
          # every local archive before any rolling-release asset is changed.
          node "$policy_script" --verify \
            --manifest updater-channel-assets/latest.json \
            --assets-dir release-assets \
            --release-tag "$DESKTOP_UPDATER_TAG"

          if [[ "$HAS_CURRENT_UPDATER_MANIFEST" == true ]]; then
            mkdir -p updater-channel-current
            gh release download "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --dir updater-channel-current --pattern latest.json
            pointer_guard=(
              node "$policy_script"
              --assert-not-regressing
              --candidate-manifest updater-channel-assets/latest.json
              --current-manifest updater-channel-current/latest.json
            )
            if [[ "$ALLOW_UPDATER_POINTER_REGRESSION" == true ]]; then
              pointer_guard+=(--allow-regression)
            fi
            "${pointer_guard[@]}"
          else
            echo "Initializing explicitly authorized empty rolling release $DESKTOP_UPDATER_TAG"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ needs.resolve.outputs.pointer_repair_only != 'true' }}
      - name: Authenticate to GHCR with the ephemeral workflow token
        if: ${{ needs.resolve.outputs.pointer_repair_only != 'true' }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote only the recorded immutable GHCR digest
        if: ${{ needs.resolve.outputs.pointer_repair_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          descriptor=release-assets/station-container-release.json
          image=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).image)' "$descriptor")
          digest=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).digest)' "$descriptor")
          staging="$image:sha-$RELEASE_SHA"
          resolved=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
          test "$resolved" = "$digest"
          node -e 'for (const tag of JSON.parse(require("node:fs").readFileSync(process.argv[1])).tags) console.log(tag)' "$descriptor" |
            while read -r tag; do
              docker buildx imagetools create --tag "$image:$tag" "$image@$digest"
            done

      - name: Publish release and compensate to draft until feed verifies
        if: ${{ needs.resolve.outputs.pointer_repair_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_APP_UPDATE_PUBLISH_TOKEN: ${{ secrets.NATIVE_APP_UPDATE_PUBLISH_TOKEN }}
        run: |
          feed_args=()
          if [ -n "$VITE_NATIVE_APP_UPDATE_FEED_URL" ]; then
            feed_args+=("release-assets/station-mobile-${VITE_NATIVE_APP_UPDATE_CHANNEL}.json")
          fi
          release-policy/scripts/publish-mobile-feed-transaction.sh "${feed_args[@]}"

      # The tag-bound release is public before this pointer advances. Updater
      # archives are uploaded first and latest.json is a separate invocation,
      # matching nightly's ordering so the manifest never advertises an asset
      # that this run has not finished uploading.
      - name: Publish and verify the rolling desktop updater channel
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CURRENT_UPDATER_MANIFEST: ${{ needs.resolve.outputs.has_current_updater_manifest }}
        run: |
          set -euo pipefail
          policy_script=release-policy/scripts/lib/tauri-updater-manifest.mjs
          updater_assets=(
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip.sig"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz.sig"
          )
          updater_args=()
          for asset in "${updater_assets[@]}"; do
            test -s "release-assets/$asset"
            updater_args+=("release-assets/$asset")
          done

          pointer_mutation_started=false
          compensate_pointer() {
            status=$?
            if [[ "$pointer_mutation_started" == true ]]; then
              echo "::warning::Rolling pointer verification failed; restoring the prior channel state." >&2
              if [[ "$HAS_CURRENT_UPDATER_MANIFEST" == true ]]; then
                gh release upload "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --clobber updater-channel-current/latest.json || \
                  echo "::error::Could not restore the prior latest.json; repair $DESKTOP_UPDATER_TAG immediately." >&2
              else
                gh release delete-asset "$DESKTOP_UPDATER_TAG" latest.json --repo "$GITHUB_REPOSITORY" --yes || \
                  echo "::error::Could not remove the failed bootstrap latest.json; repair $DESKTOP_UPDATER_TAG immediately." >&2
              fi
            fi
            exit "$status"
          }
          trap compensate_pointer ERR

          gh release upload "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${updater_args[@]}"
          pointer_mutation_started=true
          gh release upload "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --clobber updater-channel-assets/latest.json
          remote_assets=$(mktemp -d)
          trap 'rm -rf "$remote_assets"' EXIT
          for asset in "${updater_assets[@]}" latest.json; do
            gh release download "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_assets" --pattern "$asset"
          done
          for asset in "${updater_assets[@]}"; do
            cmp "release-assets/$asset" "$remote_assets/$asset"
          done
          cmp updater-channel-assets/latest.json "$remote_assets/latest.json"
          node "$policy_script" --verify \
            --manifest "$remote_assets/latest.json" \
            --assets-dir "$remote_assets" \
            --release-tag "$DESKTOP_UPDATER_TAG"
          trap - ERR
          gh release edit "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Rolling desktop updater channel. Latest: ${RELEASE_VERSION} at ${RELEASE_SHA}, published $(date -u +%Y-%m-%dT%H:%M:%SZ)."

      # The release is public (published above, or already public for a
      # pointer repair) and its desktop pointer verified. host-pointer keys
      # on this output, not on the job result, so a later failure such as the
      # ledger's does not hold the host pointer back.
      - id: released
        name: Record that the release is public
        run: echo 'released=true' >> "$GITHUB_OUTPUT"

      # Deploy ledger (station#4572). Deliberately HERE, not in release.yml:
      # release.yml assembles a DRAFT; this job is the moment a stable
      # release actually ships (release published, GHCR tags promoted, mobile
      # feed verified). Recording in release.yml would assert a deploy that
      # may never be published. Publish-first-then-ledger: this step runs
      # after the publish steps above and its failure reddens the job
      # without un-shipping anything — visible, never blocking.
      # The sha is RELEASE_SHA = needs.resolve.outputs.sha (pinned by
      # scripts/__tests__/deploy-ledger-workflow-pins.test.ts): the exact
      # commit every producer job built and every attestation names — never
      # github.sha, which here is the tag's commit but is NOT the resolved,
      # revalidated source of this release.
      # --require-ancestor refuses before any commit or push when RELEASE_SHA
      # is not an ancestor of origin/main: without it, the commit-back's
      # rebase would replay EVERY commit in origin/main..HEAD — the whole
      # off-main history of a tag cut off main — onto main as a ledger side
      # effect. A ledger commit may carry ledger files only.
      # The bounded re-derive-and-retry commit-back lives in
      # scripts/lib/deploy-ledger-commit.mjs (unit-tested; shell in YAML
      # cannot be). nullglob + the empty check below exist because an empty
      # release-assets/ download would otherwise record a literal
      # 'release-asset:release-assets/*' artifact string.
      # Ledger commits push directly to main, which the require-green ruleset
      # blocks for GITHUB_TOKEN; the release app is a ruleset bypass actor.
      - name: Mint the ledger push token
        if: ${{ needs.resolve.outputs.pointer_repair_only != 'true' }}
        id: ledger_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Record the stable release in the deploy ledger
        if: ${{ needs.resolve.outputs.pointer_repair_only != 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.ledger_token.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$GITHUB_TOKEN" ] || { echo "::error::ledger token mint failed; the record cannot push"; exit 1; }
          version="${RELEASE_TAG#v}"
          # The ledger lives on main, so the record and commit-back run in the
          # default-branch checkout. The helper spawns the record with that
          # checkout as its cwd, hence the absolute path. The helper detaches
          # onto the CURRENT origin/main before spawning, so the record runs
          # main's newest appender, possibly newer than policy_sha. That is
          # deliberate: the commit must be a fast-forward of main's current
          # ledger, and the appender that understands that ledger is main's.
          record=(node "$PWD/release-policy/scripts/deploy-ledger.mjs"
            --channel stable-desktop
            --version "$version"
            --sha "$RELEASE_SHA"
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            --gate-result "release.yml producer gates and publish-release revalidation/attestations success on $RELEASE_SHA"
            --github-repo "$GITHUB_REPOSITORY"
            --artifact-manifest "$RUNNER_TEMP/station-desktop-common-client-build.json"
            --artifact "github-release:$RELEASE_TAG (desktop installers, portable archive, SBOMs)")
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::release-assets/ is empty; refusing to record a literal glob as a release artifact"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            record+=(--artifact "release-asset:$(basename "$asset")")
          done
          node release-policy/scripts/lib/deploy-ledger-commit.mjs \
            --repo-root release-policy \
            --commit-subject "docs(ledger): record stable-desktop $version from run $GITHUB_RUN_ID" \
            --summary-line "- recorded: \`stable-desktop $version\` at \`$RELEASE_SHA\`" \
            --require-ancestor "$RELEASE_SHA" \
            -- "${record[@]}"

      # Storage/quota failure is an infrastructure condition, not a verdict
      # on the record (station#2218); the commit inside the record step
      # above is authoritative. Runs on failure too, so a push that never
      # succeeded still leaves the recorded ledger files in an artifact.
      - name: Retain this run's deploy ledger files
        if: ${{ always() && needs.resolve.outputs.pointer_repair_only != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-ledger-stable-${{ github.run_id }}
          path: |
            release-policy/docs/reference/deploy-ledger.json
            release-policy/docs/reference/deploy-ledger.md
          if-no-files-found: error
          retention-days: 14

  # #2959: the rolling host-stream pointer. Its own job, after publish, so a
  # host-pointer failure never skips publish's deploy ledger or
  # release-availability, and "Re-run failed jobs" retries it alone. It runs
  # once publish reports the release public (`released`), even if a later
  # publish step failed, unless the run was cancelled. The fetched payload
  # must name this run's version, tag and source SHA. It holds no secret: it takes the signed manifest
  # and its payload from the public versioned release and verifies them with
  # the pinned key table before any pointer write. It replaces the pointer
  # last, and only when the plan says the candidate is newer (or an explicit
  # empty-pointer bootstrap). A rerun whose pointer already serves these
  # exact bytes only re-verifies; an older tag leaves the pointer alone. A
  # failed replacement or re-verification restores the previous manifest (or
  # removes a bootstrap one), as the desktop pointer does.
  host-pointer:
    name: Replace the rolling host-stream pointer
    needs: [resolve, publish]
    if: ${{ !cancelled() && vars.STATION_PORTABLE_RELEASE_PUBLISH == 'enabled' && needs.resolve.result == 'success' && needs.publish.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: native-release-publish
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_RING: ${{ needs.resolve.outputs.channel }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out default-branch release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          path: release-policy
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: release-policy/.nvmrc
          package-manager-cache: false
      - id: host_plan
        name: Name the host-stream release locations
        run: node release-policy/scripts/portable-release-publication.mjs locations --ring "$RELEASE_RING" --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Fetch the signed host-stream manifest and payload from the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/host-manifest"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/host-manifest" --pattern "$MANIFEST_ASSET" --pattern station-server-manifest-payload.json
      - name: Confirm the fetched payload is this run's release
        run: node release-policy/scripts/portable-release-publication.mjs check-payload --ring "$RELEASE_RING" --payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json" --version "$RELEASE_VERSION" --source-sha "$RELEASE_SHA" --repository "$GITHUB_REPOSITORY"
      - name: Verify the fetched host-stream manifest with the pinned key table
        env:
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
        run: node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET" --expected-payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json"
      - name: Re-download the versioned host-stream assets and compare them with the manifest
        env:
          VERSIONED_MANIFEST_URL: ${{ steps.host_plan.outputs.versioned_manifest_url }}
        run: |
          set -euo pipefail
          node release-policy/scripts/portable-release-publication.mjs verify-assets --payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json"
          node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$VERSIONED_MANIFEST_URL" --expected-payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json"
      - id: host_pointer
        name: Plan the rolling host-stream pointer
        env:
          ROLLING_MANIFEST_URL: ${{ steps.host_plan.outputs.rolling_manifest_url }}
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
          ALLOW_EMPTY_HOST_MANIFEST_BOOTSTRAP: ${{ inputs.allow_empty_host_manifest_bootstrap }}
        run: |
          set -euo pipefail
          plan=$(node release-policy/scripts/portable-release-publication.mjs pointer-plan --ring "$RELEASE_RING" --candidate-version "$RELEASE_VERSION" --current "$ROLLING_MANIFEST_URL" --signed "$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET" --allow-empty-bootstrap "$ALLOW_EMPTY_HOST_MANIFEST_BOOTSTRAP")
          echo "$plan" >> "$GITHUB_OUTPUT"
          if [ "$plan" = action=skip-older ]; then
            message="$RELEASE_TAG is older than the rolling $RELEASE_RING host-stream manifest; the host pointer never moves backwards, so it stays where it is"
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Replace the rolling host-stream manifest (last) and re-verify it
        if: ${{ steps.host_pointer.outputs.action == 'replace' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: ${{ steps.host_plan.outputs.rolling_tag }}
          MANIFEST_ASSET: ${{ steps.host_plan.outputs.manifest_asset }}
          ROLLING_MANIFEST_URL: ${{ steps.host_plan.outputs.rolling_manifest_url }}
          ALLOW_EMPTY_HOST_MANIFEST_BOOTSTRAP: ${{ inputs.allow_empty_host_manifest_bootstrap }}
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/host-manifest/$MANIFEST_ASSET"
          prior="$RUNNER_TEMP/host-pointer-prior"
          mkdir -p "$prior"
          # Save the manifest the pointer serves now: the restore point.
          assets=$(gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          had_prior=false
          if grep -qxF "$MANIFEST_ASSET" <<< "$assets"; then
            gh release download "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --dir "$prior" --pattern "$MANIFEST_ASSET"
            test -s "$prior/$MANIFEST_ASSET"
            had_prior=true
          fi
          # The plan read the cacheable download URL, which can serve an older
          # manifest than the release holds. Re-plan against the bytes just
          # downloaded from the release itself, with the same not-regressing
          # logic, and clobber only if that still says replace.
          replan=$(node release-policy/scripts/portable-release-publication.mjs pointer-plan --ring "$RELEASE_RING" --candidate-version "$RELEASE_VERSION" --current "$prior/$MANIFEST_ASSET" --signed "$signed" --allow-empty-bootstrap "$ALLOW_EMPTY_HOST_MANIFEST_BOOTSTRAP")
          if [ "$replan" = action=skip-older ]; then
            message="$RELEASE_TAG is older than the manifest $ROLLING_TAG holds now (the plan read a stale copy); the host pointer never moves backwards, so it stays where it is"
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$replan" = action=unchanged ]; then
            echo "$ROLLING_TAG already holds this run's manifest; re-verifying without replacing it"
            node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$ROLLING_MANIFEST_URL" --expected-payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json"
            exit 0
          fi
          [ "$replan" = action=replace ] || { echo "::error::unexpected pointer re-plan: $replan" >&2; exit 1; }
          mutation_started=false
          compensate_pointer() {
            status=$?
            trap - ERR
            if [ "$mutation_started" = true ]; then
              echo "::warning::the rolling host-stream manifest did not verify; restoring $ROLLING_TAG to its previous state" >&2
              if [ "$had_prior" = true ]; then
                gh release upload "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$prior/$MANIFEST_ASSET" || \
                  echo "::error::could not restore the previous $MANIFEST_ASSET; repair $ROLLING_TAG immediately" >&2
              elif grep -qxF "$MANIFEST_ASSET" <<< "$(gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || echo "$MANIFEST_ASSET")"; then
                gh release delete-asset "$ROLLING_TAG" "$MANIFEST_ASSET" --repo "$GITHUB_REPOSITORY" --yes || \
                  echo "::error::could not remove the failed bootstrap $MANIFEST_ASSET; repair $ROLLING_TAG immediately" >&2
              else
                echo "The failed bootstrap upload left no $MANIFEST_ASSET on $ROLLING_TAG; nothing to remove." >&2
              fi
            fi
            exit "$status"
          }
          trap compensate_pointer ERR
          mutation_started=true
          gh release upload "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$signed"
          node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$ROLLING_MANIFEST_URL" --expected-payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json"
          trap - ERR
      - name: Re-verify the unchanged rolling host-stream manifest with the pinned key
        if: ${{ steps.host_pointer.outputs.action == 'unchanged' }}
        env:
          ROLLING_MANIFEST_URL: ${{ steps.host_plan.outputs.rolling_manifest_url }}
        run: node release-policy/scripts/portable-release-publication.mjs verify --ring "$RELEASE_RING" --manifest "$ROLLING_MANIFEST_URL" --expected-payload "$RUNNER_TEMP/host-manifest/station-server-manifest-payload.json"

  release-availability:
    needs: [resolve, publish]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.publish.result == 'success' &&
        needs.resolve.outputs.pointer_repair_only != 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      attestations: read
    env:
      RELEASE_PUBLISH_SUCCEEDED: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 257
          persist-credentials: false
      - name: Check out default-branch release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          path: release-policy
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: npm run dependencies:ci
      - name: Validate public release inventory and GitHub attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node release-policy/scripts/release-availability-driver.mjs
      - name: Project verified release availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release-policy/scripts/release-availability-driver.mjs --project
