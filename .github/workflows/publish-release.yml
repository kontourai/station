name: Publish Station release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to revalidate and publish
        required: true
        type: string
      allow_updater_pointer_regression:
        description: Break glass only - permit an older rolling desktop pointer after owner review
        required: false
        default: false
        type: boolean

concurrency:
  group: station-release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      created_at: ${{ steps.source.outputs.created_at }}
      version: ${{ steps.source.outputs.version }}
      channel: ${{ steps.source.outputs.channel }}
      desktop_updater_tag: ${{ steps.source.outputs.desktop_updater_tag }}
      has_current_updater_manifest: ${{ steps.source.outputs.has_current_updater_manifest }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm run dependencies:ci
      - name: Resolve draft tag to one immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.([1-9][0-9]*))?$ ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha=$(git rev-list -n 1 "$RELEASE_TAG")
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
          desktop_updater_tag=$(node scripts/lib/native-release-config.mjs --tag "$RELEASE_TAG" --print-desktop-updater-tag)
          if ! updater_release=$(gh release view "$desktop_updater_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets); then
            echo "::error::Could not query rolling release $desktop_updater_tag; see the GitHub CLI diagnostic above. Bootstrap it if it does not exist, otherwise retry after API recovery." >&2
            exit 1
          fi
          updater_release_state=$(UPDATER_RELEASE="$updater_release" node -p 'JSON.parse(process.env.UPDATER_RELEASE).isDraft')
          if [[ "$updater_release_state" == true ]]; then
            echo "::error::$desktop_updater_tag is a draft release; its download URLs are unavailable to installed apps." >&2
            exit 1
          fi
          if [[ "$updater_release_state" != false ]]; then
            echo "::error::Could not verify $desktop_updater_tag is public; refusing to publish this channel." >&2
            exit 1
          fi
          has_current_updater_manifest=$(UPDATER_RELEASE="$updater_release" node -p 'JSON.parse(process.env.UPDATER_RELEASE).assets.some(({name}) => name === "latest.json")')
          created_at=$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' "$(git show -s --format=%ct "$sha")")
          {
            echo "sha=$sha"
            echo "created_at=$created_at"
            echo "version=${RELEASE_TAG#v}"
            echo "channel=$([[ "$RELEASE_TAG" == *-preview.* ]] && echo preview || echo stable)"
            echo "desktop_updater_tag=$desktop_updater_tag"
            echo "has_current_updater_manifest=$has_current_updater_manifest"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    environment: native-release-publish
    permissions:
      contents: write
      packages: write
      attestations: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_CREATED_AT: ${{ needs.resolve.outputs.created_at }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      DESKTOP_UPDATER_TAG: ${{ needs.resolve.outputs.desktop_updater_tag }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      VITE_NATIVE_APP_UPDATE_FEED_URL: ${{ vars.NATIVE_APP_UPDATE_FEED_URL }}
      VITE_NATIVE_APP_UPDATE_PROVIDER_ORIGIN: ${{ vars.NATIVE_APP_UPDATE_PROVIDER_ORIGIN }}
      VITE_NATIVE_APP_UPDATE_CHANNEL: ${{ vars.NATIVE_APP_UPDATE_CHANNEL }}
      VITE_NATIVE_APP_VERSION: ${{ needs.resolve.outputs.version }}
      NATIVE_APP_UPDATE_ACTION_URL: ${{ vars.NATIVE_APP_UPDATE_ACTION_URL }}
      NATIVE_APP_UPDATE_ACTION_KIND: ${{ vars.NATIVE_APP_UPDATE_ACTION_KIND }}
      NATIVE_APP_UPDATE_ACTION_ORIGINS: ${{ vars.NATIVE_APP_UPDATE_ACTION_ORIGINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm run dependencies:ci
      - name: Download and revalidate every staged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*'
          node scripts/release-artifacts.mjs validate --assets-dir release-assets --inventory release-assets/station-release-inventory.json --container-descriptor release-assets/station-container-release.json --updater-public-key release-assets/station-updater-public-key.txt
          node scripts/release-sbom-predicates.mjs --assets-dir release-assets
          test "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("release-assets/station-release-inventory.json")).sourceSha)' )" = "$RELEASE_SHA"
          test "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("release-assets/station-container-release.json")).createdAt)' )" = "$RELEASE_CREATED_AT"
          scripts/verify-release-checksums.sh release-assets
      - name: Verify GitHub provenance for every downloaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release\\.yml@refs/tags/${RELEASE_TAG}$"
          for asset in release-assets/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_SHA" \
              --cert-identity-regex "$identity" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --deny-self-hosted-runners
          done
      - name: Assemble and validate the rolling desktop updater channel
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CURRENT_UPDATER_MANIFEST: ${{ needs.resolve.outputs.has_current_updater_manifest }}
          ALLOW_UPDATER_POINTER_REGRESSION: ${{ inputs.allow_updater_pointer_regression }}
        run: |
          set -euo pipefail
          updater_assets=(
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip.sig"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz.sig"
          )
          for asset in "${updater_assets[@]}"; do
            test -s "release-assets/$asset"
          done

          mkdir -p updater-channel-assets
          node scripts/lib/tauri-updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --pub-date "$RELEASE_CREATED_AT" \
            --platform darwin-aarch64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-macos-aarch64.app.tar.gz" \
            --signature-file "release-assets/station-${RELEASE_TAG}-macos-aarch64.app.tar.gz.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-macos-aarch64.app.tar.gz" \
            --platform darwin-x86_64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-macos-x86_64.app.tar.gz" \
            --signature-file "release-assets/station-${RELEASE_TAG}-macos-x86_64.app.tar.gz.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-macos-x86_64.app.tar.gz" \
            --platform windows-x86_64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-windows-x86_64.msi.zip" \
            --signature-file "release-assets/station-${RELEASE_TAG}-windows-x86_64.msi.zip.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-windows-x86_64.msi.zip" \
            --platform linux-x86_64 \
            --asset-file "release-assets/station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz" \
            --signature-file "release-assets/station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz.sig" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${DESKTOP_UPDATER_TAG}/station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz" \
            --release-tag "$DESKTOP_UPDATER_TAG" \
            --notes "Station ${DESKTOP_UPDATER_TAG} build ${RELEASE_VERSION} (${RELEASE_SHA})" \
            --output updater-channel-assets/latest.json
          test -s updater-channel-assets/latest.json

          if [[ "$HAS_CURRENT_UPDATER_MANIFEST" == true ]]; then
            mkdir -p updater-channel-current
            gh release download "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --dir updater-channel-current --pattern latest.json
            pointer_guard=(
              node scripts/lib/tauri-updater-manifest.mjs
              --assert-not-regressing
              --candidate-manifest updater-channel-assets/latest.json
              --current-manifest updater-channel-current/latest.json
            )
            if [[ "$ALLOW_UPDATER_POINTER_REGRESSION" == true ]]; then
              pointer_guard+=(--allow-regression)
            fi
            "${pointer_guard[@]}"
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to GHCR with the ephemeral workflow token
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote only the recorded immutable GHCR digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          descriptor=release-assets/station-container-release.json
          image=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).image)' "$descriptor")
          digest=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1])).digest)' "$descriptor")
          staging="$image:sha-$RELEASE_SHA"
          resolved=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
          test "$resolved" = "$digest"
          node -e 'for (const tag of JSON.parse(require("node:fs").readFileSync(process.argv[1])).tags) console.log(tag)' "$descriptor" |
            while read -r tag; do
              docker buildx imagetools create --tag "$image:$tag" "$image@$digest"
            done

      - name: Publish release and compensate to draft until feed verifies
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_APP_UPDATE_PUBLISH_TOKEN: ${{ secrets.NATIVE_APP_UPDATE_PUBLISH_TOKEN }}
        run: |
          test -n "$NATIVE_APP_UPDATE_PUBLISH_TOKEN" || { echo "Missing native update provider credential" >&2; exit 1; }
          feed="release-assets/station-mobile-${VITE_NATIVE_APP_UPDATE_CHANNEL}.json"
          scripts/publish-mobile-feed-transaction.sh "$feed"

      # The tag-bound release is public before this pointer advances. Updater
      # archives are uploaded first and latest.json is a separate invocation,
      # matching nightly's ordering so the manifest never advertises an asset
      # that this run has not finished uploading.
      - name: Publish and verify the rolling desktop updater channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          updater_assets=(
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-aarch64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz"
            "station-${RELEASE_TAG}-macos-x86_64.app.tar.gz.sig"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip"
            "station-${RELEASE_TAG}-windows-x86_64.msi.zip.sig"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz"
            "station-${RELEASE_TAG}-linux-x86_64.AppImage.tar.gz.sig"
          )
          updater_args=()
          for asset in "${updater_assets[@]}"; do
            test -s "release-assets/$asset"
            updater_args+=("release-assets/$asset")
          done

          gh release upload "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${updater_args[@]}"
          gh release upload "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --clobber updater-channel-assets/latest.json
          gh release edit "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Rolling desktop updater channel. Latest: ${RELEASE_VERSION} at ${RELEASE_SHA}, published $(date -u +%Y-%m-%dT%H:%M:%SZ)."

          remote_assets=$(mktemp -d)
          trap 'rm -rf "$remote_assets"' EXIT
          for asset in "${updater_assets[@]}" latest.json; do
            gh release download "$DESKTOP_UPDATER_TAG" --repo "$GITHUB_REPOSITORY" --dir "$remote_assets" --pattern "$asset"
          done
          for asset in "${updater_assets[@]}"; do
            cmp "release-assets/$asset" "$remote_assets/$asset"
          done
          cmp updater-channel-assets/latest.json "$remote_assets/latest.json"
          node scripts/lib/tauri-updater-manifest.mjs --verify \
            --manifest "$remote_assets/latest.json" \
            --assets-dir "$remote_assets" \
            --release-tag "$DESKTOP_UPDATER_TAG"

      # Deploy ledger (station#4572). Deliberately HERE, not in release.yml:
      # release.yml assembles a DRAFT; this job is the moment a stable
      # release actually ships (release published, GHCR tags promoted, mobile
      # feed verified). Recording in release.yml would assert a deploy that
      # may never be published. Publish-first-then-ledger: this step runs
      # after the publish steps above and its failure reddens the job
      # without un-shipping anything — visible, never blocking.
      # The sha is RELEASE_SHA = needs.resolve.outputs.sha (pinned by
      # scripts/__tests__/deploy-ledger-workflow-pins.test.ts): the exact
      # commit every producer job built and every attestation names — never
      # github.sha, which here is the tag's commit but is NOT the resolved,
      # revalidated source of this release.
      # --require-ancestor refuses before any commit or push when RELEASE_SHA
      # is not an ancestor of origin/main: without it, the commit-back's
      # rebase would replay EVERY commit in origin/main..HEAD — the whole
      # off-main history of a tag cut off main — onto main as a ledger side
      # effect. A ledger commit may carry ledger files only.
      # The bounded re-derive-and-retry commit-back lives in
      # scripts/lib/deploy-ledger-commit.mjs (unit-tested; shell in YAML
      # cannot be). nullglob + the empty check below exist because an empty
      # release-assets/ download would otherwise record a literal
      # 'release-asset:release-assets/*' artifact string.
      # Ledger commits push directly to main, which the require-green ruleset
      # blocks for GITHUB_TOKEN; the release app is a ruleset bypass actor.
      - name: Mint the ledger push token
        id: ledger_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Record the stable release in the deploy ledger
        env:
          GITHUB_TOKEN: ${{ steps.ledger_token.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$GITHUB_TOKEN" ] || { echo "::error::ledger token mint failed; the record cannot push"; exit 1; }
          version="${RELEASE_TAG#v}"
          record=(node scripts/deploy-ledger.mjs
            --channel stable-desktop
            --version "$version"
            --sha "$RELEASE_SHA"
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            --gate-result "release.yml producer gates and publish-release revalidation/attestations success on $RELEASE_SHA"
            --github-repo "$GITHUB_REPOSITORY"
            --artifact "github-release:$RELEASE_TAG (desktop installers, portable archive, SBOMs)")
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::release-assets/ is empty; refusing to record a literal glob as a release artifact"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            record+=(--artifact "release-asset:$(basename "$asset")")
          done
          node scripts/lib/deploy-ledger-commit.mjs \
            --commit-subject "docs(ledger): record stable-desktop $version from run $GITHUB_RUN_ID" \
            --summary-line "- recorded: \`stable-desktop $version\` at \`$RELEASE_SHA\`" \
            --require-ancestor "$RELEASE_SHA" \
            -- "${record[@]}"

      # Storage/quota failure is an infrastructure condition, not a verdict
      # on the record (station#2218); the commit inside the record step
      # above is authoritative. Runs on failure too, so a push that never
      # succeeded still leaves the recorded ledger files in an artifact.
      - name: Retain this run's deploy ledger files
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-ledger-stable-${{ github.run_id }}
          path: |
            docs/reference/deploy-ledger.json
            docs/reference/deploy-ledger.md
          if-no-files-found: error
          retention-days: 14

  release-availability:
    needs: [resolve, publish]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      attestations: read
    env:
      RELEASE_PUBLISH_SUCCEEDED: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 257
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm run dependencies:ci
      - name: Validate public release inventory and GitHub attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node scripts/release-availability-driver.mjs
      - name: Project verified release availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-availability-driver.mjs --project
