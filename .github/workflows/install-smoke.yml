name: Portable Install Smoke

on:
  pull_request_target:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'packages/shared/src/installer/**'
      # Bundled into install.ps1's installer core (#2675 W2).
      - 'packages/shared/src/windows-path-trust.ts'
      - 'packages/shared/src/windows-system-utility.mjs'
      # Which installer packaged `station upgrade` runs.
      - 'packages/shared/src/prebuilt-archive.ts'
      - 'scripts/smoke-install-ps1.mjs'
      - 'scripts/install-script-generated.mjs'
      - '.gitattributes'
      - 'scripts/package-portable-release.sh'
      - 'scripts/build-portable-server-archive.mjs'
      - 'scripts/lib/bounded-capture.mjs'
      - 'scripts/lib/portable-server-archive.mjs'
      - 'scripts/smoke-install-prebuilt-archive.sh'
      - 'packaging/portable-server/**'
      - 'config/portable-server-node-runtime.json'
      - 'config/release-manifest-keys.json'
      - 'scripts/ecosystem-manifest.mjs'
      - 'packages/shared/src/portable-server-targets.mjs'
      - 'packages/shared/src/release-manifest.mjs'
      # The CLI the archive bundles and packaged `station upgrade` runs.
      - 'packages/cli/src/**'
      - 'scripts/station-cli.ts'
      - '.github/workflows/install-smoke.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-without-clone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # These legs install the SOURCE release (station-portable.tar.gz,
        # schema 1 manifest), built on the host. The prebuilt per-platform
        # archive path, which nightly uses, is install-prebuilt-archive below.
        channel: [stable, preview]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ matrix.channel == 'preview' && 'v0.0.0-preview.1' || 'v0.0.0' }}
      RELEASE_CHANNEL: ${{ matrix.channel }}
      RUNTIME_CHANNEL: ${{ matrix.channel == 'preview' && 'beta' || 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Package portable release
        run: |
          scripts/package-portable-release.sh \
            --output-dir "$RUNNER_TEMP/release" \
            --ref "$RELEASE_TAG"

      - name: Install, diagnose, and serve without a clone
        env:
          SMOKE_HOME: ${{ runner.temp }}/station-home
          RELEASE_DIR: ${{ runner.temp }}/release
          # The sha the checkout and packager actually used; GITHUB_SHA is the
          # base tip under pull_request_target.
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          runtime_channel="$RUNTIME_CHANNEL"
          release_channel="$RELEASE_CHANNEL"
          launcher_name=station
          if [ "$runtime_channel" = beta ]; then launcher_name=station-beta; fi
          launcher="$SMOKE_HOME/.local/bin/$launcher_name"
          # Mirror install.sh's default roots for HOME=$SMOKE_HOME without
          # overrides: $station_root/installs|instances/$runtime_channel.
          station_root="$SMOKE_HOME/.station"
          install_root="$station_root/installs/$runtime_channel"
          station_home="$station_root/instances/$runtime_channel"
          mkdir -p "$SMOKE_HOME/fake-bin"
          cat >"$SMOKE_HOME/fake-bin/codex" <<'EOF'
          #!/bin/sh
          echo 'codex-cli 1.0.0-smoke'
          EOF
          cat >"$SMOKE_HOME/fake-bin/claude" <<'EOF'
          #!/bin/sh
          echo 'claude 1.0.0-smoke'
          EOF
          cat >"$SMOKE_HOME/fake-bin/kiro-cli" <<'EOF'
          #!/bin/sh
          echo 'kiro-cli 1.0.0-smoke'
          EOF
          cat >"$SMOKE_HOME/fake-bin/rustc" <<'EOF'
          #!/bin/sh
          echo 'rustc 1.90.0-smoke'
          EOF
          # The public manifest path must stay unauthenticated; a reachable gh
          # here would hide a regression back onto the authenticated path.
          cat >"$SMOKE_HOME/fake-bin/gh" <<'EOF'
          #!/bin/sh
          echo 'gh must not run in the public installer path' >&2
          exit 99
          EOF
          chmod +x "$SMOKE_HOME/fake-bin/"*

          # install.sh's public manifest path requires three distinct fixture
          # origins: artifacts, the signed manifest, and its verification key.
          serve_dir="$RUNNER_TEMP/fixture-serve"
          manifests_dir="$RUNNER_TEMP/fixture-manifests"
          keys_dir="$RUNNER_TEMP/fixture-keys"
          mkdir -p "$serve_dir" "$manifests_dir" "$keys_dir"
          cp "$RELEASE_DIR/station-portable.tar.gz" "$serve_dir/"
          provenance="$(tar -xOzf "$serve_dir/station-portable.tar.gz" station/.station-release.json)"
          source_sha="$(printf '%s' "$provenance" | jq -r .sha)"
          release_tag="$(printf '%s' "$provenance" | jq -r .ref)"
          version="${release_tag#v}"
          printf 'install-smoke macOS cask fixture\n' >"$serve_dir/station-$version-macos-universal.dmg"
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const fs = require("node:fs");
            const [privatePath, publicPath] = process.argv.slice(1);
            const { privateKey, publicKey } = generateKeyPairSync("ed25519");
            fs.writeFileSync(privatePath, privateKey.export({ format: "pem", type: "pkcs8" }));
            fs.writeFileSync(publicPath, publicKey.export({ format: "pem", type: "spki" }));
          ' "$RUNNER_TEMP/manifest-private.pem" "$keys_dir/public.pem"

          write_manifest_payload() {
            node -e '
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              const [output, serveDir, channel, version, releaseTag, sourceSha] = process.argv.slice(1);
              const digest = (name) => crypto.createHash("sha256").update(fs.readFileSync(`${serveDir}/${name}`)).digest("hex");
              const macos = `station-${version}-macos-universal.dmg`;
              fs.writeFileSync(output, `${JSON.stringify({
                schemaVersion: 1,
                channel,
                version,
                releaseTag,
                sourceSha,
                publishedAt: new Date().toISOString(),
                artifacts: {
                  macos: { name: macos, url: `http://127.0.0.1:8765/${macos}`, sha256: digest(macos) },
                  portable: { name: "station-portable.tar.gz", url: "http://127.0.0.1:8765/station-portable.tar.gz", sha256: digest("station-portable.tar.gz") },
                },
              }, null, 2)}\n`);
            ' "$RUNNER_TEMP/manifest-payload.json" "$serve_dir" "$release_channel" "$version" "$release_tag" "$source_sha"
            # The keyId must name a pinned installer key; the throwaway key
            # stands in for its bytes only through the test-only
            # STATION_INSTALL_MANIFEST_PUBLIC_KEY_URL override below.
            STATION_ECOSYSTEM_ALLOW_INSECURE_TEST_URLS=1 node "$GITHUB_WORKSPACE/scripts/ecosystem-manifest.mjs" create \
              --payload "$RUNNER_TEMP/manifest-payload.json" \
              --private-key "$RUNNER_TEMP/manifest-private.pem" \
              --key-id station-portable-release-2026-09 \
              --output "$manifests_dir/manifest.json"
          }
          write_manifest_payload

          node -e '
            require("node:http").createServer((request, response) => {
              response.setHeader("content-type", "application/json");
              response.end(JSON.stringify({ models: [] }));
            }).listen(11434, "127.0.0.1");
          ' &
          ollama_pid=$!
          python3 -m http.server 8765 --bind 127.0.0.1 \
            --directory "$serve_dir" >/tmp/station-artifact-server.log 2>&1 &
          artifact_pid=$!
          python3 -m http.server 8766 --bind 127.0.0.1 \
            --directory "$manifests_dir" >/tmp/station-manifest-server.log 2>&1 &
          manifest_pid=$!
          python3 -m http.server 8767 --bind 127.0.0.1 \
            --directory "$keys_dir" >/tmp/station-key-server.log 2>&1 &
          key_pid=$!
          cleanup() {
            "$launcher" stop --base="$station_home" >/dev/null 2>&1 || true
            kill "$ollama_pid" "$artifact_pid" "$manifest_pid" "$key_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          public_install_env=(
            STATION_INSTALL_PUBLIC_MANIFEST_URL=http://127.0.0.1:8766/manifest.json
            STATION_INSTALL_MANIFEST_PUBLIC_KEY_URL=http://127.0.0.1:8767/public.pem
            STATION_INSTALL_ALLOW_INSECURE_TEST_URLS=1
            STATION_INSTALL_SERVER_PORT=3341
            STATION_INSTALL_UI_PORT=3200
          )

          curl -fsSL "file://$GITHUB_WORKSPACE/install.sh" | env \
            HOME="$SMOKE_HOME" \
            PATH="$SMOKE_HOME/fake-bin:$PATH" \
            STATION_CHANNEL="$RUNTIME_CHANNEL" \
            "${public_install_env[@]}" \
            sh 2>&1 | tee "$RUNNER_TEMP/install.log"

          # #2703: install.sh must build the release under the lifecycle
          # instance id its start uses. Otherwise the start after install
          # prints a second "Building application" and rebuilds, leaving the
          # install-time build orphaned beside the one it serves.
          build_count=$(grep -c 'Building application' "$RUNNER_TEMP/install.log" || true)
          if [ "$build_count" != 1 ]; then
            echo "Expected one build (at install, none at start); saw $build_count" >&2
            exit 1
          fi
          for build_output in dist-server dist-ui; do
            outputs=$(find "$install_root/current/" -maxdepth 1 -name "$build_output*" | wc -l | tr -d ' ')
            if [ "$outputs" != 1 ]; then
              echo "Expected one $build_output build in the release; saw $outputs" >&2
              exit 1
            fi
          done

          previous_current=$(readlink "$install_root/current")
          env \
            HOME="$SMOKE_HOME" \
            PATH="$SMOKE_HOME/fake-bin:$SMOKE_HOME/.local/bin:$PATH" \
            "${public_install_env[@]}" \
            "$launcher" upgrade
          node -e '
            const fs = require("node:fs");
            const state = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (state.channel !== process.argv[2]) process.exit(1);
          ' "$install_root/.station-release-state.json" "$RUNTIME_CHANNEL"

          bad_release="$RUNNER_TEMP/release-fails-start"
          bad_work="$RUNNER_TEMP/release-fails-start-work"
          mkdir -p "$bad_release" "$bad_work"
          tar -xzf "$RELEASE_DIR/station-portable.tar.gz" -C "$bad_work"
          mv "$bad_work/station/station" "$bad_work/station/station.real"
          cat >"$bad_work/station/station" <<'EOF'
          #!/bin/bash
          if [ "${1:-}" = start ]; then exit 97; fi
          exec "$(dirname "$0")/station.real" "$@"
          EOF
          chmod +x "$bad_work/station/station"
          tar -czf "$bad_release/station-portable.tar.gz" -C "$bad_work" station
          # Swap the served fixture and re-sign the manifest so the packaged
          # upgrade verifies the bad candidate, fails its start, and rolls back.
          # The bad candidate reuses the installed version with new bytes, which
          # the installer refuses as a possible replay unless the exact version
          # is named with STATION_INSTALL_ALLOW_ROLLBACK=1.
          cp "$bad_release/station-portable.tar.gz" "$serve_dir/station-portable.tar.gz"
          write_manifest_payload
          if env \
            HOME="$SMOKE_HOME" \
            PATH="$SMOKE_HOME/fake-bin:$SMOKE_HOME/.local/bin:$PATH" \
            "${public_install_env[@]}" \
            STATION_VERSION="$release_tag" \
            STATION_INSTALL_ALLOW_ROLLBACK=1 \
            "$launcher" upgrade 2>"$RUNNER_TEMP/bad-upgrade.err"
          then
            echo "Expected failed candidate start" >&2
            exit 1
          fi
          test "$(readlink "$install_root/current")" = "$previous_current"
          # Fail for the reason under test, not an earlier refusal.
          cat "$RUNNER_TEMP/bad-upgrade.err" >&2
          grep -q 'the new release did not start' "$RUNNER_TEMP/bad-upgrade.err"
          node -e '
            const fs = require("node:fs");
            const state = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (state.channel !== process.argv[2]) process.exit(1);
          ' "$install_root/.station-release-state.json" "$RUNTIME_CHANNEL"

          test ! -e "$install_root/current/.git"
          HOME="$SMOKE_HOME" \
            PATH="$SMOKE_HOME/fake-bin:$SMOKE_HOME/.local/bin:$PATH" \
            "$launcher" doctor --json >"$RUNNER_TEMP/doctor.json"
          jq -e '.exitReady == {chatReady:true,runtimeReady:true}' \
            "$RUNNER_TEMP/doctor.json"
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 \
            -o "$RUNNER_TEMP/station-ui.html" http://127.0.0.1:3200/
          grep -q '<div id="root"' "$RUNNER_TEMP/station-ui.html"
          # EXPECTED_SHA, not GITHUB_SHA: under pull_request_target GITHUB_SHA
          # is the BASE tip while the checkout and packager use the PR head.
          curl -fsS http://127.0.0.1:3200/__station/identity \
            | jq -e --arg sha "$EXPECTED_SHA" '.sha == $sha and (.bootId | length > 0)'

          curl -fsSL "file://$GITHUB_WORKSPACE/install.sh" | env \
            HOME="$SMOKE_HOME" \
            STATION_CHANNEL="$RUNTIME_CHANNEL" \
            sh -s uninstall
          test ! -e "$install_root"
          test -d "$station_home"

      - name: Dump Station instance logs on failure
        if: failure()
        env:
          SMOKE_HOME: ${{ runner.temp }}/station-home
        run: |
          set -uo pipefail
          for log in "$SMOKE_HOME"/.station/instances/*/logs/*.log /tmp/station-*.log; do
            [ -f "$log" ] || continue
            echo "===== $log (last 200 lines) ====="
            tail -200 "$log"
          done

  # #2970: the service's Task Scheduler settings on a real Windows host. No
  # leg installs a Windows service end to end, so this registers throwaway
  # tasks the way `station service install` does, applies the install's
  # settings, reads them back through the task XML, and records that Task
  # Scheduler does not rerun a wrapper that exits non-zero.
  windows-task-scheduler:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run dependencies:ci
      - name: Register, configure and read back real scheduled tasks
        env:
          STATION_REAL_TASK_SCHEDULER: '1'
        run: node node_modules/vitest/vitest.mjs run packages/cli/src/__tests__/service-windows.task-scheduler.test.ts --maxWorkers=1 --no-file-parallelism

  # #2675 B2: the public-manifest path installs a prebuilt per-platform
  # server archive. Builds two archives of this candidate on the runner,
  # signs schema 2 manifests for them with a throwaway key under the pinned
  # release key id (install.sh's test-only key override), then installs,
  # starts, upgrades (`station upgrade`, from the recorded manifest URL) and
  # uninstalls with NO Node.js on PATH, and fails if anything builds. The
  # preview ring exercises this install/upgrade path; Nightly publication
  # has its own signed-manifest workflow and evidence.
  install-prebuilt-archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      # Node.js builds and signs; install.sh and the launcher never see it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run dependencies:ci
      - name: Confirm the runner is the matrix target
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
      - run: npm run build
      - name: Build two archives of this candidate
        # The provenance SHA is the commit actually checked out: under
        # pull_request_target GITHUB_SHA is the base tip, not the candidate.
        # The second archive is built from an empty local commit on top, so
        # the two generations carry different SHAs (baked into the server
        # bundle and its build stamp alike) and the service path's identity
        # check can tell them apart (#2675 slice C). The commit is never
        # pushed; the checkout holds no credentials to push it with.
        run: |
          set -euo pipefail
          npm run build:portable-server -- --ref v0.0.0-preview.1 \
            --sha "$(git rev-parse HEAD)" --output-dir "$RUNNER_TEMP/archive-1"
          git -c user.name='install smoke' -c user.email='install-smoke@invalid' \
            commit --quiet --allow-empty -m 'test(install-smoke): second archive generation'
          npm run build:portable-server -- --ref v0.0.0-preview.2 \
            --sha "$(git rev-parse HEAD)" --output-dir "$RUNNER_TEMP/archive-2"
      - name: Start a systemd user manager for the service path
        # Linger starts user@<uid>.service without a login session, which is
        # what `station service install` registers with. No secrets, no token.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 1 60); do
            [ -S "$runtime_dir/bus" ] && break
            sleep 1
          done
          XDG_RUNTIME_DIR="$runtime_dir" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus" \
            systemctl --user show-environment >/dev/null
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus"
          } >>"$GITHUB_ENV"
      - name: Install, start, upgrade and uninstall with no Node.js on PATH
        env:
          SMOKE_SYSTEMD_SERVICE: ${{ runner.os == 'Linux' && '1' || '0' }}
          SMOKE_SERVICE_SKIP_REASON: this leg does not register a LaunchAgent on a hosted macOS runner, so the service path runs on the Linux leg only and the plist is covered by unit tests
        run: |
          scripts/smoke-install-prebuilt-archive.sh \
            "$RUNNER_TEMP/archive-1/station-server-${{ matrix.target }}.tar.gz" \
            "$RUNNER_TEMP/archive-2/station-server-${{ matrix.target }}.tar.gz" \
            "$RUNNER_TEMP/prebuilt-install-smoke"
      - name: Dump Station instance logs on failure
        if: failure()
        run: |
          set -uo pipefail
          for log in "$RUNNER_TEMP"/prebuilt-install-smoke/home/.station/instances/*/logs/*.log; do
            [ -f "$log" ] || continue
            echo "===== $log (last 200 lines) ====="
            tail -200 "$log"
          done
          if [ "$RUNNER_OS" = Linux ] && [ -n "${XDG_RUNTIME_DIR:-}" ]; then
            echo '===== journalctl --user -u station-smoke-service.service ====='
            journalctl --user -u station-smoke-service.service --no-pager -n 200 || true
          fi

  # #2675 slice W1: install.ps1 stages two real Windows archives of this
  # candidate with no Node.js on PATH (so it verifies with the pinned
  # Node.js zip, then with the installed Station's Node.js through a
  # `current` junction), under Windows PowerShell 5.1, PowerShell 7 and
  # Invoke-Expression, beneath a Station root long enough to cross MAX_PATH
  # (#2484), and refuses tampered bytes and a foreign signature. Stage-only
  # is all install.ps1 does so far; the full install joins in slice W2.
  install-ps1-windows:
    name: install.ps1 (win32-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup pinned pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with: { install: false }
      # Node.js builds and signs; install.ps1 never sees it (the smoke runs it
      # with a PATH that has no node.exe).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run dependencies:ci
      - name: Confirm the runner is the target
        run: test "$(node -p 'process.platform + "-" + process.arch')" = win32-x64
      - run: npm run build
      - name: Build two archives of this candidate
        # As in install-prebuilt-archive: the provenance SHA is the commit
        # checked out, and the second archive comes from an empty local commit
        # on top that is never pushed.
        run: |
          set -euo pipefail
          npm run build:portable-server -- --ref v0.0.0-preview.1 \
            --sha "$(git rev-parse HEAD)" --output-dir "$RUNNER_TEMP/archive-1"
          git -c user.name='install smoke' -c user.email='install-smoke@invalid' \
            commit --quiet --allow-empty -m 'test(install-smoke): second archive generation'
          npm run build:portable-server -- --ref v0.0.0-preview.2 \
            --sha "$(git rev-parse HEAD)" --output-dir "$RUNNER_TEMP/archive-2"
      - name: Stage, install, upgrade and uninstall with install.ps1, no Node.js on PATH
        run: |
          node scripts/smoke-install-ps1.mjs \
            --archive1 "$RUNNER_TEMP/archive-1/station-server-win32-x64.zip" \
            --archive2 "$RUNNER_TEMP/archive-2/station-server-win32-x64.zip" \
            --work "$RUNNER_TEMP/install-ps1-smoke"
