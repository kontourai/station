name: "Main: Pages"

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs-kit.json
      - docs/**
      - scripts/build-github-pages.mjs
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: npm run dependencies:ci

      - name: Build Pages site
        run: npm run docs:pages:build

      # The org hub and the shared docs MCP read
      # https://kontourai.github.io/station/docs-bundle.json. docs-kit renders
      # its own site from docs-kit.json; only the bundle is published, beside
      # Station's own pages, whose docs/<path>.html URLs the bundle points at.
      - name: Build docs-kit bundle
        run: >-
          npx -y github:kontourai/docs-kit#efe0bfe4ad247861ef661c907f6354d6167fa3be
          docs-kit build
          --out "$RUNNER_TEMP/docs-kit-site"
          --base-url https://kontourai.github.io/station/

      - name: Add docs-kit bundle to the Pages site
        run: cp "$RUNNER_TEMP/docs-kit-site/docs-bundle.json" ./dist-pages/docs-bundle.json

      - name: Publish Pages site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
          keep_files: true
