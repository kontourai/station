name: Nightly

# Nightly proves source usability and signed artifact custody independently of
# scheduled full qualification. Stable RC/final retain exact-SHA full regression.
# Source usability is the merge queue's fast-checks statics on this exact SHA
# when that run passed, and otherwise the source gate's own checks below.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      source_sha: { description: Optional current workflow event SHA; older revisions are rejected, required: false }
      rebuild_index: { description: Optional native rebuild index, required: false }

permissions: { contents: write, actions: read, id-token: write, attestations: write }
# Serialize scheduled publication and manual recovery.
concurrency: { group: nightly, cancel-in-progress: false }

jobs:
  delivery-decide:
    name: Decide Nightly publication
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Refuse a Nightly base at or below a published RC or final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/nightly-release-base.mjs --package-json package.json --repository "$GITHUB_REPOSITORY"
      - id: decide
        name: Decide configured cadence and bounded terminal delivery recovery
        env:
          GH_TOKEN: ${{ github.token }}
          STATION_NIGHTLY_INTERVAL_HOURS: ${{ vars.STATION_NIGHTLY_INTERVAL_HOURS }}
          REQUESTED_REBUILD_INDEX: ${{ inputs.rebuild_index }}
        run: |
          set -euo pipefail
          # The ledger's rows land on main after a ship, so the run's own
          # checkout cannot hold them; origin/main is the authority.
          git fetch --no-tags origin main
          reservations="$RUNNER_TEMP/nightly-reservations.txt"
          git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY" 'refs/tags/nightly-version-code/*' > "$reservations"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$REQUESTED_REBUILD_INDEX" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/nightly-qualification-decide.mjs --source-sha "$GITHUB_SHA" --reservation-refs "$reservations" --ledger-ref origin/main

  fleet-staging:
    name: 3 · Stage portable fleet evidence
    needs: [test-gate]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.test-gate.result == 'success' && needs.test-gate.outputs.source_sha == github.sha }}
    permissions: { contents: read, attestations: write, id-token: write }
    uses: ./.github/workflows/nightly-fleet-staging.yml
    with:
      source_sha: ${{ needs.test-gate.outputs.source_sha }}

  test-gate:
    name: 1 · Source gate (lint, typecheck, browser smoke)
    needs: [delivery-decide]
    if: ${{ github.ref == 'refs/heads/main' && needs.delivery-decide.outputs.publish == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # actions: read is for the merge-queue receipt lookup's run and job listings.
    permissions: { contents: read, actions: read }
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Bind every Nightly leg to one main revision
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          source_sha=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_SOURCE_SHA" ] && [ "$REQUESTED_SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo 'source_sha may only name the current Nightly workflow event SHA; older revisions are rejected for every native and CLI leg.' >&2
            exit 1
          fi
          test "$source_sha" = "$GITHUB_SHA"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Setup pinned pnpm
        uses: kontourai/station/.github/actions/setup-verified-pnpm@382b4af65e5f8bc5e3d62bd64ef1eba8653af50f

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      # The merge queue ran these checks on this exact SHA when its merge_group
      # run of ci.yml passed fast-checks statics, journey step included
      # (scripts/nightly-source-gate-receipt.mjs). Only accepted=true skips
      # them; no receipt, an API error or a failure of this step runs them all.
      - id: receipt
        name: Accept the merge queue's source gate for this exact SHA
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/nightly-source-gate-receipt.mjs
      # Installation and the Chromium cache steps always run: this job is the
      # only writer of the cache that pull-request and merge-group jobs restore.
      - run: npm run dependencies:ci
      - name: Check native platform boundary before staging
        if: steps.receipt.outputs.accepted != 'true'
        run: npm run native-platform:ratchet
      - name: Lint
        if: steps.receipt.outputs.accepted != 'true'
        run: npm run lint:check
      - if: steps.receipt.outputs.accepted != 'true'
        run: npm run build:connect
      - name: Typecheck
        if: steps.receipt.outputs.accepted != 'true'
        env:
          # station#2621: this fleet reports 4 vCPUs / ~15.6 GiB, which the
          # RAM-only default rounds to 2 typecheck slots -- see the matching
          # comment on ci.yml's "Run fast CI lane" step for the measured
          # evidence. Nightly is a single job per ephemeral VM, so the
          # shared-dev-host guard the default sizing protects against does
          # not apply here either.
          STATION_TYPECHECK_SLOTS: '4'
        run: node scripts/typecheck-aggregate.mjs
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: station-playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" timeout 360 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt timed out or failed; retrying"
            sleep 15
          done
          echo '::error::Playwright install failed after 3 attempts'
          exit 1
      - name: Run deterministic browser smoke
        if: steps.receipt.outputs.accepted != 'true'
        timeout-minutes: 10
        env:
          PW_REPORTER: line,html
          STATION_REQUIRED_SOURCE_SHA: ${{ github.sha }}
        run: npm run test:e2e:pr-smoke
      - name: Upload test-gate diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: nightly-test-gate-${{ github.run_id }}
          path: |
            .kontourai/browser-evidence/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Artifact staging and every publisher require the real source gate.
  native-stage:
    name: 2 · Stage native builds
    needs: [test-gate]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs['test-gate'].result == 'success' && needs['test-gate'].outputs.source_sha == github.sha }}
    # Reusable workflows can only reduce the caller's token. Staging writes the
    # immutable version reservation tag and attests the staged artifacts.
    permissions: { contents: write, id-token: write, attestations: write }
    uses: ./.github/workflows/nightly-native-stage.yml
    with:
      source_sha: ${{ needs.test-gate.outputs.source_sha }}
      rebuild_index: ${{ inputs.rebuild_index }}
    secrets: inherit

  native-cohort:
    name: 3 · Publish native cohort
    needs: [test-gate, native-stage]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs['test-gate'].result == 'success' && needs['native-stage'].result == 'success' && needs['test-gate'].outputs.source_sha == github.sha }}
    # Reusable workflows can only reduce the caller's token. The cohort writes
    # recovery locks and promotion fences and attests the final receipt.
    permissions: { contents: write, actions: read, id-token: write, attestations: write }
    uses: ./.github/workflows/nightly-native-cohort.yml
    with:
      source_sha: ${{ needs.test-gate.outputs.source_sha }}
      force_rebuild: ${{ inputs.rebuild_index != '' }}
      build: ${{ needs.native-stage.outputs.build }}
      marketing_version: ${{ needs.native-stage.outputs.marketing_version }}
      bundle_version: ${{ needs.native-stage.outputs.bundle_version }}
      reservation_tag: ${{ needs.native-stage.outputs.reservation_tag }}
    secrets: inherit

  # #2675 slice E: the portable server archives under the native Nightly's
  # reserved version (X.Y.Z-nightly.<version code>). It needs the plan's
  # reservation, not native build health, so a failed native leg does not hold
  # the server back. The callee is a dry run unless the owner sets the
  # STATION_PORTABLE_NIGHTLY_PUBLISH repository variable to `enabled`.
  portable-nightly:
    name: 3 · Portable server Nightly (dry run unless enabled)
    needs: [test-gate, native-stage]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs['test-gate'].result == 'success' && needs['test-gate'].outputs.source_sha == github.sha && needs['native-stage'].outputs.build == 'true' && needs['native-stage'].outputs.bundle_version != '' }}
    # Reusable workflows can only reduce the caller's token. Only the callee's
    # owner-gated publish job uses the write scope.
    permissions: { contents: write }
    uses: ./.github/workflows/portable-nightly-publish.yml
    with:
      source_sha: ${{ needs.test-gate.outputs.source_sha }}
      marketing_version: ${{ needs.native-stage.outputs.marketing_version }}
      version_code: ${{ needs.native-stage.outputs.bundle_version }}
    # Pass caller-available secrets to this reusable workflow. Its publish job
    # separately names the protected portable-nightly-signing environment.
    # An earlier call without inheritance reported an empty signing key; retain
    # that incident separately from GitHub's environment-secret contract.
    # Only the callee's publish job reads a secret.
    secrets: inherit

  nightly-cli:
    name: 3 · Publish CLI to npm nightly
    needs: [test-gate]
    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' && needs['test-gate'].result == 'success' && needs['test-gate'].outputs.source_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Nothing here writes the repository any more (the deploy-ledger push
    # moved out), so contents is read: checkout, OIDC npm publish, the run's
    # created_at lookup (actions: read) and the receipt upload need no more.
    permissions: { contents: read, id-token: write, actions: read }
    # This job no longer writes the deploy ledger. Its registry-verified
    # publish is recorded in the run's one ledger commit: by the native
    # cohort's record job, or by record-cli-ledger below when the cohort
    # does not get there. These outputs are what record-cli-ledger records.
    outputs:
      ledger_ready: ${{ steps.cli_registry_provenance.outcome }}
      version: ${{ steps.identity.outputs.version }}
      recorded_at: ${{ steps.cli_registry_provenance.outputs.recorded_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test-gate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned pnpm
        uses: kontourai/station/.github/actions/setup-verified-pnpm@382b4af65e5f8bc5e3d62bd64ef1eba8653af50f

      - id: cli_source_decide
        name: Skip CLI publication when nightly already names this source
        env:
          SOURCE_SHA: ${{ needs.test-gate.outputs.source_sha }}
        run: |
          published_sha=$(npm view @kontourai/station-cli@nightly gitHead --json 2>/dev/null || true)
          if [ "$published_sha" = "\"$SOURCE_SHA\"" ] || [ "$published_sha" = "$SOURCE_SHA" ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo '::notice::npm nightly dist-tag already names this exact source.'
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cli_source_decide.outputs.build == 'true'
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Setup pinned Node for CLI receipt recovery
        if: steps.cli_source_decide.outputs.build != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - id: identity
        name: Build exact-SHA CLI nightly identity
        env:
          BUILD_CLI: ${{ steps.cli_source_decide.outputs.build }}
          GH_TOKEN: ${{ github.token }}
          STATION_CLI_BUILD_CHANNEL: nightly
          STATION_CLI_SOURCE_SHA: ${{ needs.test-gate.outputs.source_sha }}
        run: |
          # Run creation time is immutable across reruns, including midnight.
          export NIGHTLY_RUN_CREATED_AT
          NIGHTLY_RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
          version=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {nightlyCliVersion} from "./scripts/lib/nightly-build-identity.mjs"; process.stdout.write(nightlyCliVersion(JSON.parse(readFileSync("packages/cli/package.json")).version,new Date(process.env.NIGHTLY_RUN_CREATED_AT),process.env.GITHUB_RUN_ID))')
          # A raw `npm version` walks the workspace to refresh a lockfile this
          # pnpm-managed repository does not have, and fails on peer conflicts
          # (ERESOLVE) before it ever writes the field. Only the field changes.
          if [ "$BUILD_CLI" = true ]; then
            npm run dependencies:ci
            node scripts/lib/nightly-build-identity.mjs --cli-version "$version" --package-json packages/cli/package.json
            npm run build:cli
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: cli_npm_preflight
        name: Check npm trusted publishing for @kontourai/station-cli
        if: steps.cli_source_decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          skip() { echo 'trusted_publisher=false' >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 0; }
          [ "$GITHUB_REF" = refs/heads/main ] || skip "Refusing nightly npm publication outside refs/heads/main."
          required=11.5.1; actual=$(npm --version)
          [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" = "$required" ] || { echo "npm $actual is below trusted-publishing floor $required" >&2; exit 1; }
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" && test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -z "${NPM_TOKEN:-}"
          node scripts/check-publish-npmrc-credentials.mjs
          token_response=$(mktemp)
          status=$(curl -sS --max-time 30 -o "$token_response" -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          [ "$status" = 200 ] || { echo "OIDC id-token request returned HTTP $status" >&2; exit 1; }
          jwt=$(node -e 'const x=require("node:fs").readFileSync(process.argv[1]);process.stdout.write(JSON.parse(x).value||"")' "$token_response")
          test -n "$jwt"
          exchange=$(mktemp)
          status=$(curl -sS --max-time 30 -o "$exchange" -w '%{http_code}' -X POST -H 'Accept: application/json' -H "Authorization: Bearer $jwt" 'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@kontourai%2fstation-cli')
          case "$status" in
            2[0-9][0-9]) ;;
            *) echo "::error::npm trusted publisher exchange for @kontourai/station-cli failed (HTTP $status)." >&2; exit 1 ;;
          esac
          node -e 'const x=JSON.parse(require("node:fs").readFileSync(process.argv[1]));if(typeof x.token!=="string"||!x.token)process.exit(1)' "$exchange"
          echo 'trusted_publisher=true' >> "$GITHUB_OUTPUT"
      - id: npm_idempotency
        name: Refuse a conflicting CLI version and skip an exact rerun
        env:
          CLI_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ needs.test-gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          npm_view_error=$(mktemp)
          set +e
          git_head=$(npm view "@kontourai/station-cli@$CLI_VERSION" gitHead --json 2>"$npm_view_error")
          npm_view_status=$?
          set -e
          if [ "$npm_view_status" -ne 0 ]; then
            if printf '%s\n' "$git_head" | grep -q '"code"[[:space:]]*:[[:space:]]*"E404"' || grep -q 'E404' "$npm_view_error"; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            else
              cat "$npm_view_error" >&2
              exit "$npm_view_status"
            fi
          elif [ -z "$git_head" ] || [ "$git_head" = 'null' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [ "$git_head" = "\"$SOURCE_SHA\"" ] || [ "$git_head" = "$SOURCE_SHA" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice::CLI $CLI_VERSION is already published from this exact source."
          else
            echo "::error::CLI version $CLI_VERSION is already published from a different source: $git_head" >&2
            exit 1
          fi
      - id: cli_npm_publish
        name: Publish @kontourai/station-cli to npm nightly
        if: steps.cli_source_decide.outputs.build == 'true' && steps.npm_idempotency.outputs.publish == 'true' && steps.cli_npm_preflight.outputs.trusted_publisher == 'true'
        working-directory: packages/cli
        run: npm publish --tag nightly --access public
      - id: cli_registry_provenance
        name: Bind the published CLI receipt to npm registry provenance
        if: ${{ always() && (steps.cli_npm_publish.outcome == 'success' || (steps.npm_idempotency.outcome == 'success' && steps.npm_idempotency.outputs.publish == 'false')) }}
        env:
          SOURCE_SHA: ${{ needs.test-gate.outputs.source_sha }}
          CLI_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p provider-receipts
          registry_record="$RUNNER_TEMP/nightly-cli-registry-githead.json"
          # npm's registry read lags its write: the first Nightly through this
          # step read E404 for a version the publish had just confirmed
          # (#1498). Bounded retry; a persistent miss still fails closed.
          # Run 35890429058 published successfully but the version was still
          # 404 after 12 reads (3 minutes). --prefer-online skips npm's local
          # metadata cache, so a cached 404 cannot be re-served, and the
          # window is 40 reads (10 minutes).
          attempt=0
          until npm view --prefer-online "@kontourai/station-cli@$CLI_VERSION" gitHead --json > "$registry_record" 2> "$RUNNER_TEMP/nightly-cli-registry-view.err"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 40 ]; then
              cat "$RUNNER_TEMP/nightly-cli-registry-view.err" >&2
              echo "::error::npm registry never returned @kontourai/station-cli@$CLI_VERSION after $attempt reads" >&2
              exit 1
            fi
            echo "registry read $attempt did not return $CLI_VERSION yet; retrying in 15s"
            sleep 15
          done
          registry_sha=$(node scripts/verify-npm-registry-provenance.mjs "$registry_record" "$SOURCE_SHA")
          # The ledger row's timestamp: the moment this publish was verified,
          # whichever later job writes the row.
          recorded_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REGISTRY_SHA="$registry_sha" VERIFIED_AT="$recorded_at" node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync(process.argv[1], JSON.stringify({schemaVersion:1,kind:"station.npm-publish-receipt",package:"@kontourai/station-cli",version:process.env.CLI_VERSION,sourceSha:process.env.SOURCE_SHA,registryGitHead:process.env.REGISTRY_SHA,verifiedAt:process.env.VERIFIED_AT,artifactBuiltAt:null,artifactBuiltAtReason:"npm package has no native artifact manifest",sourceBinding:"npm registry gitHead",},null,2)+"\n")' provider-receipts/nightly-cli.json
          echo "recorded_at=$recorded_at" >> "$GITHUB_OUTPUT"
      - name: Retain the Nightly CLI provider receipt
        if: ${{ always() && steps.cli_registry_provenance.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-cli-provider-receipt-${{ github.run_id }}
          path: provider-receipts/nightly-cli.json
          if-no-files-found: error
          retention-days: 14

  # One deploy-ledger commit per run: every push to main discards the merge
  # groups in flight. When the native cohort reaches its record job, that job
  # writes this run's npm row in the same commit as the native rows. This job
  # runs after the cohort however it ended (skipped, failed or cancelled) and
  # records the npm row alone only if main does not hold it yet (--if-absent),
  # so the row is neither lost nor written twice. Like the in-job ledger step
  # it replaces, it also runs when the run is cancelled: the publish happened.
  record-cli-ledger:
    name: 4 · Record the CLI ship the cohort did not
    needs: [test-gate, nightly-cli, native-cohort]
    if: ${{ always() && github.event_name != 'pull_request' && needs['test-gate'].result == 'success' && needs['test-gate'].outputs.source_sha == github.sha && needs['nightly-cli'].outputs.ledger_ready == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test-gate.outputs.source_sha }}
          # The changelog slice walks the previous npm ship SHA to this one.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: ledger_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Record the independent CLI ship in the deploy ledger
        env:
          GITHUB_TOKEN: ${{ steps.ledger_token.outputs.token }}
          CLI_VERSION: ${{ needs.nightly-cli.outputs.version }}
          CLI_RECORDED_AT: ${{ needs.nightly-cli.outputs.recorded_at }}
          SOURCE_SHA: ${{ needs.test-gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          test -n "$CLI_VERSION"
          test -n "$CLI_RECORDED_AT"
          node scripts/lib/deploy-ledger-commit.mjs --subject-run-id "$GITHUB_RUN_ID" --record node scripts/deploy-ledger.mjs --if-absent --channel nightly-npm --version "$CLI_VERSION" --sha "$SOURCE_SHA" --timestamp "$CLI_RECORDED_AT" --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --gate-result 'Nightly exact gates success; npm registry gitHead equals source SHA' --github-repo "$GITHUB_REPOSITORY" --artifact "npm:@kontourai/station-cli@$CLI_VERSION (dist-tag nightly; artifactBuiltAt unknown)" --note 'artifactBuiltAt is null: npm package has no native artifact manifest'
