name: Issue lifecycle

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reduce:
    # This workflow executes only the default-branch workflow definition; it
    # never checks out or runs pull-request code.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read the repository-controlled default branch, never issue/PR code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply deterministic lifecycle patch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { reduceIssueLifecycle } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/issue-lifecycle-reducer.mjs`);
            const event = context.payload;
            const issue = event.issue;
            if (!issue || issue.pull_request) return;
            let input = { issue: { labels: issue.labels } };
            if (context.eventName === 'issues') {
              if (event.action === 'opened') input.kind = 'issue-opened';
              if (event.action === 'reopened') input.kind = 'issue-reopened';
              if (event.action === 'labeled') {
                const permission = await github.rest.repos.getCollaboratorPermissionLevel({ owner: context.repo.owner, repo: context.repo.repo, username: event.sender.login });
                input = { ...input, kind: 'maintainer-requested-reporter', label: event.label?.name, actorPermission: permission.data.user.permission };
              }
            } else if (context.eventName === 'issue_comment' && event.action === 'created') {
              input = { ...input, kind: 'reporter-commented', reporterLogin: issue.user.login, actorLogin: event.comment.user.login, commentBody: event.comment.body };
            }
            const patch = reduceIssueLifecycle(input);
            for (const label of patch.add) await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: [label] });
            for (const label of patch.remove) await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, name: label });
