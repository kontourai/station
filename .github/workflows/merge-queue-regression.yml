name: "Diagnostic (manual): Merge integration"

# Automatic integration belongs to ci.yml's same-run fast-checks graph.
# Keep the existing dispatch entry point as a conservative full-corpus diagnostic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/full-regression.yml
    with:
      capacity_class: integration
      source_sha: ${{ github.sha }}
      allow_reuse: true
