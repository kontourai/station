name: "PR: Security analysis"

on:
  # The workflow definition is read from the protected base branch. Candidate
  # code runs only on the disposable GitHub-hosted runner below.
  pull_request_target:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  # Main is analysed daily rather than on every push: a push re-analysed the
  # exact commit its merge group had already analysed. This run is what still
  # fails on a stale baseline entry (see the policy step) and what uploads the
  # default-branch TRAP cache merge groups restore. main-health.yml tracks a
  # red run here as "Main pipeline red: PR: Security analysis".
  schedule:
    - cron: '11 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request_target' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          fail-on-severity: high
          license-check: false
          warn-only: false
          comment-summary-in-pr: never
      - name: Review merge-group dependency changes
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}
          vulnerability-check: true
          fail-on-severity: high
          license-check: false
          warn-only: false
          comment-summary-in-pr: never
  # pull_request_target reads this file from the protected base, but a merge
  # group runs the YAML of its own candidate commit. A pull request that edits
  # anything under .github/ could therefore redefine (or impersonate) the
  # merge-group CodeQL context, so such a pull request still gets the
  # base-defined analysis here, before it can be queued. Git plumbing only:
  # no candidate file is checked out, parsed or executed, and every failure
  # answers analyse=true.
  gate-change:
    name: CodeQL gate-change classification
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      analyse: ${{ steps.classify.outputs.analyse }}
    steps:
      - id: classify
        name: Classify workflow changes since the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Full commit history without trees or blobs (a few MB): enough for
          # an exact merge base, with only the .github/ trees fetched lazily.
          # A fork head is fetched by SHA from the base repository too; if that
          # ever fails, the analysis runs.
          classify() {
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || return 10
            repo="$(mktemp -d)" || return 11
            git -C "$repo" init -q || return 11
            git -C "$repo" remote add origin "$REPOSITORY_URL" || return 11
            git -C "$repo" fetch -q --no-tags --filter=tree:0 origin "$BASE_SHA" "$HEAD_SHA" || return 12
            [ "$(git -C "$repo" rev-parse --is-shallow-repository)" = false ] || return 13
            merge_base="$(git -C "$repo" merge-base --all "$BASE_SHA" "$HEAD_SHA")" || return 14
            [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] || return 14
            # Exit 0: no .github/ change; 1: a change; anything else: an error.
            git -C "$repo" diff --quiet --no-ext-diff "$merge_base" "$HEAD_SHA" -- .github/
          }
          status=0
          classify || status=$?
          analyse=true
          case "$status" in
            0)
              analyse=false
              echo "No .github/ change since the merge base; CodeQL runs in the merge group."
              ;;
            1)
              echo "This pull request changes .github/; running the base-defined CodeQL analysis now."
              ;;
            *)
              echo "::warning::CodeQL gate-change classification failed closed (status $status); running the analysis now."
              ;;
          esac
          echo "analyse=$analyse" >> "$GITHUB_OUTPUT"
  codeql:
    name: CodeQL JavaScript and TypeScript
    needs: gate-change
    # Analyse once per landing, in the merge group, rather than again on every
    # PR push; an ordinary pull request reports this required context skipped,
    # as build-ios-verification does. On pull_request_target it still runs
    # unless gate-change succeeded AND answered analyse=false, so a failed,
    # timed-out or silent classifier means a real analysis. `!cancelled()`
    # rather than `always()`: in a cancelled run a not-yet-started job ends
    # cancelled (which does not satisfy the required context) instead of
    # starting a 10-minute analysis nobody will read. merge_group, schedule
    # and dispatch always analyse; gate-change is skipped there.
    # The pull_request_target branches in the checkout refs, TRAP switch and
    # stale-baseline mode below apply to that PR-level run.
    if: ${{ !cancelled() && (github.event_name != 'pull_request_target' || needs.gate-change.result != 'success' || needs.gate-change.outputs.analyse != 'false') }}
    runs-on: ubuntu-22.04
    # A successful security-extended run took 10m55; retain bounded headroom
    # for post-analysis normalization and base-policy enforcement.
    timeout-minutes: 30
    steps:
      - name: Check out base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          path: base-policy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: base-policy/.nvmrc
          package-manager-cache: false
      - name: Isolate base policy outside candidate scan
        env:
          BASE_POLICY_DIRECTORY: ${{ runner.temp }}/base-policy
        run: mv base-policy "$BASE_POLICY_DIRECTORY"
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: candidate
      # Test code is not shipped, and it was roughly half of what this job
      # extracted and analyzed. The ignore list is inline rather than a
      # config-file so a candidate cannot widen it: pull_request_target reads
      # this YAML from the protected base, and actionlint-gate.mjs pins the
      # exact string. Paths are relative to source-root (the candidate).
      #
      # TRAP caching: the scheduled and dispatched runs on main upload the
      # default-branch cache; merge_group only restores it, because CodeQL
      # uploads TRAP caches only from the default branch and a queue ref is
      # not it. It stays off for the PR-level run: under pull_request_target
      # GITHUB_REF is the base branch, so CodeQL would upload a cache built
      # from the candidate (only GitHub's read-only token stopped it in run
      # 35824349214).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          source-root: candidate
          trap-caching: ${{ github.event_name != 'pull_request_target' }}
          config: |
            paths-ignore:
              - '**/__tests__/**'
              - 'tests/**'
              - '**/*.test.*'
              - '**/*.spec.*'
      - id: analyze
        name: Analyze without ingestion
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:javascript-typescript
          checkout_path: candidate
          output: ${{ runner.temp }}/codeql-sarif
          upload: never
          upload-database: false
      - name: Normalize and enforce JavaScript SARIF policy
        env:
          CODEQL_SARIF_DIRECTORY: ${{ runner.temp }}/codeql-sarif
          CODEQL_NORMALIZED_SARIF: ${{ runner.temp }}/codeql-sarif-normalized/javascript.sarif
          BASE_POLICY_DIRECTORY: ${{ runner.temp }}/base-policy
        run: |
          mapfile -d '' -t SARIF_FILES < <(find "$CODEQL_SARIF_DIRECTORY" -type f -name javascript.sarif -print0)
          if [ "${#SARIF_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one JavaScript CodeQL SARIF file; found ${#SARIF_FILES[@]}." >&2
            exit 1
          fi
          node "$BASE_POLICY_DIRECTORY/scripts/codeql-sarif-normalize.mjs" --input="${SARIF_FILES[0]}" --output="$CODEQL_NORMALIZED_SARIF"
          # Pull requests and merge groups read the baseline from the BASE
          # checkout, so an entry the candidate removes is invisible here;
          # warn instead of failing or the baseline could never shrink
          # through a green gate. The daily run on main enforces.
          STALE_BASELINE_MODE=fail
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ] || [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            STALE_BASELINE_MODE=warn
          fi
          node "$BASE_POLICY_DIRECTORY/scripts/codeql-sarif-policy.mjs" --input="$CODEQL_NORMALIZED_SARIF" --baseline="$BASE_POLICY_DIRECTORY/scripts/codeql-error-baseline.json" --stale-baseline="$STALE_BASELINE_MODE"
