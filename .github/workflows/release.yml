      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      VITE_NATIVE_APP_UPDATE_FEED_URL: ${{ vars.NATIVE_APP_UPDATE_FEED_URL }}
      VITE_NATIVE_APP_UPDATE_PROVIDER_ORIGIN: ${{ vars.NATIVE_APP_UPDATE_PROVIDER_ORIGIN }}
      VITE_NATIVE_APP_UPDATE_CHANNEL: ${{ vars.NATIVE_APP_UPDATE_CHANNEL }}
      VITE_NATIVE_APP_VERSION: ${{ needs.preflight.outputs.version }}
      STATION_MOBILE_DEFAULT_ENDPOINT: ${{ vars.STATION_MOBILE_DEFAULT_ENDPOINT_STABLE }}
      NATIVE_APP_UPDATE_ACTION_URL: ${{ vars.NATIVE_APP_UPDATE_ACTION_URL }}
      NATIVE_APP_UPDATE_ACTION_KIND: ${{ vars.NATIVE_APP_UPDATE_ACTION_KIND }}
      NATIVE_APP_UPDATE_ACTION_ORIGINS: ${{ vars.NATIVE_APP_UPDATE_ACTION_ORIGINS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.preflight.outputs.sha }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with: { targets: aarch64-apple-ios }
      - run: brew install xcodegen libimobiledevice cocoapods
      - name: Resolve native update feed contract
        id: update_feed
        run: |
          # Store tracks are the update mechanism for shipped builds: Play
          # internal/TestFlight upload later in this job, and both auto-update
          # (#2211). A custom feed is therefore optional, and this step is
          # optional in exactly the way store publication already is.
          #
          # Configured: the full contract is still enforced fail-closed, byte
          # for byte, exactly as before.
          # Absent: the build continues to the store upload instead of dying
          # eleven steps before reaching it. Nothing downstream lies about it —
          # an unconfigured client renders no update state at all (#2217), so
          # there is no user-visible claim left for this gate to protect.
          missing=""
          for name in VITE_NATIVE_APP_UPDATE_FEED_URL VITE_NATIVE_APP_UPDATE_PROVIDER_ORIGIN VITE_NATIVE_APP_UPDATE_CHANNEL VITE_NATIVE_APP_VERSION NATIVE_APP_UPDATE_ACTION_URL NATIVE_APP_UPDATE_ACTION_KIND NATIVE_APP_UPDATE_ACTION_ORIGINS; do
            test -n "${!name}" || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            node scripts/native-update-feed.mjs validate-config
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Native update feed not configured (missing:$missing); skipping feed publish. Store-track upload is the update path for this build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run dependencies:ci && npm run build:native-client
      - name: Verify App Store Connect app authority
        id: app_store
        run: |
          mkdir -p provider-receipts
          node scripts/app-store-connect-receipt.mjs app-preflight \
            --bundle-id io.kontourai.station \
            --output provider-receipts/app-store-connect-app-preflight.json \
            --github-output "$GITHUB_OUTPUT"
      - run: node scripts/lib/native-release-config.mjs --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/tauri.release.conf.json"
      - name: Import protected Apple signing and store material
        env:
          APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD APPLE_DEVELOPMENT_TEAM APPLE_SIGNING_IDENTITY APPLE_PROVISIONING_PROFILE_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing required protected secret: $name" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/station.p12"
          profile="$RUNNER_TEMP/station.mobileprovision"
          keychain="$RUNNER_TEMP/station.keychain-db"
          printf '%s' "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          node scripts/check-ios-store-profile.mjs --profile "$profile" --label APPLE_PROVISIONING_PROFILE_BASE64
          node scripts/ios-store-signing-config.mjs --profile "$profile" --identity "$APPLE_SIGNING_IDENTITY" --team "$APPLE_DEVELOPMENT_TEAM" --bundle-id io.kontourai.station --template src-desktop/gen/apple/project.yml --template-output "$RUNNER_TEMP/station-ios-distribution-project.yml" --overlay-output "$RUNNER_TEMP/station-ios-distribution-overlay.json"
          security create-keychain -p "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" "$keychain"
          security unlock-keychain -p "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
