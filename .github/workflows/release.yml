  ios-device:
    needs: [preflight, full-regression]
    if: ${{ needs['full-regression'].result == 'success' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/testflight-delivery.yml
    with:
      channel: ${{ needs.preflight.outputs.channel == 'preview' && 'beta' || 'stable' }}
      source_sha: ${{ needs.preflight.outputs.sha }}
      source_ref: refs/tags/${{ needs.preflight.outputs.tag }}
      marketing_version: ${{ needs.preflight.outputs.ios_marketing_version }}
      bundle_version: ${{ needs.preflight.outputs.ios_bundle_version }}
      release_label: ${{ needs.preflight.outputs.tag }}
      mobile_endpoint: ${{ needs.preflight.outputs.channel == 'preview' && vars.STATION_MOBILE_DEFAULT_ENDPOINT_BETA || vars.STATION_MOBILE_DEFAULT_ENDPOINT_STABLE }}
      update_feed_url: ${{ vars.NATIVE_APP_UPDATE_FEED_URL }}
      update_provider_origin: ${{ vars.NATIVE_APP_UPDATE_PROVIDER_ORIGIN }}
      update_action_url: ${{ vars.NATIVE_APP_UPDATE_ACTION_URL }}
      update_action_kind: ${{ vars.NATIVE_APP_UPDATE_ACTION_KIND }}
      update_action_origins: ${{ vars.NATIVE_APP_UPDATE_ACTION_ORIGINS }}

  container:
    needs: [preflight, full-regression]
    if: ${{ needs['full-regression'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      RELEASE_CREATED_AT: ${{ needs.preflight.outputs.created_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.preflight.outputs.sha }}" }
      - id: metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          metadata=$(node scripts/lib/container-release-metadata.mjs --tag="$RELEASE_TAG" --sha="$RELEASE_SHA" --created-at="$RELEASE_CREATED_AT" --repository="$GITHUB_REPOSITORY")
          # shellcheck disable=SC2016
          METADATA="$metadata" node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(process.env.METADATA);
            const labels = Object.entries(metadata.labels).map(([key, value]) => `${key}=${value}`).join("\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `staging_tag=${metadata.image}:sha-${metadata.sha}\nlabels<<EOF\n${labels}\nEOF\n`);
          '
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Authenticate to GHCR with the ephemeral workflow token
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Refuse to overwrite immutable source image staging
        run: |
          if docker buildx imagetools inspect "${{ steps.metadata.outputs.staging_tag }}" >/dev/null 2>&1; then
            echo "Immutable image already exists: ${{ steps.metadata.outputs.staging_tag }}" >&2
            exit 1
          fi
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.staging_tag }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            STATION_RELEASE_SHA=${{ env.RELEASE_SHA }}
            STATION_RELEASE_REF=${{ env.RELEASE_TAG }}
            STATION_RELEASE_CREATED_AT=${{ env.RELEASE_CREATED_AT }}
            STATION_IMAGE_REPOSITORY=${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Create immutable container release descriptor
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir release-assets
          node scripts/lib/container-release-metadata.mjs --tag="$RELEASE_TAG" --sha="$RELEASE_SHA" --created-at="$RELEASE_CREATED_AT" --repository="$GITHUB_REPOSITORY" --digest="${{ steps.image.outputs.digest }}" --container-descriptor=release-assets/station-container-release.json
      - name: Resolve exact immutable platform digests from the manifest list
        id: platforms
        run: |
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}@${{ steps.image.outputs.digest }}" --raw > "$RUNNER_TEMP/station-container-manifest.json"
          node scripts/release-container-platform-digests.mjs "$RUNNER_TEMP/station-container-manifest.json" "${{ steps.image.outputs.digest }}"
      - name: Scan immutable linux/amd64 image digest with pinned Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.platforms.outputs.amd64 }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/station-container-syft-amd64.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Scan immutable linux/arm64 image digest with pinned Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.platforms.outputs.arm64 }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/station-container-syft-arm64.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Bind the scanner inventory to the immutable release descriptor
        run: |
          node scripts/release-container-sbom-source.mjs --input-amd64 "$RUNNER_TEMP/station-container-syft-amd64.cdx.json" --amd64-digest "${{ steps.platforms.outputs.amd64 }}" --input-arm64 "$RUNNER_TEMP/station-container-syft-arm64.cdx.json" --arm64-digest "${{ steps.platforms.outputs.arm64 }}" --container-descriptor release-assets/station-container-release.json --source-sha "$RELEASE_SHA" --output "$RUNNER_TEMP/station-container-sbom-source/station-container-source.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: release-assets/station-container-release.json }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: station-container-release, path: release-assets, if-no-files-found: error, retention-days: 14 }
      - name: Transfer scanner inventory through scratch only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: station-container-sbom-source
          path: ${{ runner.temp }}/station-container-sbom-source
          if-no-files-found: error
          retention-days: 1

  assemble-draft:
    needs: [preflight, desktop-macos, desktop-windows, desktop-linux, portable, android, ios-simulator, ios-device, container]
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        needs.desktop-macos.result == 'success' &&
        needs.desktop-windows.result == 'success' &&
        needs.desktop-linux.result == 'success' &&
        needs.portable.result == 'success' &&
        needs.android.result == 'success' &&
        needs.container.result == 'success' &&
        ((needs.preflight.outputs.channel == 'preview' && needs.ios-simulator.result == 'skipped' && needs.ios-device.result == 'success') ||
         (needs.preflight.outputs.channel == 'stable' && needs.ios-simulator.result == 'success' && needs.ios-device.result == 'success'))
      }}
    runs-on: ubuntu-latest
    environment: native-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      RELEASE_CREATED_AT: ${{ needs.preflight.outputs.created_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.preflight.outputs.sha }}" }
      - name: Setup pinned pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with: { install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - run: npm run dependencies:ci
      - name: Install pinned Rust SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Download producing release assets into scratch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/station-release-producer-artifacts
      - name: Admit only producer release assets, never scanner scratch
        run: |
          mkdir release-assets
          find "$RUNNER_TEMP/station-release-producer-artifacts" -type f -path '*/release-assets/*' -exec cp {} release-assets/ \;
          test ! -e release-assets/station-container-source.json
      - name: Download the descriptor-bound scanner inventory into scratch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: station-container-sbom-source
          path: ${{ runner.temp }}/station-container-sbom-source
      - name: Generate canonical SBOM fragments and assets
        run: |
          fragment_root="$RUNNER_TEMP/station-release-sbom-fragments"
          mkdir -p "$fragment_root"
          # Resolve the production graph from pnpm's authoritative lock, including
          # workspace links and peer-qualified instances, without installed-layout inference.
          node scripts/generate-pnpm-sbom.mjs --output-file "$fragment_root/npm.cyclonedx.json"
          (cd src-desktop && cargo cyclonedx --format json --spec-version 1.5 --target all --override-filename station.cdx)
          test -s src-desktop/station.cdx.json
          cp src-desktop/station.cdx.json "$fragment_root/rust.cyclonedx.json"
          node scripts/release-sbom-fragments.mjs --output-dir "$fragment_root" --npm-cyclonedx "$fragment_root/npm.cyclonedx.json" --rust-cyclonedx "$fragment_root/rust.cyclonedx.json" --container-source "$RUNNER_TEMP/station-container-sbom-source/station-container-source.json" --container-descriptor release-assets/station-container-release.json --source-sha "$RELEASE_SHA"
          node scripts/release-sbom-context.mjs --assets-dir release-assets --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --generated-at "$RELEASE_CREATED_AT" --output "$fragment_root/context.json"
          node scripts/generate-release-sboms.mjs --assets-dir release-assets --fragments-dir "$fragment_root" --context "$fragment_root/context.json" --npm-fragment "$fragment_root/npm.fragment.json" --rust-fragment "$fragment_root/rust.fragment.json" --container-fragment "$fragment_root/container.fragment.json"
          node scripts/release-sbom-predicates.mjs --assets-dir release-assets
      - name: Assemble and validate one deterministic inventory
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PUBLIC_KEY"
          printf '%s\n' "$TAURI_SIGNING_PUBLIC_KEY" > release-assets/station-updater-public-key.txt
          node scripts/release-artifacts.mjs assemble --assets-dir release-assets --output release-assets/station-release-inventory.json --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --generated-at "$RELEASE_CREATED_AT" --sbom-context "$RUNNER_TEMP/station-release-sbom-fragments/context.json" --container-descriptor release-assets/station-container-release.json --updater-public-key release-assets/station-updater-public-key.txt
          node scripts/release-artifacts.mjs validate --assets-dir release-assets --inventory release-assets/station-release-inventory.json --container-descriptor release-assets/station-container-release.json --updater-public-key release-assets/station-updater-public-key.txt
          node scripts/release-sbom-predicates.mjs --assets-dir release-assets
      - name: Attest the inventory and checksum protocol roots
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/station-release-inventory.json
            release-assets/station-release-checksums.txt
            release-assets/station-sbom-portable.cdx.json
            release-assets/station-sbom-desktop.cdx.json
            release-assets/station-sbom-mobile.cdx.json
            release-assets/station-sbom-container.spdx.json
            release-assets/station-updater-public-key.txt
      - name: Create exactly one draft and upload validated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to replace assets under existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Station $RELEASE_TAG" --notes "Validated release inventory; publish through the protected Publish Station release workflow."
          gh release upload "$RELEASE_TAG" release-assets/*
