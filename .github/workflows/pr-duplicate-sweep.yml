name: PR duplicate sweep

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request number to sweep (omit with since to sweep all recent merges).
        required: false
        type: string
      since:
        description: Sweep PRs merged since this ISO date (e.g. 2026-09-24). Defaults to the last 24h on schedule.
        required: false
        type: string
      apply:
        description: Comment the report on each merged PR (report-only either way).
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-duplicate-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Sweep merged PRs for superseded siblings (report-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SWEEP_PR: ${{ inputs.pr }}
          SWEEP_SINCE: ${{ inputs.since }}
          SWEEP_APPLY: ${{ inputs.apply == 'true' && 'true' || 'false' }}
        run: |
          ARGS=(--since "${SWEEP_SINCE:-$(date -u -d '24 hours ago' +%F'T'%H:%M)}")
          if [ -n "$SWEEP_PR" ]; then
            ARGS=(--pr "$SWEEP_PR")
          fi
          if [ "$SWEEP_APPLY" = "true" ]; then
            ARGS+=(--apply)
          fi
          node scripts/pr-duplicate-sweep.mjs "${ARGS[@]}"
