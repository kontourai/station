name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep docs-only secret scanning independent from the heavy CI concurrency
# group, so it cannot cancel browser, fast-check, or container verification.
concurrency:
  group: station-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@28deabbf24f0ab55911d311df5372d30bea0dba4
    with:
      runner: '"ubuntu-22.04"'
    permissions:
      contents: read
