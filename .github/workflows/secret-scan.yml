name: Secret Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep docs-only secret scanning independent from the heavy CI concurrency
# group, so it cannot cancel browser, fast-check, or container verification.
concurrency:
  group: station-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan
    if: github.event_name != 'pull_request'
    uses: kontourai/.github/.github/workflows/secret-scan.yml@02f40a67901a79ce4004c44d91e350b93782644c
    with:
      runner: '"ubuntu-22.04"'
    permissions:
      contents: read
