name: Secret Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep docs-only secret scanning independent from the heavy CI concurrency
# group, so it cannot cancel browser, fast-check, or container verification.
concurrency:
  group: station-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan
    if: github.event_name != 'pull_request'
    uses: kontourai/.github/.github/workflows/secret-scan.yml@02f40a67901a79ce4004c44d91e350b93782644c
    with:
      runner: '["self-hosted","Linux","X64","kontour-linux","heavy-host"]'
      capacity-coordination-root: /mnt/e/kontour-runner-capacity
      capacity-host-id: desktop-win
      capacity-units: 10
      capacity-lease-weight: 1
      capacity-timeout-seconds: 600
      capacity-owner-lifetime-seconds: 7800
    permissions:
      contents: read
