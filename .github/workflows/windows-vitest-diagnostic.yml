name: Windows Full Vitest Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-vitest-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run dependencies:ci
      - name: Run complete serialized Windows Vitest diagnostic
        run: npm run test:windows:diagnostic
      - name: Upload complete redacted Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-full-vitest-${{ github.run_id }}
          path: .kontourai/windows-vitest/
          if-no-files-found: error
          retention-days: 14
