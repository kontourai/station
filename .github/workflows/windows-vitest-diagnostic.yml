name: "Tool: Windows full vitest diagnostic"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-vitest-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, kontour-windows, native]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: kontourai/.github/actions/runner-preflight@1d267a33147d1ce5925ffd1f9aa0ef2063d0d7ef
      - name: Reserve physical host capacity
        uses: kontourai/.github/actions/physical-host-capacity@563effe7ec559c6f4fcc6c80b3532acb71d86373
        with:
          coordination-root: 'E:\kontour-runner-capacity'
          host-id: desktop-win
          capacity-units: "10"
          lease-weight: "9"
          timeout-seconds: "600"
          owner-lifetime-seconds: "7800"
      - name: Setup pinned pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with: { install: false }

      - run: npm run dependencies:ci
      - name: Run complete serialized Windows Vitest diagnostic
        run: npm run test:windows:diagnostic
      - name: Upload complete redacted Windows diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-full-vitest-${{ github.run_id }}
          path: .kontourai/windows-vitest/
          if-no-files-found: error
          retention-days: 14
