name: Main pipeline health

on:
  workflow_run:
    # Self-exclusion is by omission: watching this workflow would recurse.
    workflows:
      - Nightly
      - Container smoke
      - Windows Verification
      - Secret Scan
      - Backlog disposition policy
      - Scheduled dependency advisory floor
      # Chained: Android Tests is itself a workflow_run of the Android build
      # (two levels, within GitHub's limit of three). Its green runs have no
      # skipped jobs, so the close guard below can clear its tracker (#1315).
      - Android Tests
    types: [completed]

permissions:
  # `contents: read` buys exactly one thing: checking out the default branch
  # so report-failure can call scripts/main-health-comment-policy.mjs. It is
  # workflow-level, so close-after-success inherits a read grant it never
  # uses. No write scope beyond issues is granted.
  contents: read
  issues: write

jobs:
  # A fork can also call its branch main; only canonical-repository runs count.
  report-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    concurrency:
      group: main-health-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The comment policy is a module, not inline script, so its five cases
      # are unit-testable without a workflow_run event
      # (scripts/__tests__/main-health-comment-policy.test.ts). Same shape as
      # issue-lifecycle.yml: repository-controlled code, decisions in the
      # module, API calls here — and, like it, a declared trust root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch, never the code of the run being reported on: a
          # policy read from the failing commit would be frozen at whatever it
          # said then. persist-credentials: false — nothing here pushes.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open or update the workflow tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Event values stay data: env indirection prevents injection into JavaScript source.
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { decideMainHealthComment, summarizeRunFailure } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/main-health-comment-policy.mjs`);
            const workflowName = process.env.WORKFLOW_NAME;
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const title = `Main pipeline red: ${workflowName}`;
            const details = [
              `Workflow: ${workflowName}`,
              `Run: ${runUrl}`,
              `Head SHA: ${headSha}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `A required workflow failed on main.\n\n${details}`,
                labels: ['bug', 'P1'],
              });
              return;
            }
            const reopened = existing.state !== 'open';
            if (reopened) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              labels: ['bug', 'P1'],
            });
            // Everything above is the tracker itself and runs first on purpose:
            // by this point the issue exists, is open and is labelled, so a
            // throw below costs one comment rather than the tracker. The jobs
            // call is the same one close-after-success already makes under
            // these permissions.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              per_page: 100,
            });
            const decision = decideMainHealthComment({
              workflowName,
              runUrl,
              headSha,
              failures: summarizeRunFailure(jobs),
              reopened,
              comments,
            });
            core.info(`main-health: ${decision.action} (${decision.reason})`);
            if (decision.action === 'update-marker') {
              // Same failure, inside the heartbeat window: record the run in
              // the marker of the comment that already exists. An edit sends
              // no notification, so a persistent red stops paging anyone.
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: decision.commentId,
                body: decision.body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: decision.body,
            });

  close-after-success:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    # The SAME group as report-failure: both jobs read-modify-write one issue
    # keyed by one title, so they must serialize against each other, not only
    # against themselves. cancel-in-progress stays off — a dropped close is a
    # tracker left open against a green main.
    concurrency:
      group: main-health-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close the workflow tracking issue after a green run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Event values stay data: env indirection prevents injection into JavaScript source.
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const workflowName = process.env.WORKFLOW_NAME;
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const title = `Main pipeline red: ${workflowName}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            // A run conclusion of `success` is not evidence the gate ran.
            // container-smoke.yml's `smoke` job is conditional on changed
            // paths, so a push touching no container files skips it while the
            // RUN still reports success — measured: skipped in 5 of the 5 most
            // recent successful main runs. Closing on that would assert a
            // green that never happened. A tracker can still always be cleared
            // by running the workflow for real (workflow_dispatch executes
            // both jobs).
            const hasSuccessfulJob = jobs.some((job) => job.conclusion === 'success');
            const hasSkippedJob = jobs.some((job) => job.conclusion === 'skipped');
            if (workflowName === 'Nightly') {
              // The incomplete-cohort receipt job and the unused half of the
              // reusable iOS workflow are intentionally skipped even in a
              // completed Nightly. Require the terminal delivery jobs instead
              // of treating those expected skips as missing delivery evidence.
              const requiredJobs = [
                '3 · Publish native cohort / Record ledger and markers',
                '3 · Publish CLI to npm nightly',
                '3 · Stage portable fleet evidence / Admit portable bytes',
              ];
              if (!requiredJobs.every((name) => jobs.some((job) => job.name === name && job.conclusion === 'success'))) return;
            } else if (!hasSuccessfulJob || hasSkippedJob) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: [
                'Closed after a successful run on main.',
                '',
                `Workflow: ${workflowName}`,
                `Run: ${runUrl}`,
                `Head SHA: ${headSha}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            });
