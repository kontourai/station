name: Main pipeline health

on:
  workflow_run:
    # Self-exclusion is by omission: watching this workflow would recurse.
    workflows:
      - Nightly
      - Container smoke
      - Windows Verification
      - Secret Scan
      - Backlog disposition policy
      - Scheduled dependency advisory floor
      # Chained: Android Tests is itself a workflow_run of the Android build
      # (two levels, within GitHub's limit of three). Its green runs have no
      # skipped jobs, so the close guard below can clear its tracker (#1315).
      - Android Tests
    types: [completed]

permissions:
  issues: write

jobs:
  # A fork can also call its branch main; only canonical-repository runs count.
  report-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    concurrency:
      group: main-health-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Open or update the workflow tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Event values stay data: env indirection prevents injection into JavaScript source.
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const workflowName = process.env.WORKFLOW_NAME;
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const title = `Main pipeline red: ${workflowName}`;
            const details = [
              `Workflow: ${workflowName}`,
              `Run: ${runUrl}`,
              `Head SHA: ${headSha}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `A required workflow failed on main.\n\n${details}`,
                labels: ['bug', 'P1'],
              });
              return;
            }
            if (existing.state !== 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              labels: ['bug', 'P1'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `The workflow failed again on main.\n\n${details}`,
            });

  close-after-success:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    # The SAME group as report-failure: both jobs read-modify-write one issue
    # keyed by one title, so they must serialize against each other, not only
    # against themselves. cancel-in-progress stays off — a dropped close is a
    # tracker left open against a green main.
    concurrency:
      group: main-health-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close the workflow tracking issue after a green run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Event values stay data: env indirection prevents injection into JavaScript source.
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const workflowName = process.env.WORKFLOW_NAME;
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const title = `Main pipeline red: ${workflowName}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            // A run conclusion of `success` is not evidence the gate ran.
            // container-smoke.yml's `smoke` job is conditional on changed
            // paths, so a push touching no container files skips it while the
            // RUN still reports success — measured: skipped in 5 of the 5 most
            // recent successful main runs. Closing on that would assert a
            // green that never happened. A tracker can still always be cleared
            // by running the workflow for real (workflow_dispatch executes
            // both jobs).
            const hasSuccessfulJob = jobs.some((job) => job.conclusion === 'success');
            const hasSkippedJob = jobs.some((job) => job.conclusion === 'skipped');
            if (workflowName === 'Nightly') {
              // Recovery and the unused half of the reusable iOS workflow
              // are intentionally skipped even in a completed Nightly.
              // Require the terminal delivery jobs instead of treating those
              // expected skips as missing delivery evidence.
              const requiredJobs = [
                '3 · Publish native cohort / Record ledger and markers',
                '3 · Publish CLI to npm nightly',
                '3 · Stage portable fleet evidence / Admit portable bytes',
              ];
              if (!requiredJobs.every((name) => jobs.some((job) => job.name === name && job.conclusion === 'success'))) return;
            } else if (!hasSuccessfulJob || hasSkippedJob) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: [
                'Closed after a successful run on main.',
                '',
                `Workflow: ${workflowName}`,
                `Run: ${runUrl}`,
                `Head SHA: ${headSha}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            });
