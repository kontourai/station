name: "Main: Health"

on:
  workflow_run:
    # Self-exclusion is by omission: watching this workflow would recurse.
    workflows:
      - "Nightly"
      - "Nightly: Gallery"
      - "Main: Qualification health"
      - "Main: Container smoke"
      - "PR: Secret scan"
      - "Repo: Dependency advisory"
      # Its PR and merge-group runs are not on main and are filtered out by
      # the head_branch guard below; only the daily scheduled run (or a
      # dispatch) on main reports. Its push run went red unnoticed for 8 days.
      - "PR: Security analysis"
      # Chained: Main: Android tests is itself a workflow_run of the Android build
      # (two levels, within GitHub's limit of three). Its green runs have no
      # skipped jobs, so the close guard below can clear its tracker (#1315).
      - "Main: Android tests"
      # Its main push run is the only iOS build of a UI-only change (see
      # build-ios.yml). PR and merge-group runs fail the head_branch guard below;
      # a push run that skipped its build never closes the tracker.
      - "PR: iOS build"
      # Scheduled housekeeping on main. Their scheduled runs skip no job, so
      # a green run closes the tracker; a dry-run dispatch skips the issue
      # jobs and never does. CI throughput health exits 0 for a window that
      # is incomplete only because work was still running, so it reports
      # collection failures, not measurement gaps.
      - "Repo: Docs freshness sweep"
      - "Repo: CI throughput health"
      # Every other scheduled workflow, so a red scheduled run always opens a
      # tracker. scripts/__tests__/scheduled-failure-reporting.test.ts refuses
      # a scheduled workflow that is neither watched here nor on its justified
      # allowlist (the duplicate sweep is on it: its scheduled output is a
      # log line nobody reads). The backlog policy left this list in #2314
      # because it was red by construction on every issue event; it is now a
      # daily audit that fails only on label drift or an unreadable backlog.
      # None of these has a conditional job, so a green run closes its tracker.
      - "Repo: Backlog policy"
      - "Repo: Dated TODO sweep"
      - "Repo: Starved PR report"
      - "Nightly: Fresh-home walkthrough"
      # Its path-filtered main push runs report too: a main push that fails to
      # warm the cache is the same red as the scheduled run.
      - "Nightly: iOS Rust cache"
      # Push-only and path-filtered to confinement code: the only run of the
      # macOS Seatbelt legs, so a red one had no other surface.
      - "Main: Seatbelt kernel legs"
    types: [completed]
    # Both jobs act only on runs whose head branch is main; this filter stops
    # pull-request and merge-group runs from starting a run that only skips.
    # A workflow_run branch filter matches the triggering run's head branch,
    # the same field the job guards read.
    branches: [main]

permissions:
  # `actions: read` is what listJobsForWorkflowRun needs. Both jobs call it —
  # close-after-success to refuse a skip-bearing green, report-failure to name
  # the failing step — and until now it worked only because this repository is
  # public. An undeclared permission that happens to work is a dependency on
  # something nobody wrote down; it would start failing the day the repository
  # went private, in a workflow whose whole job is noticing failure.
  actions: read
  # `contents: read` buys exactly one thing: checking out the default branch
  # so report-failure can call scripts/main-health-comment-policy.mjs. It is
  # workflow-level, so close-after-success inherits two read grants it does
  # not use. No write scope beyond issues is granted.
  contents: read
  # `checks: read` lists a job's annotations (a job id is its check-run id):
  # the `##[error]` lines the tracker quotes, and the only record of WHO
  # cancelled a run — a person, a newer run in the same concurrency group, or
  # GitHub itself because no runner took the job.
  checks: read
  issues: write

jobs:
  # A fork can also call its branch main; only canonical-repository runs count.
  report-failure:
    # `cancelled` starts this job but is reported only when the step below
    # attributes the cancel to GitHub (no runner, runner lost). A person's
    # cancel or a newer run superseding this one in its concurrency group
    # writes nothing. A job-level `if` cannot read annotations, so that
    # decision lives in scripts/main-health-comment-policy.mjs.
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    concurrency:
      group: main-health-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    # The budget covers an actions/checkout of the monorepo, the paginated
    # jobs lookup, at most MAX_ANNOTATED_JOBS annotation reads, the issue scan
    # and the tracker's comment history. A longer bound only delays a
    # genuinely hung run.
    timeout-minutes: 5
    steps:
      # The comment policy is a module, not inline script, so its five cases
      # are unit-testable without a workflow_run event
      # (scripts/__tests__/main-health-comment-policy.test.ts). Same shape as
      # issue-lifecycle.yml: repository-controlled code, decisions in the
      # module, API calls here — and, like it, a declared trust root.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch, never the code of the run being reported on: a
          # policy read from the failing commit would be frozen at whatever it
          # said then. persist-credentials: false — nothing here pushes.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open or update the workflow tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Event values stay data: env indirection prevents injection into JavaScript source.
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const { MAIN_HEALTH_LABELS, classifyCancellation, decideMainHealthComment, failingLines, renderTrackerBody, summarizeRunFailure, unsuccessfulJobs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/main-health-comment-policy.mjs`);
            const workflowName = process.env.WORKFLOW_NAME;
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const event = process.env.RUN_EVENT;
            const conclusion = process.env.RUN_CONCLUSION;
            const title = `Main pipeline red: ${workflowName}`;
            const advisoryOwner = workflowName === 'Repo: Dependency advisory' ? 'briananderson1222' : null;
            // Read the run before any issue write: a cancelled run is reported
            // only when its annotations say GitHub cancelled it.
            let jobs = [];
            const annotations = [];
            let detailsError = null;
            try {
              jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              });
              for (const job of unsuccessfulJobs(jobs)) {
                const { data } = await github.rest.checks.listAnnotations({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: job.id,
                  per_page: 50,
                });
                for (const annotation of data) annotations.push({ ...annotation, job: job.name });
              }
            } catch (error) {
              // Without the annotations a cancel cannot be attributed; fail
              // this run rather than guess either way.
              if (conclusion === 'cancelled') throw error;
              // A failure is reported regardless; the tracker says what is
              // missing and this run still ends red below.
              detailsError = error instanceof Error ? error.message : String(error);
            }
            if (conclusion === 'cancelled') {
              const cause = classifyCancellation(annotations);
              core.info(`main-health: cancelled run attributed to ${cause}`);
              if (cause !== 'infrastructure') {
                if (cause === 'unknown') core.warning(`main-health: ${runUrl} was cancelled with no recognised cause; no tracker written.`);
                return;
              }
            }
            const body = renderTrackerBody({
              workflowName,
              runUrl,
              headSha,
              event,
              conclusion,
              failures: summarizeRunFailure(jobs),
              lines: failingLines(annotations),
              detailsError,
              notes: advisoryOwner ? [
                `Owner: @${advisoryOwner} (dependency-policy CODEOWNER).`,
                'Action: inspect the advisory report in the linked run, separate disclosed findings from scan/registry errors, and coordinate one compatible dependency repair. Do not renew exceptions or retry feature PRs to hide this result.',
                'Preview/Stable publication remains blocked by its own fresh exact-source scan; feature and Nightly builds do not run advisory scans.',
              ] : [],
            });
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [...MAIN_HEALTH_LABELS],
                ...(advisoryOwner ? { assignees: [advisoryOwner] } : {}),
              });
            } else {
              if (advisoryOwner) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  assignees: [advisoryOwner],
                });
              }
              const reopened = existing.state !== 'open';
              // The body always describes the latest red run, so whoever (or
              // whatever agent) picks the tracker up reads current evidence.
              // An edit sends no notification; the comment policy below
              // decides when anyone is told.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                ...(reopened ? { state: 'open' } : {}),
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                labels: [...MAIN_HEALTH_LABELS],
              });
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                per_page: 100,
              });
              const decision = decideMainHealthComment({
                workflowName,
                runUrl,
                headSha,
                failures: summarizeRunFailure(jobs),
                reopened,
                comments,
              });
              core.info(`main-health: ${decision.action} (${decision.reason})`);
              if (decision.action === 'update-marker') {
                // Same failure, inside the heartbeat window: record the run in
                // the marker of the comment that already exists. An edit sends
                // no notification, so a persistent red stops paging anyone.
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: decision.commentId,
                  body: decision.body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: decision.body,
                });
              }
            }
            if (detailsError) throw new Error(`Tracker written without run details: ${detailsError}`);

  close-after-success:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    # The SAME group as report-failure: both jobs read-modify-write one issue
    # keyed by one title, so they must serialize against each other, not only
    # against themselves. cancel-in-progress stays off — a dropped close is a
    # tracker left open against a green main.
    concurrency:
      group: main-health-${{ github.event.workflow_run.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close the workflow tracking issue after a green run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # Event values stay data: env indirection prevents injection into JavaScript source.
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const workflowName = process.env.WORKFLOW_NAME;
            const runUrl = process.env.RUN_URL;
            const headSha = process.env.HEAD_SHA;
            const title = `Main pipeline red: ${workflowName}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            // A run conclusion of `success` is not evidence the gate ran.
            // container-smoke.yml's `smoke` job is conditional on changed
            // paths, so a push touching no container files skips it while the
            // RUN still reports success — measured: skipped in 5 of the 5 most
            // recent successful main runs. Closing on that would assert a
            // green that never happened. A tracker can still always be cleared
            // by running the workflow for real (workflow_dispatch executes
            // both jobs).
            const hasSuccessfulJob = jobs.some((job) => job.conclusion === 'success');
            const hasSkippedJob = jobs.some((job) => job.conclusion === 'skipped');
            if (workflowName === 'Nightly') {
              // The incomplete-cohort receipt job and the unused half of the
              // reusable iOS workflow are intentionally skipped even in a
              // completed Nightly. Require the terminal delivery jobs instead
              // of treating those expected skips as missing delivery evidence.
              const requiredJobs = [
                '3 · Publish native cohort / Record ledger and markers',
                '3 · Publish CLI to npm nightly',
                '3 · Stage portable fleet evidence / Admit portable bytes',
              ];
              if (!requiredJobs.every((name) => jobs.some((job) => job.name === name && job.conclusion === 'success'))) return;
            } else if (workflowName === 'Nightly: Gallery') {
              // API image review is optional; only the capture and exact diff
              // settle a pixel-drift tracker.
              if (!jobs.some((job) => job.name === 'Capture and diff screenshot gallery' && job.conclusion === 'success')) return;
            } else if (workflowName === 'PR: Security analysis') {
              // Dependency review runs only on PR and merge-group events, so a
              // main run always skips it. Only the analysis itself settles a
              // CodeQL tracker.
              if (!jobs.some((job) => job.name === 'CodeQL JavaScript and TypeScript' && job.conclusion === 'success')) return;
            } else if (!hasSuccessfulJob || hasSkippedJob) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: [
                'Closed after a successful run on main.',
                '',
                `Workflow: ${workflowName}`,
                `Run: ${runUrl}`,
                `Head SHA: ${headSha}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            });
