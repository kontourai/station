name: Hosted full regression

# One implementation of the expensive completion gate, consumed only by
# explicit/manual verification and by artifact-promotion workflows. It has no
# push, pull_request, pull_request_target, merge_group, or schedule trigger.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character lowercase commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-regression:
    name: Exact-SHA full regression
    concurrency:
      group: hosted-full-regression-${{ inputs.source_sha }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    # Every phase gets its own fail-closed deadline; their sum is the
    # canonical 251-minute phase plan (scripts/verification-lanes.mjs
    # FULL_REGRESSION_TIMEOUT_MS). Literally every step before and after
    # that gate now carries an explicit deadline, including the two local,
    # network-free bash checks: source-SHA validation 2m, checkout 10m,
    # checkout-matches proof 2m, setup-node 5m, actionlint 5m (mirrored in
    # ci.yml's fast-checks copy so the two stay identical), dependencies:ci
    # 15m, the 5-minute zsh step, the 20-minute Chromium step, the verdict
    # report 2m, the receipt upload 10m = 76m bounded setup and publication.
    # 340 keeps real margin over that 327-minute bounded worst case rather
    # than interrupting a valid final phase slice or a completed gate's
    # receipt upload.
    timeout-minutes: 340
    steps:
      - name: Validate immutable source identity
        timeout-minutes: 2
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be exactly 40 lowercase hexadecimal characters."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove checkout matches the requested source
        timeout-minutes: 2
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 5
        with:
          node-version-file: .nvmrc

      # `full:regression` runs `gate:workflows`, and `actionlint-gate.mjs` is
      # fail-closed: with no `actionlint` on PATH it exits 2 rather than
      # reporting an unvalidated surface as a pass. Provisioning it here is
      # what lets that gate actually validate, instead of failing the lane.
      # `actionlint-gate.mjs` pins this copy through
      # `fullRegressionActionlintFindings`, so it cannot drift from ci.yml's.
      - name: Install pinned actionlint
        timeout-minutes: 5
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - run: npm run dependencies:ci
        timeout-minutes: 15

      - name: Provision and preflight zsh for process-heavy installer fixtures
        timeout-minutes: 5
        run: |
          if [[ ! -x /bin/zsh ]]; then
            sudo apt-get update
            sudo apt-get install --yes zsh
          fi
          command -v zsh
          test -x /bin/zsh
          /bin/zsh --version

      - name: Install Chromium for full-corpus browser assertions
        timeout-minutes: 20
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" timeout 360 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt $attempt timed out or failed; retrying"
            sleep 15
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      - name: Run canonical completion gate
        # `id` is what lets the report step below read this step's own
        # outcome. A gate that dies before printing its verdict writes to
        # stderr and exits non-zero; the tee'd stdout then holds only npm
        # banners, and without the outcome the report would call that a
        # parsing problem instead of a failed run.
        id: gate
        # This command already composes required Veritas repo-governance and
        # the complete profiled Vitest corpus. `test:connected-agents` is a
        # focused subset of that corpus; the former manual CI follow-up was
        # duplicate diagnostic evidence, not an additional promotion gate.
        #
        # `tee` keeps the gate's output streaming into the live job log while
        # retaining a copy for the summary step below. `set -o pipefail` is
        # what makes that safe and is NOT the default for a GitHub `run` block
        # (`bash -e {0}`): without it the pipeline would report `tee`'s status
        # and a red gate would pass the job. It is stated here, in the step, so
        # a reader can see the exit status is still the gate's own.
        run: |
          set -o pipefail
          npm run full:regression | tee "$RUNNER_TEMP/full-regression.stdout.log"

      # The gate already prints one bounded JSON verdict document naming the
      # terminal status, counts and causal excerpts. Until now nothing consumed
      # it, so `gh run view --log-failed` and the Summary tab showed only
      # "Process completed with exit code 1" and the excerpt lived only inside
      # the artifact uploaded below (#1459). This step renders it into the run
      # summary and the annotations rail. It always exits 0 and never decides
      # the verdict -- the gate step above already did that.
      - name: Report the completion gate verdict
        if: always()
        timeout-minutes: 2
        run: |
          node scripts/verification-gate-summary.mjs \
            --stdout-file "$RUNNER_TEMP/full-regression.stdout.log" \
            --gate-outcome "${{ steps.gate.outcome }}"

      - name: Retain exact-SHA completion receipts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-regression-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            .kontourai/verification-receipts/
            .kontourai/verification-output/
            .kontourai/verification-phase-records/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
