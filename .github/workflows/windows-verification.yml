name: Windows Verification

# This is the supported native-Windows portable floor, not full Vitest parity.
# The complete Windows corpus remains a failing diagnostic tracked by #1420.
# Browser E2E also remains outside this lane; full browser coverage belongs to
# CI Extended on Ubuntu.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-verification.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'biome.json'
      - 'tsconfig*.json'
      - 'scripts/**'
      - 'src-server/**'
      - 'src-shared/**'
      - 'src-ui/**'
      - 'packages/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: windows-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-floor:
    if: github.event_name != 'pull_request'
    name: Windows static and portable test floor (no full Vitest/E2E)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: npm run dependencies:ci

      - name: Verify verification policy contract
        run: npm run verification:policy:gate

      - name: Run bounded Windows portable floor
        # This includes the deterministic pre-push corpus plus the physical-
        # Windows-proven OpenSSH argv, cleanup, and broken-pipe contracts. Its
        # pre-push bootstrap also builds the static workspace prerequisites
        # consumed by the typecheck below.
        # It must not be presented as the still-red full corpus (#1420).
        run: npm run test:windows:portable

      - name: Typecheck Station contracts
        run: npm run typecheck

      - name: Run focused static ratchets
        run: npm run gate:naming && npm run gate:ui-contracts

      - name: Upload coordinated verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Diagnostics: a storage/quota failure here is an infrastructure
        # condition, not a verdict on the code. It must not redden a job
        # whose work passed (station#2218).
        continue-on-error: true
        with:
          name: windows-verification-${{ github.run_id }}
          path: |
            .kontourai/verification-receipts/
            .kontourai/verification-output/
          if-no-files-found: ignore
          retention-days: 14
