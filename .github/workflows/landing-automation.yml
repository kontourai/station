name: "Repo: Landing automation"

on:
  pull_request_target:
    branches: [main]
    types: [labeled, ready_for_review, reopened, dequeued]
  workflow_run:
    workflows: ["PR: CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  arm:
    # Concurrency lives on this job, not the workflow: a run whose arm job is
    # skipped (another label, a red or queue CI run, a dequeue) then never
    # enters the group, so it cannot replace a pending real arm run and skip.
    # GitHub keeps one pending run per group; each arm run re-reads the live
    # PR, so a replaced pending run loses nothing. Keyed by the same-repository
    # head branch, which both event types carry for the same PR.
    # One sequence lost serialization: a dequeue run and a label arm run for
    # the same PR, once one workflow group, now run concurrently. Both re-read
    # the live PR and arm only with --match-head-commit, so the worst case is
    # a redundant arm request for the same head, which GitHub accepts as a
    # no-op.
    concurrency:
      group: landing-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    if: >-
      ${{ (github.event_name == 'pull_request_target' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.action != 'dequeued' &&
           (github.event.action != 'labeled' || github.event.label.name == 'station-autoland')) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'pull_request_target' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.STATION_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.STATION_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: station
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Arm explicitly opted-in PRs once
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: node scripts/landing-automation.mjs

  # #3101 C/E: explain a merge-queue removal on the PR and re-arm an opted-in
  # PR once when it merges cleanly with main. Trusted base policy only: the
  # candidate head is fetched as Git objects for `git merge-tree`, never
  # checked out or executed. The checkout matches this trusted workflow revision.
  dequeue:
    if: ${{ github.event_name == 'pull_request_target' && github.event.action == 'dequeued' }}
    # One report at a time per PR. GitHub keeps only the newest pending run
    # in a group, so a burst can drop a middle run. Each run reports the
    # PR's latest timeline removal, not its own event's.
    concurrency:
      group: landing-dequeue-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.STATION_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.STATION_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: station
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Explain the removal once
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          COMMENT_AUTHOR: ${{ steps.token.outputs.app-slug }}[bot]
        run: node scripts/merge-queue-dequeue.mjs
