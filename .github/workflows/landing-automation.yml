name: "Repo: Landing automation"

on:
  pull_request_target:
    branches: [main]
    types: [labeled, ready_for_review, reopened]
  workflow_run:
    workflows: ["PR: CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: landing-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  arm:
    if: >-
      ${{ (github.event_name == 'pull_request_target' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           (github.event.action != 'labeled' || github.event.label.name == 'station-autoland')) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'pull_request_target' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ vars.STATION_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.STATION_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: station
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Arm explicitly opted-in PRs once
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: node scripts/landing-automation.mjs
