name: CI Fast candidate proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-candidate-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, kontour-linux, heavy-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: kontourai/.github/actions/runner-preflight@1d267a33147d1ce5925ffd1f9aa0ef2063d0d7ef

      - name: Reserve physical host capacity
        uses: kontourai/.github/actions/physical-host-capacity@563effe7ec559c6f4fcc6c80b3532acb71d86373
        with:
          coordination-root: /mnt/e/kontour-runner-capacity
          host-id: desktop-win
          capacity-units: "10"
          lease-weight: "1"
          timeout-seconds: "300"
          owner-lifetime-seconds: "7800"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - run: npm run dependencies:ci

      - name: Dependency advisory floor
        run: npm run audit:policy

      - name: Run exact candidate fast lane
        env:
          STATION_CI_FAST_BASE: origin/main
        run: npm run ci:fast

      - name: Upload bounded fast-feedback diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ci-fast-candidate-proof-${{ github.run_id }}
          path: |
            .kontourai/verification-receipts/
            .kontourai/verification-output/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
