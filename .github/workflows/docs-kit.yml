name: "Main: Docs kit"

# Advisory @kontourai/docs-kit gate over docs-kit.json: manifest, links and
# anchors, reachability, and topics. It is deliberately not a required check.
#
# It runs after merge, not on pull requests or merge-queue entries, because
# the org reusable workflow does not yet fit Station's candidate topology
# (scripts/actionlint-gate.mjs):
# - candidate-controlled pull_request workflows are prohibited, and the
#   reusable workflow has no ref input, so under pull_request_target it would
#   check out and validate main rather than the candidate;
# - pull-request and merge-queue jobs may call only remote workflows reviewed
#   for cache writes, and its actions/setup-node step does not set
#   `package-manager-cache: false`, which Station requires of setup-node there.
# Until the reusable workflow covers both, run `docs-kit check` locally before
# a pull request (docs/guides/documentation.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-docs-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Docs kit gate
    # kontourai/.github main at "chore(docs): pin docs-kit v0.3.0 (#49)".
    uses: kontourai/.github/.github/workflows/docs-gate.yml@f9ed64bc32b905451ed81d458d770ff09da2ed96
    with:
      # The docs-kit commit pages.yml publishes the bundle with (v0.4.0).
      docs-kit-ref: 6945efbe0309bc46ce4efafe0fccaff9b3302603
    permissions:
      contents: read
