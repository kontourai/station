name: "Repo: Docs freshness sweep"

# #2923: pull requests re-review the documentation records their own diff
# makes stale (scoped freshness), and the merge queue only reports staleness,
# so one PR can never be dequeued for another PR's change. Records staled by
# a combination of merges are caught here instead: this job runs the catch-up
# report on main and keeps ONE tracking issue current. It never fails a
# required check and never edits the ledger.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the report without writing the tracking issue.
        required: false
        default: 'true'
        type: string

permissions:
  contents: read

concurrency:
  group: docs-freshness-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Catch-up walks history back to the ledger's coverage baseline.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Report stale documentation reviews
        run: node scripts/docs-freshness-sweep.mjs --report .artifacts/docs-freshness-report.md
      - name: Print report (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false'
        run: cat .artifacts/docs-freshness-report.md
      - name: Upsert tracking issue
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/docs-freshness-sweep.mjs --upsert --report .artifacts/docs-freshness-report.md --repo "$REPOSITORY"
