name: "Main: Container smoke"

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    name: Exact full-diff classification
    # Classifies a diff with one node script so container-only changes still
    # skip the smoke job. Hosted because the public repo has free GitHub-hosted
    # minutes; this job does not need desktop-win.
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 10
    outputs:
      container: ${{ steps.classify.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - id: classify
        name: Classify the complete before..sha diff
        env:
          BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          AFTER: ${{ github.sha }}
        run: node scripts/classify-ci-change.mjs --before "$BEFORE" --after "$AFTER" >> "$GITHUB_OUTPUT"

  smoke:
    needs: classify
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.classify.outputs.container == 'true')
    # Never cancel a running smoke: the job takes 20+ minutes and the merge
    # queue lands a non-docs entry every ~18, so cancelling on push meant
    # only the last commit of a burst ever got a verdict (17 cancelled main
    # runs on 2026-09-01 alone, each the only run for its commit, including
    # the first two carrying the #917 fix).
    # Without cancel the group still keeps at most one pending run, so the
    # latest main is verified next. Main: Health ignores a run superseded in
    # this group and reports one GitHub cancelled for lack of a runner.
    concurrency:
      group: container-smoke-${{ github.ref }}
      cancel-in-progress: false
    # GitHub-hosted: the self-hosted heavy Linux listener this job used to
    # require has been offline since at least 2026-11-14, so every run queued
    # until a newer landing superseded it and none ever reached a runner. The
    # hosted image ships Docker and Compose; Chromium is installed below.
    # There is no shared physical host left to lease, so the capacity
    # reservation and the per-host Docker client isolation went with it.
    # (Run 33228038600's device-pairing timeout, once blamed on the hosted
    # environment, was the anonymous-browser premise gap fixed in #917.)
    runs-on: ubuntu-22.04
    # The smoke took 20-25 minutes on the fleet host; the hosted runner is
    # slower to build the image. A red past this bound is a timed_out run,
    # which Main: Health reports.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report runner capacity
        # Disk is the hosted runner's tightest resource for an image build;
        # print it so a disk-full failure is diagnosable from the log alone.
        run: |
          df -h / "$RUNNER_TEMP"
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Setup pinned pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with: { install: false }

      - run: npm run dependencies:ci
      - name: Install repo-pinned Chromium
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" npx playwright install chromium
      - name: Build, pair, persist, and clean up
        env:
          STATION_RELEASE_SHA: ${{ github.sha }}
          STATION_RELEASE_REF: v0.0.0-rc.1
          STATION_RELEASE_CREATED_AT: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: scripts/container-smoke.sh
      - name: Verify public-ingress protocol and port isolation
        run: node deploy/public-ingress/smoke.mjs
      # A red smoke with no trace or screenshot is undiagnosable from logs
      # alone (#917's investigation had zero artifacts to read).
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-smoke-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
