name: Container smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  classify:
    name: Exact full-diff classification
    # Classifies a diff with one node script so container-only changes still
    # skip the smoke job. Hosted because the public repo has free GitHub-hosted
    # minutes; this job does not need desktop-win.
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 10
    outputs:
      container: ${{ steps.classify.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - id: classify
        name: Classify the complete before..sha diff
        env:
          BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          AFTER: ${{ github.sha }}
        run: node scripts/classify-ci-change.mjs --before "$BEFORE" --after "$AFTER" >> "$GITHUB_OUTPUT"

  smoke:
    needs: classify
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.classify.outputs.container == 'true')
    # Never cancel a running smoke: the job takes 20+ minutes and the merge
    # queue lands a non-docs entry every ~18, so cancelling on push meant
    # only the last commit of a burst ever got a verdict (17 cancelled main
    # runs on 2026-09-01 alone, each the only run for its commit, including
    # the first two carrying the #917 fix).
    # Without cancel the group still keeps at most one pending run, so the
    # latest main is verified next; main-health ignores `cancelled` runs.
    concurrency:
      group: container-smoke-${{ github.ref }}
      cancel-in-progress: false
    # The fleet listener provides docker + playwright. (Run 33228038600's
    # device-pairing timeout, once blamed on the github-hosted environment
    # here, was actually the anonymous-browser premise gap fixed in #917 —
    # the runner move neither caused nor fixed it.)
    runs-on: [self-hosted, Linux, X64, kontour-linux, heavy-host, docker, playwright]
    # Budget = the longest capacity wait below (45 min) + the smoke itself
    # (~20-25 min) + margin. Raising the wait without raising this only moves
    # the failure from the reserve step to the job timeout.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kontourai/.github/actions/runner-preflight@1d267a33147d1ce5925ffd1f9aa0ef2063d0d7ef
        with:
          require-docker: "true"
      - name: Reserve physical host capacity
        uses: kontourai/.github/actions/physical-host-capacity@563effe7ec559c6f4fcc6c80b3532acb71d86373
        with:
          coordination-root: /mnt/e/kontour-runner-capacity
          host-id: desktop-win
          capacity-units: "10"
          lease-weight: "9"
          # Weight 9 of 10 is admitted only once every other desktop-win
          # lease has drained, and the Windows PR floor (weight 5, ~18 min,
          # 45-minute budget) runs on every PR. A 600s wait therefore timed
          # out whenever a floor run was mid-flight (run 33589882367, a
          # main red with no code cause). Wait out the floor's full budget.
          timeout-seconds: "2700"
          owner-lifetime-seconds: "7800"
      - id: isolate-docker
        name: Isolate Docker client state
        # Persistent WSL hosts may also use Docker Desktop interactively. Keep
        # CI independent from its credential helper and Windows logon state.
        run: |
          umask 077
          docker_config="$(mktemp -d "$RUNNER_TEMP/station-docker-config.XXXXXX")"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Setup pinned pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with: { install: false }

      - run: npm run dependencies:ci
      - name: Install repo-pinned Chromium
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" npx playwright install chromium
      - name: Build, pair, persist, and clean up
        env:
          STATION_RELEASE_SHA: ${{ github.sha }}
          STATION_RELEASE_REF: v0.0.0-preview.1
          STATION_RELEASE_CREATED_AT: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: scripts/container-smoke.sh
      # A red smoke with no trace or screenshot is undiagnosable from logs
      # alone (#917's investigation had zero artifacts to read).
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-smoke-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove isolated Docker client state
        # Only when the isolate step ran: if the capacity reservation failed,
        # DOCKER_CONFIG was never set and the refusal below reported
        # `Refusing unexpected DOCKER_CONFIG:` as the job's last error,
        # burying the real one (the same run above).
        if: always() && steps.isolate-docker.outcome == 'success'
        run: |
          case "$DOCKER_CONFIG" in
            "$RUNNER_TEMP"/station-docker-config.*) rm -rf -- "$DOCKER_CONFIG" ;;
            *) echo "Refusing unexpected DOCKER_CONFIG: $DOCKER_CONFIG" >&2; exit 1 ;;
          esac
