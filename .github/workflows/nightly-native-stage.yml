name: Nightly native staging

# Phase one of the native cohort: the caller supplies an already source-gated
# revision, and this workflow reserves the cohort identity, then builds, signs,
# and stages the Android AAB, the notarized macOS assets, and the signed iOS
# package as run artifacts with content-bound stage receipts. Nothing here
# publishes: no Play upload, no release asset, no tag move, no TestFlight
# upload, no ledger write. It therefore needs only the fast source gate, and
# runs in parallel with the canonical full-regression receipt that phase two
# (`nightly-native-cohort.yml`) requires before admitting or promoting any
# staged byte.
on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      rebuild_index: { required: false, type: string }
    outputs:
      build:
        description: Whether this exact source allocated a native cohort.
        value: ${{ jobs.plan-cohort.outputs.build }}
      source_sha:
        description: Exact source shared by every native delivery leg.
        value: ${{ jobs.plan-cohort.outputs.source_sha }}
      marketing_version:
        description: Numeric App Store marketing version from package identity.
        value: ${{ jobs.plan-cohort.outputs.marketing_version }}
      bundle_version:
        description: Monotonic native bundle/version code reserved for the cohort.
        value: ${{ jobs.plan-cohort.outputs.bundle_version }}
      reservation_tag:
        description: Immutable authority tag binding the reserved native version.
        value: ${{ jobs.plan-cohort.outputs.reservation_tag }}

permissions:
  contents: read

jobs:
  plan-cohort:
    name: Plan cohort (reserve version code)
    if: ${{ github.ref == 'refs/heads/main' && inputs.source_sha == github.sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
      source_sha: ${{ steps.source.outputs.sha }}
      marketing_version: ${{ steps.ios_identity.outputs.marketing_version }}
      bundle_version: ${{ steps.allocate.outputs.version_code }}
      reservation_tag: ${{ steps.allocate.outputs.reservation_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Re-bind the caller's exact source
        run: |
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$source_sha" = "${{ inputs.source_sha }}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Validate requested rebuild index
        env:
          NIGHTLY_REBUILD_INDEX: ${{ inputs.rebuild_index }}
        run: node --input-type=module -e 'import { parseNightlyRebuildIndex } from "./scripts/lib/nightly-build-identity.mjs"; parseNightlyRebuildIndex(process.env.NIGHTLY_REBUILD_INDEX);'
      - name: Fail closed when durable native recovery is pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          lock_ref='refs/tags/nightly-recovery-lock'
          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GITHUB_TOKEN" --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/nightly-recovery-lock")
          case "$status" in
            404) rm -f "$response" ;;
            200)
              tag_sha=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1])); if(value.ref!==process.argv[2]||value.object?.type!=="tag"||!/^[0-9a-f]{40}$/.test(value.object?.sha??"")) process.exit(1); process.stdout.write(value.object.sha)' "$response" "$lock_ref")
              tag_object=$(mktemp)
              tag_status=$(curl --silent --show-error --output "$tag_object" --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GITHUB_TOKEN" --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
              test "$tag_status" = 200
              locked_source=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1])); if(value.object?.type!=="commit"||!/^[0-9a-f]{40}$/.test(value.object?.sha??"")) process.exit(1); process.stdout.write(value.object.sha)' "$tag_object")
              node scripts/release-cohort-workflow.mjs assert-recovery-tag-object "$tag_object" "$locked_source"
              rm -f "$response" "$tag_object"
              echo "Native cohort recovery lock $lock_ref is valid and authoritative for $locked_source (current source is $SOURCE_SHA). Owner reconciliation must inspect the durable recovery receipt, reconcile provider and durable completion state, then explicitly remove the lock before another cohort can allocate." >&2
              exit 1
              ;;
            *) cat "$response" >&2; rm -f "$response"; echo "Unable to determine durable native recovery lock state (HTTP $status)." >&2; exit 1 ;;
          esac
      - name: Fail closed when a prior promotion fence is pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fence_ref='refs/tags/nightly-promotion-fence'
          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GITHUB_TOKEN" --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/nightly-promotion-fence")
          case "$status" in
            404) rm -f "$response" ;;
            200)
              tag_sha=$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const value=JSON.parse(readFileSync(process.argv[1])); if(value.ref!==process.argv[2]||value.object?.type!=="tag"||!/^[0-9a-f]{40}$/.test(value.object?.sha??"")) process.exit(1); process.stdout.write(value.object.sha)' "$response" "$fence_ref")
              tag_object=$(mktemp)
              tag_status=$(curl --silent --show-error --output "$tag_object" --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GITHUB_TOKEN" --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
              test "$tag_status" = 200
              node scripts/release-cohort-workflow.mjs assert-promotion-fence-tag-object "$tag_object"
              rm -f "$response" "$tag_object"
              echo "Native cohort promotion fence $fence_ref is valid and authoritative. An earlier cohort may still have provider effects; owner reconciliation must finish it or explicitly remove the fence before another cohort can allocate." >&2
              exit 1
              ;;
            *) cat "$response" >&2; rm -f "$response"; echo "Unable to determine native promotion fence state (HTTP $status)." >&2; exit 1 ;;
          esac
      - id: decide
        name: Decide one cohort rather than independent native ships
        run: |
          head_sha=$(git rev-parse HEAD)
          android_sha=$(git rev-parse --verify --quiet 'refs/tags/nightly^{commit}' || true)
          desktop_sha=$(git rev-parse --verify --quiet 'refs/tags/nightly-desktop^{commit}' || true)
          normalized_android_sha=$(node scripts/normalize-deploy-ledger-head.mjs --head-sha "$head_sha" --stop-sha "$android_sha")
          normalized_desktop_sha=$(node scripts/normalize-deploy-ledger-head.mjs --head-sha "$head_sha" --stop-sha "$desktop_sha")
          if [ "$normalized_android_sha" = "$android_sha" ] && [ "$normalized_desktop_sha" = "$desktop_sha" ] && [ -z "${{ inputs.rebuild_index }}" ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'No native cohort is needed for this source.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.build == 'true'
        with: { node-version-file: .nvmrc }
      - id: allocate
        name: Reserve the Android version before either stage starts
        if: steps.decide.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_REQUESTED_BUILD: ${{ inputs.rebuild_index }}
        run: |
          set -euo pipefail
          NIGHTLY_NOW="$(date -u +%Y-%m-%dT00:00:00Z)"
          export NIGHTLY_NOW
          reservation_remote="https://github.com/${{ github.repository }}"
          reservation_created=false
          for attempt in $(seq 1 100); do
            echo "Nightly reservation attempt $attempt"
            NIGHTLY_RESERVED_TAGS="$(git ls-remote --refs "$reservation_remote" 'refs/tags/nightly-version-code/*')"
            export NIGHTLY_RESERVED_TAGS
            allocation_output=$(mktemp)
            allocation=$(GITHUB_OUTPUT="$allocation_output" node scripts/allocate-nightly-version-code.mjs)
            printf '%s\n' "$allocation"
            tag=$(printf '%s\n' "$allocation" | awk -F= '$1 == "reservation_tag" { print $2 }')
            build=$(printf '%s\n' "$allocation" | awk -F= '$1 == "build" { print $2 }')
            code=$(printf '%s\n' "$allocation" | awk -F= '$1 == "version_code" { print $2 }')
            test -n "$tag" && test -n "$build" && test -n "$code"
            reservation_ref="refs/tags/$tag"
            body=$(node --input-type=module -e 'process.stdout.write(JSON.stringify({ref: process.argv[1], sha: process.argv[2]}))' "$reservation_ref" "${{ steps.source.outputs.sha }}")
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GITHUB_TOKEN" --url "$GITHUB_API_URL/repos/${{ github.repository }}/git/refs" --data "$body")
            if ! classification=$(node scripts/classify-nightly-reservation-response.mjs "$status" "$response" "$reservation_ref" "${{ steps.source.outputs.sha }}"); then
              rm -f "$allocation_output" "$response"; exit 1
            fi
            if [ "$classification" = created ]; then
              { echo "date=$NIGHTLY_NOW"; echo "build=$build"; echo "version_code=$code"; echo "reservation_tag=$tag"; } >> "$GITHUB_OUTPUT"
              rm -f "$allocation_output" "$response"; reservation_created=true; break
            fi
            if [ "$classification" = reference-already-exists ]; then
              rm -f "$allocation_output" "$response"; continue
            fi
            rm -f "$allocation_output" "$response"; exit 1
          done
          test "$reservation_created" = true || { echo '::error::Nightly version-code reservation did not converge after 100 attempts.'; exit 1; }
      - id: ios_identity
        name: Derive the shared App Store marketing version
        if: steps.decide.outputs.build == 'true'
        run: |
          marketing_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          [[ "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
      - name: Produce the content-bound cohort plan
        if: steps.decide.outputs.build == 'true'
        run: |
          node scripts/release-cohort-workflow.mjs plan-input plan-input.json "${{ steps.source.outputs.sha }}" "$GITHUB_RUN_ID" "${{ steps.allocate.outputs.date }}" "${{ steps.allocate.outputs.build }}"
          node scripts/release-cohort.mjs plan plan-input.json > cohort-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.decide.outputs.build == 'true'
        with:
          name: nightly-cohort-plan-${{ github.run_id }}
          path: cohort-plan.json
          if-no-files-found: error
          retention-days: 14

  stage-android:
    name: Build Android (sign arm64 AAB + APK)
    needs: plan-cohort
    if: ${{ github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && needs.plan-cohort.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    environment: native-release
    timeout-minutes: 100
    permissions: { contents: read, id-token: write, attestations: write }
    env:
      GCP_PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_PLAY_SERVICE_ACCOUNT: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-cohort.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-cohort-plan-${{ github.run_id }}
          path: cohort
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        # Nightly ships arm64-v8a only (#1456). The trade: 32-bit ARM devices
        # and x86_64 emulators can no longer install the Nightly channel; every
        # Nightly tester device is arm64, and the four-ABI build cost nine
        # cargo rounds per night. Quoted because a flow-map comma list is
        # parsed as separate keys and the action then installs one target.
        with: { targets: 'aarch64-linux-android' }
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-desktop
          key: android-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "ndk;27.0.12077973" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
      - name: Fail closed before Android signing
        run: |
          for name in GCP_PLAY_WORKLOAD_IDENTITY_PROVIDER GCP_PLAY_SERVICE_ACCOUNT ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_CERT_SHA256; do test -n "${!name}" || { echo "missing $name" >&2; exit 1; }; done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: google_auth
        with:
          workload_identity_provider: ${{ env.GCP_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        id: android_signing
        with:
          secrets: |-
            keystore_base64:kontourai-station-release/station-android-upload-keystore-base64
            keystore_password:kontourai-station-release/station-android-upload-keystore-password
      - name: Build and verify the signed Android staging bytes
        env:
          ANDROID_KEYSTORE_BASE64: ${{ steps.android_signing.outputs.keystore_base64 }}
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ steps.android_signing.outputs.keystore_password }}
          TAURI_ANDROID_KEY_ALIAS: ${{ env.ANDROID_UPLOAD_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ steps.android_signing.outputs.keystore_password }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$TAURI_ANDROID_KEYSTORE_PASSWORD"
          npm run dependencies:ci && npm run build:sdk && npm run build:connect
          code=$(node -e 'console.log(require("./cohort/cohort-plan.json").versionIdentities.android.versionCode)')
          day=$((code / 100)); build=$((code % 100))
          date=$(node -e 'console.log(new Date(Date.UTC(2020,0,1)+Number(process.argv[1])*86400000).toISOString())' "$day")
          node scripts/lib/nightly-build-identity.mjs --package-json package.json --tauri-config src-desktop/tauri.conf.json --date "$date" --build "$build" --output "$RUNNER_TEMP/tauri.nightly.conf.json"
          node scripts/reset-android-generated-project.mjs
          (cd src-desktop && npx tauri android init --ci --skip-targets-install --config "$RUNNER_TEMP/tauri.nightly.conf.json")
          # Freeze the source-owned client record before copying it into the
          # Android assets. Tauri's later beforeBuildCommand receives the
          # reuse lease below, so it cannot sample a newer builtAt value.
          node scripts/write-native-client-build-manifest.mjs
          node scripts/apply-android-release-signing.mjs
          node scripts/apply-android-channel-icons.mjs nightly
          node scripts/apply-android-native-bootstrap.mjs
          node scripts/write-android-build-manifest.mjs
          keystore="$RUNNER_TEMP/station-nightly.keystore"; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          export TAURI_ANDROID_KEYSTORE_PATH="$keystore" NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          version=$(node -e 'console.log(require("./cohort/cohort-plan.json").versionIdentities.android.versionName)')
          (cd src-desktop && STATION_BUILD_VERSION="$version" STATION_CLIENT_BUILD_REUSE=1 RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384' npx tauri android build --aab --apk --target aarch64 --config "$RUNNER_TEMP/tauri.nightly.conf.json")
          mkdir -p cohort-android
          cp src-desktop/gen/android/app/build/outputs/bundle/universalRelease/*.aab cohort-android/station-nightly-universal.aab
          apk=$(find src-desktop/gen/android/app/build/outputs/apk/universal/release -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" cohort-android/station-nightly-universal.apk
          # Play receives this AAB, not the staged source tree. Extract its
          # base/assets record and require literal byte equality before either
          # provider upload or ledger claim can name this build.
          node scripts/read-android-build-provenance.mjs cohort-android/station-nightly-universal.aab --expected src-desktop/station-client-build.json --output cohort-android/station-client-build.json
          # The retained sibling APK is a separate packaging surface.
          node scripts/read-android-build-provenance.mjs cohort-android/station-nightly-universal.apk --expected src-desktop/station-client-build.json
          aapt="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt"; apksigner="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner"
          "$aapt" dump badging "$apk" | grep -F "package: name='io.kontourai.station.nightly'"
          node scripts/verify-android-aab-signature.mjs cohort-android/station-nightly-universal.aab "$ANDROID_UPLOAD_CERT_SHA256"
          node scripts/verify-android-apk-signature.mjs "$apk" "$ANDROID_UPLOAD_CERT_SHA256" "$apksigner"
          node scripts/check-android-16kb-alignment.mjs "$apk"
          # Prove the AAB carries exactly the ABI this build claims: an empty
          # or drifted ABI set would otherwise reach Play unnoticed.
          abis=$(unzip -Z1 cohort-android/station-nightly-universal.aab | sed -n 's#^base/lib/\([^/][^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          test "$abis" = 'arm64-v8a '
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cohort-android/station-nightly-universal.aab
            cohort-android/station-nightly-universal.apk
            cohort-android/station-client-build.json
      - name: Bind the exact staged Android inventory into a receipt
        run: |
          node scripts/release-cohort-workflow.mjs stage-input android-stage-input.json cohort/cohort-plan.json android station-nightly-universal.aab=cohort-android/station-nightly-universal.aab
          node scripts/release-cohort.mjs stage-receipt cohort/cohort-plan.json android-stage-input.json > android-stage-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-cohort-android-${{ github.run_id }}
          path: |
            cohort-android/station-nightly-universal.aab
            cohort-android/station-nightly-universal.apk
            cohort-android/station-client-build.json
            android-stage-receipt.json
          if-no-files-found: error
          retention-days: 14

  stage-macos:
    name: Build macOS (sign + notarize)
    needs: plan-cohort
    if: ${{ github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && needs.plan-cohort.outputs.build == 'true' }}
    runs-on: macos-15
    environment: native-release
    timeout-minutes: 120
    permissions: { contents: read, id-token: write, attestations: write }
    steps:
      - id: macos_cohort_deadline
        name: Reserve one fixed macOS cleanup deadline
        run: |
          cleanup_reserve_seconds=$((15 * 60))
          echo "epoch=$(( $(date -u +%s) + (120 * 60) - cleanup_reserve_seconds ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-cohort.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-cohort-plan-${{ github.run_id }}
          path: cohort
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with: { targets: aarch64-apple-darwin }
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-desktop
          key: macos-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fail closed and build/sign/notarize macOS staging artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_SIGNING_PUBLIC_KEY APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_DEVELOPER_ID_SIGNING_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY; do test -n "${!name}" || { echo "Missing required protected secret: $name" >&2; exit 1; }; done
          npm run dependencies:ci && npm run build:sdk && npm run build:connect
          printf '%s' "$TAURI_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/station-updater.pub"
          bundle_version=$(node -e 'console.log(require("./cohort/cohort-plan.json").versionIdentities.desktop.bundleVersion)')
          date=$(node -e 'const v=require("./cohort/cohort-plan.json").versionIdentities.desktop.bundleVersion; console.log(new Date(Date.UTC(2020,0,1)+Math.floor(Number(v)/100)*86400000).toISOString())')
          build=$((bundle_version % 100))
          node scripts/lib/nightly-build-identity.mjs --desktop --package-json package.json --tauri-config src-desktop/tauri.conf.json --date "$date" --build "$build" --updater-public-key-file "$RUNNER_TEMP/station-updater.pub" --updater-endpoint "https://github.com/${{ github.repository }}/releases/download/nightly-desktop/latest.json" --output "$RUNNER_TEMP/tauri.nightly-desktop.conf.json"
          test "$(node -e 'console.log(require(process.argv[1]).bundle.macOS.bundleVersion)' "$RUNNER_TEMP/tauri.nightly-desktop.conf.json")" = "$bundle_version"
          certificate="$RUNNER_TEMP/station-developer-id.p12"; keychain="$RUNNER_TEMP/station-developer-id.keychain-db"; state="$RUNNER_TEMP/station-developer-id-search-state.json"
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          node ops/release/macos-signing-readiness.mjs prepare --certificate "$certificate" --keychain "$keychain" --state "$state" --deadline-epoch "${{ steps.macos_cohort_deadline.outputs.epoch }}"
          version=$(node -e 'console.log(require("./cohort/cohort-plan.json").versionIdentities.desktop.version)')
          (cd src-desktop && STATION_BUILD_VERSION="$version" npx tauri build --no-sign --target aarch64-apple-darwin --config tauri.nightly.conf.json --config "$RUNNER_TEMP/tauri.nightly-desktop.conf.json")
          node ops/release/macos-signing-readiness.mjs unlock --keychain "$keychain" --deadline-epoch "${{ steps.macos_cohort_deadline.outputs.epoch }}"
          node ops/release/macos-signing-readiness.mjs probe --keychain "$keychain" --probe "$RUNNER_TEMP/station-developer-id-probe"
          app=$(find src-desktop/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit); test -n "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$bundle_version"
          notary_key="$RUNNER_TEMP/station-notary-api-key.p8"; printf '%s' "$APPLE_API_PRIVATE_KEY" > "$notary_key"; chmod 600 "$notary_key"
          node ops/release/macos-notarized-artifacts.mjs --app "$app" --identity "$APPLE_DEVELOPER_ID_SIGNING_IDENTITY" --notary-key "$notary_key" --notary-key-id "$APPLE_API_KEY_ID" --notary-issuer "$APPLE_API_ISSUER_ID" --assets-dir cohort-macos --release-tag nightly-desktop --architecture aarch64 --bundle-id io.kontourai.station.nightly --overlap-notarization --deadline-epoch "${{ steps.macos_cohort_deadline.outputs.epoch }}"
          archive=cohort-macos/station-nightly-desktop-macos-aarch64.app.tar.gz
          manifest_path=$(tar -tzf "$archive" | grep '/Contents/Resources/dist-server/station-build.json$')
          test "$(printf '%s\n' "$manifest_path" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          tar -xOf "$archive" "$manifest_path" > cohort-macos/station-client-build.json
          cmp src-desktop/station-client-build.json cohort-macos/station-client-build.json
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist")" = 'Station Nightly'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'io.kontourai.station.nightly'
          node scripts/lib/tauri-updater-manifest.mjs --version "$version" --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --platform darwin-aarch64 --signature-file cohort-macos/station-nightly-desktop-macos-aarch64.app.tar.gz.sig --url "https://github.com/${{ github.repository }}/releases/download/nightly-desktop/station-nightly-desktop-macos-aarch64.app.tar.gz" --release-tag nightly-desktop --notes "Staged cohort ${{ needs.plan-cohort.outputs.source_sha }}" --output cohort-macos/latest.json
      - name: Cleanup macOS Developer ID keychain
        if: always()
        run: |
          set +e
          node ops/release/macos-signing-readiness.mjs cleanup --keychain "$RUNNER_TEMP/station-developer-id.keychain-db" --state "$RUNNER_TEMP/station-developer-id-search-state.json"
          helper_status=$?
          rm -f "$RUNNER_TEMP/station-developer-id.p12" "$RUNNER_TEMP/station-developer-id-probe" "$RUNNER_TEMP/station-notary-api-key.p8"
          rm_status=$?
          test "$helper_status" -eq 0 && test "$rm_status" -eq 0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cohort-macos/latest.json
            cohort-macos/station-nightly-desktop-macos-aarch64.app.tar.gz
            cohort-macos/station-nightly-desktop-macos-aarch64.app.tar.gz.sig
            cohort-macos/station-nightly-desktop-macos-aarch64.dmg
            cohort-macos/station-client-build.json
      - name: Bind the exact staged macOS inventory into a receipt
        run: |
          node scripts/release-cohort-workflow.mjs stage-input macos-stage-input.json cohort/cohort-plan.json macos latest.json=cohort-macos/latest.json station-nightly-desktop-macos-aarch64.app.tar.gz=cohort-macos/station-nightly-desktop-macos-aarch64.app.tar.gz station-nightly-desktop-macos-aarch64.app.tar.gz.sig=cohort-macos/station-nightly-desktop-macos-aarch64.app.tar.gz.sig station-nightly-desktop-macos-aarch64.dmg=cohort-macos/station-nightly-desktop-macos-aarch64.dmg
          node scripts/release-cohort.mjs stage-receipt cohort/cohort-plan.json macos-stage-input.json > macos-stage-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-cohort-macos-${{ github.run_id }}
          path: |
            cohort-macos/
            macos-stage-receipt.json
          if-no-files-found: error
          retention-days: 14


  stage-ios:
    name: Build iOS
    needs: plan-cohort
    if: ${{ github.ref == 'refs/heads/main' && inputs.source_sha == github.sha && needs.plan-cohort.outputs.build == 'true' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    # `delivery: build` stops after the IPA is signed, audited, and retained as
    # the run-scoped staged artifact. Phase two uploads those exact bytes to
    # TestFlight only after Android and macOS promotion, so an iOS packaging
    # defect fails the Nightly here, before any provider effect.
    uses: ./.github/workflows/testflight-delivery.yml
    with:
      delivery: build
      channel: nightly
      source_sha: ${{ needs.plan-cohort.outputs.source_sha }}
      source_ref: refs/tags/${{ needs.plan-cohort.outputs.reservation_tag }}
      marketing_version: ${{ needs.plan-cohort.outputs.marketing_version }}
      bundle_version: ${{ needs.plan-cohort.outputs.bundle_version }}
      release_label: nightly-${{ needs.plan-cohort.outputs.bundle_version }}
      mobile_endpoint: ${{ vars.STATION_MOBILE_DEFAULT_ENDPOINT_NIGHTLY }}
      update_feed_url: ${{ vars.NATIVE_APP_UPDATE_FEED_URL }}
      update_provider_origin: ${{ vars.NATIVE_APP_UPDATE_PROVIDER_ORIGIN }}
      update_action_url: ${{ vars.NATIVE_APP_UPDATE_ACTION_URL }}
      update_action_kind: ${{ vars.NATIVE_APP_UPDATE_ACTION_KIND }}
      update_action_origins: ${{ vars.NATIVE_APP_UPDATE_ACTION_ORIGINS }}
    secrets: inherit
