name: Nightly gallery

on:
  schedule:
    # Gallery: 07:30 UTC daily, distinct from nightly.yml at 09:00 UTC.
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-diff:
    name: Capture and diff screenshot gallery
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, kontour-linux, heavy-host, playwright]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: kontourai/.github/actions/runner-preflight@1d267a33147d1ce5925ffd1f9aa0ef2063d0d7ef

      - name: Reserve physical host capacity
        uses: kontourai/.github/actions/physical-host-capacity@563effe7ec559c6f4fcc6c80b3532acb71d86373
        with:
          coordination-root: /mnt/e/kontour-runner-capacity
          host-id: desktop-win
          capacity-units: "10"
          lease-weight: "5"
          timeout-seconds: "600"
          owner-lifetime-seconds: "7800"

      - run: npm run dependencies:ci

      - name: Install repo-pinned Chromium
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" npx playwright install chromium

      - name: Capture screenshot bucket and enforce exact baseline
        run: |
          node scripts/run-e2e-coverage.mjs --only=screenshot
          npm run screenshot:diff

      - name: Upload gallery and pixel diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Storage trouble is infrastructure, while the preceding exact diff
        # command remains the rot alarm and fails this job on any mismatch.
        continue-on-error: true
        with:
          name: nightly-gallery-${{ github.run_id }}
          path: |
            gallery/
            gallery/diffs/
          if-no-files-found: ignore
          retention-days: 14
