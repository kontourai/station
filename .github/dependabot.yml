version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Grouped bumps must stay reviewable and landable. A group that mixes
      # majors with patches makes a routine patch wait on a compiler
      # migration: #11 and #953 both bundled TypeScript 5 -> 7, Vite 7 -> 8
      # and plugin-react 5 -> 6 with two vitest patches, so the whole group
      # sat red while vitest 4.1.11 (which was fine) could not land until it
      # was split out by hand (#950). Majors are excluded here so each
      # arrives as its own PR and can get the canary it needs (#918).
      frontend-tooling:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@vitejs/*"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "typescript"
          - "tsx"
      observability:
        patterns:
          - "@opentelemetry/*"
      aws:
        patterns:
          - "@aws-sdk/*"
          - "@smithy/*"
      # Catch-all for everything not claimed by a named group above: the
      # singletons (zod, ai, commander, @napi-rs/*, @kontourai/*, ...) each
      # opened their own PR, and every one consumed a merge-queue slot while
      # fighting the same pnpm-lock.yaml — each merge dequeued the rest as
      # DIRTY. One grouped PR per week costs one slot instead of ten.
      # Majors stay excluded per the policy above.
      runtime-and-ui-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vite 8 replaces Rollup with Rolldown. The entry bundle grows about
      # 80 KB gzip from finer chunking, not from added weight (#260, parent
      # #61), and the cross-chunk-cycle guard in vite.config.ts goes inert
      # (#262). plugin-react 6 peers vite ^8 only, so the two move together.
      # Remove both entries when the #260 lane lands the migration.
      - dependency-name: vite
        versions: ['>=8']
      - dependency-name: "@vitejs/plugin-react"
        versions: ['>=6']
      # AI SDK provider-spec v4 is one migration (#1227; #282): ai 7,
      # @ai-sdk/provider 4, provider-utils 5, and every provider major. It is
      # blocked upstream: @strands-agents/sdk peers @ai-sdk/provider ^3 and
      # types VercelModel on LanguageModelV3, and @voltagent/core peers ai ^6
      # and provider-utils 4.x. Station also implements LanguageModelV3 in
      # fleet-inference-model.ts. Minor and patch updates on the current line
      # keep flowing. Remove these entries when both upstreams admit v4.
      - dependency-name: ai
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@voltagent/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Desktop crates move together and touch the same Cargo.lock; one PR
      # per crate serialized the queue the same way the npm singletons did.
      # Majors stay separate (see the jni ignore below — that lesson).
      desktop-crates:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # jni 0.22 is a breaking API redesign, not a version bump: `from_raw` no
      # longer returns a Result and `attach_current_thread` became a scoped
      # callback instead of a guard. #1726 landed it without the code
      # migration and reddened main, and nothing caught it first because
      # build-android.yml runs on push to main rather than on pull requests.
      # Re-opening the same bump weekly re-presents a PR indistinguishable
      # from that one. Remove this entry as part of #1871, which does the
      # migration and verifies it by dispatching build-android.yml.
      - dependency-name: jni
        versions: ['>=0.22']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action bumps are SHA re-pins verified by the same contract tests; one
      # grouped PR replaces a queue slot per action (pnpm/setup alone needed
      # a companion pin edit — batching puts those edits in one review).
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
