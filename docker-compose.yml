services:
  station:
    image: ${STATION_IMAGE:-ghcr.io/kontourai/station:latest}
    ports:
      - "${STATION_BIND_HOST:-127.0.0.1}:${STATION_UI_PORT:-3000}:3000"
    environment:
      OTEL_SERVICE_NAME: station
      ALLOWED_ORIGINS: ${STATION_ALLOWED_ORIGINS:-}
    volumes:
      - station-data:/data/station
      - ${STATION_WORKSPACE_DIR:-station-workspace}:/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "/app/scripts/container-healthcheck.mjs"]

volumes:
  station-data:
  station-workspace:
